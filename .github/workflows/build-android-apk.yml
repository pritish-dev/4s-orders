name: Build Android APK

# Builds the installable Android APK for the 4S Orders mobile app.
# Fully isolated from the production web frontend/backend — it only reads files
# under mobile-app/ and never deploys anything.
#
# You get the APK two ways:
#   • Every run uploads it as a downloadable "Actions artifact"
#     (Actions tab → the run → Artifacts → 4S-Orders-apk).
#   • Running it manually with "Publish a GitHub Release" = true also attaches
#     the APK to a Release, giving a stable link you can open on a phone.

on:
  push:
    branches: ['**']
    paths:
      - 'mobile-app/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release with the APK attached'
        type: boolean
        default: false

# Needed only for the optional release step.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        run: npm ci

      - name: Inject backend URL from the API_URL secret
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          node -e "
          const fs = require('fs');
          const u = (process.env.API_URL || '').trim();
          const f = 'www/index.html';
          if (!u) { console.log('::warning::No API_URL secret set — app will ask for the URL on first launch.'); process.exit(0); }
          let s = fs.readFileSync(f, 'utf8');
          if (!s.includes('__BAKED_API_URL__')) { console.log('::warning::Placeholder __BAKED_API_URL__ not found; skipping.'); process.exit(0); }
          s = s.split('__BAKED_API_URL__').join(u);
          fs.writeFileSync(f, s);
          console.log('Injected backend URL into www/index.html.');
          "

      - name: Sync web assets into the native project
        run: npx cap sync android

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: mobile-app/android

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk 4S-Orders.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 4S-Orders-apk
          path: mobile-app/4S-Orders.apk
          if-no-files-found: error

      - name: Publish APK to a GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: 4S Orders (build ${{ github.run_number }})
          files: mobile-app/4S-Orders.apk
          body: |
            Installable Android build of the 4S Orders app.

            **To install:** download `4S-Orders.apk` on an Android phone, open it,
            and allow "install from unknown sources" if prompted.
