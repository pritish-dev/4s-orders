name: Stamp app version

# Guarantees that EVERY merge to master forces installed clients to pick up the
# new code — no manual version bump required.
#
# GitHub Pages serves the frontend files verbatim, and the web PWA + Android/iOS
# apps only refresh when their cache-busting version markers change. This job
# stamps those markers to the commit SHA on each push, so a forgotten manual bump
# can never leave devices stuck on stale code after a deploy.
#
# The push this job makes uses the built-in GITHUB_TOKEN, whose pushes do NOT
# trigger further workflow runs — so there is no risk of an infinite loop.

on:
  push:
    branches: [master]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'mobile-app/www/index.html'
      - 'scripts/stamp-version.mjs'
      - '.github/workflows/stamp-version.yml'
  workflow_dispatch: {}

permissions:
  contents: write

# Never let two stamps race each other.
concurrency:
  group: stamp-version
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Stamp version markers to the commit SHA
        run: node scripts/stamp-version.mjs "${GITHUB_SHA:0:7}"

      - name: Commit & push if anything changed
        run: |
          if git diff --quiet; then
            echo "Version markers already current — nothing to stamp."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js mobile-app/www/index.html mobile-app/www/version.json
          git commit -m "chore: stamp app version to ${GITHUB_SHA:0:7} [skip ci]"
          git push origin master
