name: Deploy Apps Script backend

# Pushes Code.gs to the Google Apps Script project, (re)deploys the web app, and
# — crucially — makes the deployment SELF-HEALING so the app can never again be
# stranded on a dead /exec URL:
#
#   1. Redeploy the known web-app deployment (keeps the same /exec URL).
#   2. If that deployment no longer exists, create a FRESH one automatically.
#   3. Capture whichever deployment id is now live, write its /exec URL into the
#      app (index.html + mobile-app/www/index.html), and remember the id in a
#      committed file so future runs reuse it (no URL churn).
#   4. If the URL changed, commit it back to master and kick off the Pages deploy
#      so the published app immediately points at the working backend.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLASPRC_JSON               Contents of your local ~/.clasprc.json after `clasp login`
#   APPS_SCRIPT_ID             The script ID of the Apps Script project
#   APPS_SCRIPT_DEPLOYMENT_ID  (optional) seed deployment id; once a deployment
#                              exists it is tracked in .apps_script_deployment_id
#
# See APPS_SCRIPT_DEPLOY.md for the full one-time setup.

on:
  push:
    branches: [master]
    paths:
      - 'Code.gs'
      - 'appsscript.json'
      - '.github/workflows/deploy-appsscript.yml'
  workflow_dispatch: {}

# Never let two deploys race each other.
concurrency:
  group: appsscript-deploy
  cancel-in-progress: false

# Needed to commit the resolved backend URL back to master and to dispatch Pages.
permissions:
  contents: write
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::CLASPRC_JSON secret is not set. See APPS_SCRIPT_DEPLOY.md."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Write .clasp.json
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          if [ -z "$APPS_SCRIPT_ID" ]; then
            echo "::error::APPS_SCRIPT_ID secret is not set. See APPS_SCRIPT_DEPLOY.md."
            exit 1
          fi
          printf '{ "scriptId": "%s", "rootDir": "." }\n' "$APPS_SCRIPT_ID" > .clasp.json

      - name: Push code to Apps Script (updates the editor / HEAD)
        run: clasp push --force

      - name: Diagnose Apps Script project access
        run: |
          set +e
          echo "===== clasp status ====="; clasp status 2>&1
          echo "===== clasp deployments ====="; clasp deployments 2>&1
          echo "===== clasp versions ====="; clasp versions 2>&1
          echo "(diagnostics only — never fails the job)"
          exit 0

      - name: Deploy the web app and capture the live /exec URL
        id: deploy
        env:
          SEED_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          set +e   # never let a clasp non-zero abort before we can print its output
          # Prefer a deployment id we've tracked in the repo; fall back to the seed secret.
          TRACKED="$(cat .apps_script_deployment_id 2>/dev/null | tr -d '[:space:]' || true)"
          TARGET="${TRACKED:-$SEED_DEPLOYMENT_ID}"
          ID=""

          if [ -n "$TARGET" ]; then
            echo "Redeploying existing deployment: $TARGET"
            OUT="$(clasp deploy --deploymentId "$TARGET" --description "CI ${GITHUB_SHA}" 2>&1)"
            RC=$?
            echo "$OUT"
            if [ $RC -eq 0 ]; then ID="$TARGET"; else
              echo "::warning::Redeploy to the tracked/seed deployment failed (rc=$RC) — it no longer exists. Creating a fresh web-app deployment."
            fi
          fi

          if [ -z "$ID" ]; then
            echo "Creating a new web-app deployment…"
            OUT="$(clasp deploy --description "CI ${GITHUB_SHA}" 2>&1)"
            RC=$?
            echo "----- clasp deploy (new) output (rc=$RC) -----"
            echo "$OUT"
            echo "----------------------------------------------"
            ID="$(printf '%s' "$OUT" | grep -oiE 'AKfyc[0-9A-Za-z_-]{20,}' | head -1)"
          fi

          if [ -z "$ID" ]; then
            echo "::error::Could not create or find a live web-app deployment. The Apps Script project (APPS_SCRIPT_ID) or its credentials appear to be missing — see the clasp output above."
            exit 1
          fi

          URL="https://script.google.com/macros/s/${ID}/exec"
          echo "Live web-app deployment id: $ID"
          echo "Live web-app URL:            $URL"
          echo "id=$ID"   >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Point the app at the live URL and commit if it changed
        env:
          DEP_ID: ${{ steps.deploy.outputs.id }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          # Track the deployment id so future runs reuse it (prevents URL churn).
          printf '%s\n' "$DEP_ID" > .apps_script_deployment_id

          # Rewrite the baked backend URL in both app copies.
          node -e '
            const fs = require("fs");
            const url = process.env.URL;
            const re = /(var BAKED_API_URL = ")[^"]*(";)/;
            for (const f of ["index.html", "mobile-app/www/index.html"]) {
              let s = fs.readFileSync(f, "utf8");
              if (re.test(s)) {
                const n = s.replace(re, `$1${url}$2`);
                if (n !== s) { fs.writeFileSync(f, n); console.log("updated backend URL in", f); }
                else { console.log("backend URL already current in", f); }
              } else {
                console.log("::warning:: BAKED_API_URL not found in " + f);
              }
            }
          '

          git add index.html mobile-app/www/index.html .apps_script_deployment_id
          if git diff --cached --quiet; then
            echo "Backend URL unchanged — the existing /exec URL is live again; no republish needed."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "CI: point app at live Apps Script deployment URL [skip appsscript]"
          git push origin HEAD:master

          echo "Committed the new backend URL. Dispatching the Pages deploy to publish it."
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/dispatches" \
            -d '{"ref":"master"}'
