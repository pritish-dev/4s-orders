name: Deploy Apps Script backend

# Pushes Code.gs to Google Apps Script and publishes the web app. The pipeline
# is SELF-HEALING and can even rebuild a lost backend with no manual steps:
#
#   1. Point clasp at the tracked/seed script id.
#   2. If that script is gone/inaccessible, CREATE a fresh standalone Apps Script
#      project automatically (clasp create) and track its new id.
#   3. Push Code.gs + appsscript.json (web app: execute as me / anyone anonymous).
#   4. Redeploy the tracked web-app deployment, or create a new one; capture the
#      live /exec URL.
#   5. Write that URL into index.html + mobile-app/www/index.html, remember the
#      script id and deployment id in the repo, and — if anything changed — commit
#      and kick off the Pages deploy so the published app uses the new backend.
#
# Secrets (Settings → Secrets and variables → Actions):
#   CLASPRC_JSON               Contents of ~/.clasprc.json after `clasp login`
#   APPS_SCRIPT_ID             (optional) seed script id; tracked in .apps_script_id
#   APPS_SCRIPT_DEPLOYMENT_ID  (optional) seed deployment id; tracked in
#                              .apps_script_deployment_id
#
# See APPS_SCRIPT_DEPLOY.md for the one-time credential setup.

on:
  push:
    branches: [master]
    paths:
      - 'Code.gs'
      - 'appsscript.json'
      - '.github/workflows/deploy-appsscript.yml'
  workflow_dispatch: {}

concurrency:
  group: appsscript-deploy
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::CLASPRC_JSON secret is not set. See APPS_SCRIPT_DEPLOY.md."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Ensure a script exists, push code, and publish the web app
        id: deploy
        env:
          SEED_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          SEED_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          set +e   # handle clasp non-zero exits ourselves so we can react/log

          # ---- Resolve which script id to target (tracked file wins over seed) ----
          SCRIPT_ID="$(cat .apps_script_id 2>/dev/null | tr -d '[:space:]' || true)"
          SCRIPT_ID="${SCRIPT_ID:-$SEED_SCRIPT_ID}"

          write_clasp() { printf '{ "scriptId": "%s", "rootDir": "." }\n' "$1" > .clasp.json; }

          ACCESSIBLE=0
          if [ -n "$SCRIPT_ID" ]; then
            write_clasp "$SCRIPT_ID"
            echo "Checking access to script $SCRIPT_ID …"
            if clasp deployments >/dev/null 2>&1; then
              ACCESSIBLE=1
              echo "Existing script is accessible."
            else
              echo "::warning::Script '$SCRIPT_ID' is not accessible (deleted or access lost) — will create a fresh backend."
            fi
          fi

          # ---- Create a brand-new backend if we have no accessible script ----
          if [ "$ACCESSIBLE" -ne 1 ]; then
            echo "Creating a new standalone Apps Script project…"
            cp appsscript.json /tmp/appsscript.json.keep   # clasp create overwrites the manifest
            rm -f .clasp.json
            OUT="$(clasp create --type standalone --title "4S Orders Backend (auto-recovered)" --rootDir . 2>&1)"
            echo "$OUT"
            cp /tmp/appsscript.json.keep appsscript.json    # restore our manifest (anyone-anonymous web app)
            SCRIPT_ID="$(node -e 'try{process.stdout.write((require("./.clasp.json").scriptId)||"")}catch(e){}')"
            if [ -z "$SCRIPT_ID" ]; then
              echo "::error::clasp create did not yield a script id. Output above."
              exit 1
            fi
            echo "New script id: $SCRIPT_ID"
          fi

          # ---- Push our code + manifest ----
          echo "Pushing code to $SCRIPT_ID …"
          clasp push --force || { echo "::error::clasp push failed."; exit 1; }

          # ---- Publish the web app; capture the live deployment id ----
          DEP_TRACKED="$(cat .apps_script_deployment_id 2>/dev/null | tr -d '[:space:]' || true)"
          DEP_TARGET="${DEP_TRACKED:-$SEED_DEPLOYMENT_ID}"
          ID=""
          if [ "$ACCESSIBLE" -eq 1 ] && [ -n "$DEP_TARGET" ]; then
            echo "Redeploying existing deployment $DEP_TARGET …"
            OUT="$(clasp deploy --deploymentId "$DEP_TARGET" --description "CI ${GITHUB_SHA}" 2>&1)"; RC=$?
            echo "$OUT"
            [ $RC -eq 0 ] && ID="$DEP_TARGET"
          fi
          if [ -z "$ID" ]; then
            echo "Creating a new web-app deployment…"
            OUT="$(clasp deploy --description "CI ${GITHUB_SHA}" 2>&1)"; RC=$?
            echo "----- clasp deploy (new) output (rc=$RC) -----"; echo "$OUT"; echo "----------------------------------------------"
            ID="$(printf '%s' "$OUT" | grep -oiE 'AKfyc[0-9A-Za-z_-]{20,}' | head -1)"
          fi
          if [ -z "$ID" ]; then
            echo "::error::Could not publish a web-app deployment — see clasp output above."
            exit 1
          fi

          URL="https://script.google.com/macros/s/${ID}/exec"
          echo "Live script id:     $SCRIPT_ID"
          echo "Live deployment id: $ID"
          echo "Live web-app URL:   $URL"
          echo "script_id=$SCRIPT_ID" >> "$GITHUB_OUTPUT"
          echo "dep_id=$ID"           >> "$GITHUB_OUTPUT"
          echo "url=$URL"             >> "$GITHUB_OUTPUT"

      - name: Point the app at the live URL and commit if anything changed
        env:
          SCRIPT_ID: ${{ steps.deploy.outputs.script_id }}
          DEP_ID: ${{ steps.deploy.outputs.dep_id }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          # Track the ids so future runs reuse them (no churn, and rebuild is sticky).
          printf '%s\n' "$SCRIPT_ID" > .apps_script_id
          printf '%s\n' "$DEP_ID"    > .apps_script_deployment_id

          # Rewrite the baked backend URL in both app copies.
          node -e '
            const fs = require("fs");
            const url = process.env.URL;
            const re = /(var BAKED_API_URL = ")[^"]*(";)/;
            for (const f of ["index.html", "mobile-app/www/index.html"]) {
              let s = fs.readFileSync(f, "utf8");
              if (re.test(s)) {
                const n = s.replace(re, `$1${url}$2`);
                if (n !== s) { fs.writeFileSync(f, n); console.log("updated backend URL in", f); }
                else { console.log("backend URL already current in", f); }
              } else { console.log("::warning:: BAKED_API_URL not found in " + f); }
            }
          '

          git add index.html mobile-app/www/index.html .apps_script_id .apps_script_deployment_id
          if git diff --cached --quiet; then
            echo "Nothing changed — existing backend URL is already live."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "CI: point app at live Apps Script backend [skip appsscript]"
          git push origin HEAD:master

          echo "Committed the new backend URL. Dispatching the Pages deploy to publish it."
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/dispatches" \
            -d '{"ref":"master"}'
