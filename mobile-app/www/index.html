            <Btn primary full icon={Icon.plus('#fff',15)} onClick={submit} disabled={!valid}>Add to order</Btn>
            <button onClick={onClose} style={{width:'100%',marginTop:8,background:'none',border:'none',color:T.ink4,fontSize:13,fontWeight:600,cursor:'pointer',padding:'8px 0'}}>Cancel</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function SearchScreen({ctx}) {
  const {items, priceItems, syncedAt, priceSyncedAt, nav, back, order, setOrder, syncPriceList, loading} = ctx;
  // Product Catalog map (photos + specs), looked up by each item's catKey. Read
  // from localStorage and re-parsed whenever the price list is re-synced.
  const catalog = React.useMemo(() => { try { return JSON.parse(localStorage.getItem('4s_catalog_v1')||'{}'); } catch { return {}; } }, [priceSyncedAt, priceItems.length]);
  const [preview, setPreview] = React.useState(null);
  const [manualEntry, setManualEntry] = React.useState(false);
  const [q,   setQ]   = useState('');
  const [cat, setCat] = useState('all');
  const cartCount = (order.items||[]).reduce((s,i)=>s+(i.qty||0),0);

  const hasPriceList = priceItems && priceItems.length > 0;
  const {priceSyncError} = ctx;

  // Only use price list items — never fall back to stock items for ordering.
  // Memoised so it is built once per data sync, NOT on every keystroke, and each
  // item carries a pre-lowercased search string so fuzzy matching stays cheap.
  const allItems = React.useMemo(() => {
    if (!hasPriceList) return [];
    const stockMap = {};
    (items||[]).forEach(it => { stockMap[it.code] = it; });
    return priceItems.map(pi => {
      const si = stockMap[pi.code];
      const it = si ? {...pi, stock:si.stock||[], mrp:si.mrp||pi.mrp||0, cpl:si.cpl||pi.cpl||0} : {...pi};
      it._s = ([it.cat, it.item, it.name].filter(Boolean).join(' ')).toLowerCase();
      it._c = (it.code || '').toLowerCase();
      return it;
    });
  }, [priceItems, items, hasPriceList]);

  // Categories + per-category counts, computed once per data change.
  const uniqueCats = React.useMemo(() => [...new Set(allItems.map(i => i.cat).filter(Boolean))].sort(), [allItems]);
  const catCounts  = React.useMemo(() => {
    const m = {}; allItems.forEach(i => { if (i.cat) m[i.cat] = (m[i.cat]||0) + 1; }); return m;
  }, [allItems]);

  React.useEffect(() => {
    const valid = ['all', ...uniqueCats];
    if (!valid.includes(cat)) setCat('all');
  }, [allItems.length]);

  const CATS = React.useMemo(() => [
    { key: 'all', label: 'All' + (allItems.length > 0 ? ' · ' + allItems.length : '') },
    ...uniqueCats.map(c => ({ key: c, label: c + ' · ' + (catCounts[c]||0) })),
  ], [allItems.length, uniqueCats, catCounts]);

  const bycat = React.useMemo(() => cat === 'all' ? allItems : allItems.filter(i => i.cat === cat), [allItems, cat]);

  // Defer the query for the heavy filtering so each keystroke paints instantly
  // (the input stays responsive; React runs the search in the background).
  const deferredQ = React.useDeferredValue(q);

  const {filtered, searchMode} = React.useMemo(() => {
    const { results, mode } = fuzzySearch(bycat, deferredQ);
    // When browsing (no query), group by room — Living Room → Bedroom → Dining →
    // Wardrobe & Storage → others — so the catalogue reads in a natural showroom
    // order. Search keeps relevance order untouched. Within each group, in-stock
    // items come first, then out-of-stock, then Made-To-Order; stable otherwise.
    const browsing = !deferredQ.trim();
    const sorted = results
      .map((it, i) => ({ it, i }))
      .sort((a, b) =>
        // Discontinued items always sink below every active (continued) item.
        ((a.it.discontinued ? 1 : 0) - (b.it.discontinued ? 1 : 0))
        || (browsing ? (roomRank(a.it, catalog[a.it.catKey]) - roomRank(b.it, catalog[b.it.catKey])) : 0)
        || (availabilityTier(a.it) - availabilityTier(b.it))
        || (a.i - b.i))
      .map(x => x.it);
    return { filtered: sorted, searchMode: mode };
  }, [bycat, deferredQ, catalog]);

  // Cap what we actually render so a broad browse / match never mounts thousands
  // of rows (the cause of scroll + typing jank). Extras are one tap away by
  // narrowing the search or category.
  const RENDER_CAP = 80;
  const shownItems = filtered.length > RENDER_CAP ? filtered.slice(0, RENDER_CAP) : filtered;

  function handleInput(e) { setQ(e.target.value); }

  function addToOrder(item) {
    const disc      = '';                       // per-item discount starts blank
    const basePrice = item.mrp||item.cpl||0;
    const unitPrice = basePrice;                // no discount applied until entered
    // "Change of Code" items: the order form / PDF must use the Alt Item code
    // even though the price list still lists the old code.
    const effCode   = item.altCode || item.code;
    const exists    = (order.items||[]).findIndex(x=>x.code===effCode);
    let newItems;
    if (exists>=0) {
      newItems = order.items.map((x,idx)=>idx===exists?{...x,qty:x.qty+1,total:(x.qty+1)*(x.unitPrice||x.mrp||x.cpl||0)}:x);
    } else {
      newItems = [...(order.items||[]),{
        code:effCode, priceCode:item.code, name:item.name, cat:item.cat, item:item.item||'',
        qty:1, mrp:item.mrp||item.cpl||0, cpl:item.cpl||item.mrp||0,
        unitPrice, total:unitPrice, disc,
        ageing:false, sweetner:false,
        discontinued:!!item.discontinued, discSince:item.discSince||'',
        branch:((item.stock||[]).filter(s=>s.q>0)[0]||{}).b||'',
        inStock:(item.stock||[]).reduce((s,x)=>s+x.q,0),
        // Warehouse tag for the sales-copy PDF: KB (ZBF11T) or 34S (ZBF34S).
        // Both warehouses are always offered in the order-form picker so the
        // salesperson can choose the delivery source even when the item isn't
        // stocked in one of them. whTag defaults to where the stock actually is
        // (34S preferred) and the salesperson can override it.
        whOptions:warehouseOptionsOf(item.stock),
        whTag:warehouseDefaultOf(item.stock),
        // Hand-entered item (not from the price list): item code, description and
        // price were typed by the salesperson.
        manual:!!item.manual,
      }];
    }
    setOrder({...order,items:newItems});
    const totalStock = (item.stock||[]).reduce((s,x)=>s+x.q,0);
    const oos = totalStock===0 && !item.manual;   // manual items have no stock — don't flag them OOS
    ctx.showToast(oos?item.name.slice(0,22)+'… added (OOS)':item.name.slice(0,30)+'… added', oos?'warn':'ok');
  }

  // Add a hand-entered item that isn't in the price list. The typed price is the
  // customer MRP (GST-inclusive); store the pre-GST base so the rest of the app —
  // which adds 18% GST for display — shows exactly what was typed.
  function addManualItem({code, name, price}) {
    const base = Number(price) / (1 + GST_RATE);
    addToOrder({ code, name, cat:'Manual entry', item:'', mrp:base, cpl:base, stock:[], manual:true });
    setManualEntry(false);
  }

  return (
    <div className="screen">
      <div style={{flexShrink:0}}>
        <StockRibbon syncedAt={syncedAt}/>
        <div style={{padding:'14px 18px 8px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:8}}>
          <div style={{display:'flex',alignItems:'center',gap:10,minWidth:0}}>
            <button onClick={back} title="Back" style={{width:32,height:32,borderRadius:6,background:'#fff',border:`1px solid ${T.line}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0}}>{Icon.back()}</button>
            <div style={{minWidth:0}}>
              <div style={{fontSize:11,color:T.ink4,fontFamily:T.mono,letterSpacing:1}}>
                {hasPriceList
                  ? <>PRICE LIST · {allItems.length} SKUs {priceSyncedAt&&<span style={{color:T.ok}}>· synced {istTime(priceSyncedAt)}</span>}</>
                  : <span style={{color:T.warn,fontWeight:700}}>PRICE LIST NOT LOADED</span>}
              </div>
              <div style={{fontSize:22,fontWeight:700,letterSpacing:-0.5,marginTop:2}}>{cartCount>0?'Add item':'Search items'}</div>
            </div>
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center',flexShrink:0}}>
            {cartCount>0&&<Btn size="sm" primary onClick={()=>nav('order')} icon={Icon.doc('#fff',15)}>Order · {cartCount}</Btn>}
          </div>
        </div>

        {/* Price list not loaded — prominent sync banner */}
        {!hasPriceList && (() => {
          const isSetup    = priceSyncError && priceSyncError.startsWith('SETUP_NEEDED');
          const isRedeploy = priceSyncError && priceSyncError.startsWith('REDEPLOY_NEEDED');
          const isNoUrl    = priceSyncError && priceSyncError.startsWith('NO_URL');
          const bg   = priceSyncError ? T.badSoft  : T.warnSoft;
          const bdr  = priceSyncError ? T.bad      : T.warn;
          const titC = priceSyncError ? T.bad      : T.warn;
          return (
            <div style={{margin:'0 18px 10px',padding:'14px 16px',background:bg,border:`1.5px solid ${bdr}`,borderRadius:8}}>
              {isSetup ? (
                <>
                  <div style={{fontSize:13,fontWeight:700,color:T.bad,marginBottom:8}}>⚙ One-time setup needed</div>
                  <div style={{fontSize:12,color:T.ink2,lineHeight:1.8,marginBottom:10}}>
                    In your OPS Google Sheet, create a tab named <b>Price_Lists</b> with these two columns:<br/>
                    <span style={{fontFamily:T.mono,fontSize:11,background:'#fff',padding:'2px 6px',borderRadius:3,display:'inline-block',marginTop:4}}>
                      Tab Name &nbsp;|&nbsp; Category
                    </span><br/><br/>
                    List each price list tab name and its category label, e.g.:<br/>
                    <span style={{fontFamily:T.mono,fontSize:11,background:'#fff',padding:'6px 8px',borderRadius:3,display:'block',marginTop:4,lineHeight:2}}>
                      HF &nbsp;&nbsp;&nbsp;&nbsp;| Home Furniture &amp; Storage<br/>
                      HS &nbsp;&nbsp;&nbsp;&nbsp;| Home Furniture &amp; Storage<br/>
                      Mattress | Mattress
                    </span><br/>
                    Then redeploy your Apps Script (Deploy → Manage → Edit → New version), and tap Sync below.
                  </div>
                </>
              ) : isRedeploy ? (
                <>
                  <div style={{fontSize:13,fontWeight:700,color:T.bad,marginBottom:6}}>Apps Script needs redeployment</div>
                  <div style={{fontSize:12,color:T.ink2,lineHeight:1.7,marginBottom:10}}>
                    Open your Apps Script project → Deploy → Manage deployments → click the pencil icon → choose <b>New version</b> → Deploy.<br/>
                    The URL stays the same.
                  </div>
                </>
              ) : isNoUrl ? (
                <>
                  <div style={{fontSize:13,fontWeight:700,color:T.warn,marginBottom:6}}>Apps Script URL not saved</div>
                  <div style={{fontSize:12,color:T.ink3,lineHeight:1.6,marginBottom:10}}>Go to <b>Me → Settings</b>, paste your Apps Script deployment URL, and tap Save URL.</div>
                </>
              ) : priceSyncError ? (
                <>
                  <div style={{fontSize:13,fontWeight:700,color:T.bad,marginBottom:6}}>Sync failed</div>
                  <div style={{fontSize:11,color:T.ink2,marginBottom:10,lineHeight:1.6,whiteSpace:'pre-wrap',fontFamily:T.mono,background:'#fff',borderRadius:4,padding:'8px 10px',border:`1px solid ${bdr}`}}>{priceSyncError.replace(/^[A-Z_]+: /,'')}</div>
                </>
              ) : (
                <>
                  <div style={{fontSize:13,fontWeight:700,color:titC,marginBottom:6}}>Price list not loaded yet</div>
                  <div style={{fontSize:12,color:T.ink3,marginBottom:10,lineHeight:1.5}}>
                    Make sure your Apps Script URL is saved in <b>Me → Settings</b>, then tap below.
                  </div>
                </>
              )}
              <Btn primary full icon={Icon.refresh('#fff',15)} onClick={syncPriceList} disabled={loading}>
                {loading ? 'Loading…' : priceSyncError ? 'Retry sync' : 'Load price list now'}
              </Btn>
            </div>
          );
        })()}

        {/* Search input */}
        {hasPriceList && (
          <div style={{padding:'0 18px 10px'}}>
            <div style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',background:'#fff',border:`1.5px solid ${T.green}`,borderRadius:8,boxShadow:`0 0 0 4px ${T.greenSoft}`}}>
              {Icon.search(T.ink3)}
              <input
                value={q}
                onChange={handleInput}
                onInput={handleInput}
                placeholder="Search by name, code or category…"
                style={{flex:1,border:'none',outline:'none',fontSize:15,color:T.ink,background:'transparent'}}
              />
              {q&&<span onClick={()=>setQ('')} style={{cursor:'pointer',lineHeight:1,padding:'0 2px'}}>{Icon.close(T.ink4)}</span>}
              {q&&<span style={{fontFamily:T.mono,fontSize:11,color:T.ink4,flexShrink:0}}>{filtered.length}</span>}
            </div>
            {/* Item not in the price list? Enter it by hand. */}
            <div style={{marginTop:8,textAlign:'center'}}>
              <span onClick={()=>setManualEntry(true)} style={{fontSize:12,color:T.green,fontWeight:700,cursor:'pointer',display:'inline-flex',alignItems:'center',gap:4}}>
                {Icon.plus(T.green,13)} Item not in the list? Add it manually
              </span>
            </div>
          </div>
        )}

        {/* Category chips */}
        {hasPriceList && (
          <div style={{padding:'0 18px 10px',display:'flex',gap:6,overflowX:'auto'}}>
            {CATS.map(c=>(
              <span key={c.key} onClick={()=>setCat(c.key)} style={{
                padding:'5px 13px', borderRadius:99, whiteSpace:'nowrap', cursor:'pointer', flexShrink:0,
                background:c.key===cat?T.ink:'#fff', color:c.key===cat?'#fff':T.ink2,
                border:`1px solid ${c.key===cat?T.ink:T.line}`, fontSize:12, fontWeight:600,
              }}>{c.label}</span>
            ))}
          </div>
        )}
      </div>

      <div className="scroll" style={{background:'#fff',borderTop:`1px solid ${T.line}`}}>
        {/* Search result banners — shown for every mode so user knows what happened */}
        {hasPriceList && q && searchMode==='exact' && filtered.length>0 && (
          <div style={{padding:'7px 18px',background:'#eaf6ef',borderBottom:`1px solid #b6dfc5`,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span style={{fontSize:12,color:T.ok,fontWeight:600}}>✓ {filtered.length} exact {filtered.length===1?'match':'matches'} for "{q}"</span>
          </div>
        )}
        {hasPriceList && q && searchMode==='near' && filtered.length>0 && (
          <div style={{padding:'7px 18px',background:T.warnSoft,borderBottom:`1px solid #e6cc95`,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span style={{fontSize:12,color:T.warn,fontWeight:600}}>~ {filtered.length} partial {filtered.length===1?'match':'matches'} for "{q}"</span>
            <span style={{fontSize:10,color:T.ink4}}>not all words found</span>
          </div>
        )}
        {hasPriceList && q && searchMode==='far' && filtered.length>0 && (
          <div style={{padding:'7px 18px',background:T.badSoft,borderBottom:`1px solid #e2b8b0`,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span style={{fontSize:12,color:T.bad,fontWeight:600}}>⚠ Loose match — "{q}" not found exactly</span>
            <span style={{fontSize:10,color:T.ink4}}>showing closest</span>
          </div>
        )}

        {shownItems.map((it,fi)=>{
          // Only warehouses that actually have availability are shown.
          const availStock = (it.stock||[]).filter(s=>s.q>0);
          const stockTotal = availStock.reduce((s,x)=>s+x.q,0);
          const hasStock   = (it.stock||[]).length > 0;
          const mto        = isMTOItem(it);
          const oos        = hasStock && stockTotal === 0 && !mto;
          const cplBase = Number(it.cpl) || Number(it.mrp) || 0;
          // MRP shown to the user = list price (CPL) with 18% GST already added in.
          const cpl = cplBase > 0 ? Math.round(cplBase * (1 + GST_RATE)) : 0;
          const catEntry = catalog[it.catKey];
          const thumb = catEntry && catEntry.images && catEntry.images[0];
          return (
            <div key={(it.code||it.name||'')+'|'+(it.sheet||'')+'|'+fi} onClick={()=>setPreview(it)} style={{padding:'12px 18px',borderBottom:`1px solid ${T.line}`,cursor:'pointer'}}>
              <div style={{display:'flex',gap:10}}>
                <ProductThumb src={thumb}/>
                <div style={{flex:1,minWidth:0}}>
                  {/* LN Description — always the primary product name */}
                  <div style={{fontSize:13,fontWeight:600,color:T.ink,lineHeight:1.35,marginBottom:4}}>{it.name}</div>
                  {/* Tags row: ITEM_GROUP category + item code + sheet + OOS */}
                  <div style={{display:'flex',alignItems:'center',gap:5,flexWrap:'wrap',marginBottom:4}}>
                    {it.item && <Pill tone="neutral" size="sm" style={{fontWeight:600}}>{it.item}</Pill>}
                    {/* Always show the correct code to order — the Alt code replaces
                        the old one for discontinued "change of code" items. */}
                    {(it.altCode||it.code) && <span style={{fontFamily:T.mono,fontSize:10,color:it.altCode?T.green:T.ink4,fontWeight:700}}>{it.altCode||it.code}</span>}
                    <Pill tone="neutral" size="sm">{(it.sheet||it.cat||'').toUpperCase()}</Pill>
                    {oos && <Pill tone="bad" size="sm">OUT OF STOCK</Pill>}
                    {it.discontinued && <Pill tone="bad" size="sm">DISCONTINUED{it.discSince?' since '+it.discSince:''}</Pill>}
                    {it.altCode && <Pill tone="warn" size="sm">REPLACES {it.code}</Pill>}
                  </div>
                  {/* Extra info (e.g. mattress thickness) */}
                  {it.extra && <div style={{fontSize:10,color:T.ink4,marginBottom:4}}>{it.extra}</div>}
                  {/* Stock chips — only warehouses that have stock available */}
                  <div style={{display:'flex',alignItems:'center',gap:5,flexWrap:'wrap'}}>
                    {availStock.length>0
                      ? availStock.map(s=><StockChip key={s.b} branch={s.b} count={s.q} low={s.q<3}/>)
                      : <span style={{fontSize:10,color:T.ink4}}>{mto?'Made to order':(hasStock?'No stock available':'Sync stock to see availability')}</span>}
                  </div>
                </div>
                {/* Price + Add */}
                <div style={{flexShrink:0,textAlign:'right',display:'flex',flexDirection:'column',alignItems:'flex-end',gap:8,paddingLeft:6}}>
                  <div>
                    <div style={{fontSize:9,color:T.ink4,fontWeight:700,letterSpacing:.5,textAlign:'right'}}>MRP</div>
                    <div style={{fontFamily:T.mono,fontSize:14,fontWeight:700,color:cpl>0?T.ink:T.ink4}}>
                      {cpl > 0 ? '₹' + cpl.toLocaleString('en-IN') : '—'}
                    </div>
                    {cpl > 0 && <div style={{fontSize:8,color:T.ink4,fontWeight:600,textAlign:'right',marginTop:1}}>incl. 18% GST</div>}
                  </div>
                  <button onClick={e=>{e.stopPropagation();addToOrder(it);}} style={{height:32,padding:'0 12px',borderRadius:6,background:oos?T.warn:T.green,color:'#fff',border:'none',fontSize:13,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',gap:4}}>
                    {Icon.plus('#fff',14)}{oos?'Book':'Add'}
                  </button>
                </div>
              </div>
            </div>
          );
        })}

        {/* More results exist than we render — nudge the user to narrow down. */}
        {filtered.length>shownItems.length&&(
          <div style={{padding:'12px 18px',textAlign:'center',fontSize:12,color:T.ink4,background:T.paper}}>
            Showing first {shownItems.length} of {filtered.length} — {q?'refine your search':'pick a category or search'} to see the rest.
          </div>
        )}

        {/* Empty states */}
        {hasPriceList&&filtered.length===0&&q&&(
          <div style={{padding:40,textAlign:'center'}}>
            <div style={{fontSize:15,fontWeight:700,color:T.bad,marginBottom:8}}>No match found</div>
            <div style={{fontSize:13,color:T.ink4,lineHeight:1.6,marginBottom:16}}>"{q}" is not in the {cat!=='all'?cat+' ':''}price list.</div>
            <div style={{fontSize:12,color:T.ink4,lineHeight:1.7,marginBottom:18}}>
              <b>Tips:</b><br/>
              • Try fewer words: <i>osiris</i> instead of <i>osiris media unit blue</i><br/>
              • Use the product series name or item code<br/>
              • Switch category (All / Home Furniture & Storage / Mattress)
            </div>
            <Btn primary icon={Icon.plus('#fff',15)} onClick={()=>setManualEntry(true)}>Add "{q}" as a manual item</Btn>
            <div style={{fontSize:11,color:T.ink4,marginTop:8}}>Enter the item code, description &amp; price by hand.</div>
          </div>
        )}
        {hasPriceList&&filtered.length===0&&!q&&(
          <div style={{padding:32,textAlign:'center',fontSize:13,color:T.ink4}}>No items in this category.</div>
        )}
        <div style={{height:8}}/>
      </div>
      {cartCount>0&&(
        <div onClick={()=>nav('order')} style={{flexShrink:0,display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,padding:'12px 16px',background:T.green,color:'#fff',cursor:'pointer'}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            {Icon.doc('#fff',18)}
            <span style={{fontSize:14,fontWeight:700}}>{cartCount} item{cartCount>1?'s':''} in this order</span>
          </div>
          <span style={{fontSize:13,fontWeight:700,display:'flex',alignItems:'center',gap:4}}>Continue booking →</span>
        </div>
      )}
      {preview && <ProductSheet item={preview} cat={catalog[preview.catKey]} onClose={()=>setPreview(null)} onAdd={()=>{addToOrder(preview);setPreview(null);}}/>}
      {manualEntry && <ManualItemSheet initialName={q} onClose={()=>setManualEntry(false)} onAdd={addManualItem}/>}
      <BottomNav screen="search" nav={nav}/>
    </div>
  );
}

// ─── Order Form ──────────────────────────────────────────────
function OrderFormScreen({ctx}) {
  const {order,setOrder,nav,back,user,doSaveOrder,doDeleteOrder,doUpdateDelivery} = ctx;
  const o = order;
  const [partialPicker,setPartialPicker] = React.useState(false);
  const [reschedulePicker,setReschedulePicker] = React.useState(false);
  // Delivery-status change: "Partial Delivery" opens the item picker so we can
  // record which items are delivered (the rest stay Pending for Delivery).
  // "Rescheduled for Delivery" opens a date picker to set the new delivery date.
  function handleDeliveryChange(val){
    // Block Delivered / Installation Done until the order is fully paid
    // (order amount == earnest + money-receipt amounts).
    if((/^delivered/i.test(val) || /installation done/i.test(val)) && !canMarkDelivered(o)){
      const bal = Math.round(orderReceived(o).balance);
      ctx.showToast('Can’t mark "'+val+'" — ₹'+bal.toLocaleString('en-IN')+' still due. Collect full payment first.','bad');
      return;
    }
    if(/partial/i.test(val)){ setPartialPicker(true); return; }
    if(/rescheduled/i.test(val)){ setReschedulePicker(true); return; }
    setOrder(prev=>({...prev,deliveryStatus:val}));
  }
  async function confirmPartialDelivery(deliveredItems){
    setPartialPicker(false);
    setOrder(prev=>({...prev,deliveryStatus:'Partial Delivery',deliveredItems}));
    // Persist immediately if the order already exists (the plain save path does
    // not carry the delivered-items list).
    if(order.no) await doUpdateDelivery(order.no, order.internalNo, 'Partial Delivery', deliveredItems);
  }
  async function confirmReschedule(newDate){
    setReschedulePicker(false);
    if(!newDate) return;
    setOrder(prev=>({...prev,deliveryStatus:'Rescheduled for Delivery',plannedDly:newDate,followUp:followUpFromDelivery(newDate)||prev.followUp}));
    // Persist the new date immediately if the order already exists.
    if(order.no) await doUpdateDelivery(order.no, order.internalNo, 'Rescheduled for Delivery', null, newDate);
  }
  // Admins can permanently delete an already-saved order straight from the edit screen.
  const isAdmin = normRole(user?.role) === 'admin';
  // A DRAFT stays fully editable by everyone until it is submitted. Once the
  // order is submitted (its PDF has been generated), the sales team can only EDIT
  // its WON (Godrej SO No), money-receipt no/date and delivery status. Admins may
  // always edit everything; a draft or brand-new order is fully editable.
  const restricted = isOrderSubmitted(o) && !isAdmin;
  // Measurement entry unit — 'cm' (default) or 'ft' (feet + inches). Only the
  // input changes; every value is stored in cm on the order and the Google sheet.
  const [measUnit,setMeasUnit] = React.useState('cm');
  async function handleDelete() {
    if(!isAdmin || !o.no) return;
    if(!window.confirm('Permanently delete order '+(o.no||'')+' for '+(o.customer||'this customer')+'? This removes it from the CRM sheet and cannot be undone.')) return;
    const ok = await doDeleteOrder(o.no, o.internalNo);
    if(ok){ setOrder(BLANK_ORDER()); nav('history'); }
  }
  const setF = (k,v) => setOrder(prev=>({...prev,[k]:v}));

  // ── CRM autofill ──────────────────────────────────────────────────────────
  // When the mobile number of a RETURNING customer is typed on a brand-new order,
  // fetch their last-recorded profile from the CRM and pre-fill the empty fields
  // (name, address, email, GST…). Works no matter how many times they've ordered
  // before. Never overwrites anything the salesperson has already typed.
  const {doLookupCustomer, showToast} = ctx;
  const lookupTimer   = React.useRef(null);
  const lookedUpPhone = React.useRef('');
  const [crmMatch,setCrmMatch]   = React.useState(null);
  // idle | searching | found | none | error — drives the status line under Phone.
  const [crmStatus,setCrmStatus] = React.useState('idle');
  function runCustomerLookup(rawPhone, force){
    const digits = String(rawPhone||'').replace(/\D/g,'').slice(-10);
    if(digits.length!==10 || o.no) return;         // only auto-fill a brand-new order
    if(!force && digits===lookedUpPhone.current) return;   // already looked this one up
    lookedUpPhone.current = digits;
    setCrmMatch(null);
    setCrmStatus('searching');
    doLookupCustomer(digits).then(r=>{
      if(r && r.status==='found'){
        const m = r.data;
        setCrmMatch(m);
        setCrmStatus('found');
        setOrder(prev=>{
          const fill = (k,v)=> (v && !String(prev[k]||'').trim()) ? v : prev[k];
          // Use whatever address the record has for the DELIVERY address (and
          // billing); the two fall back to each other so the delivery address is
          // filled whenever any address exists. Sales can edit it if it changed.
          const addr = m.delivery || m.billing || '';
          // Repeat-customer purchase pattern, from the count of PREVIOUS orders:
          //   1 previous → 2nd Time · 2 previous → 3rd Time · 3+ previous → More than 3.
          const nPrev = Number(m.orderCount)||0;
          const pattern = nPrev>=3 ? 'More than 3' : nPrev===2 ? '3rd Time' : nPrev>=1 ? '2nd Time' : '';
          const curPat  = Array.isArray(prev.purchasePattern) ? prev.purchasePattern : [];
          return {...prev,
            customer: fill('customer', m.customer),
            delivery: fill('delivery', m.delivery || addr),
            billing:  fill('billing',  m.billing  || addr),
            pincode:  fill('pincode',  m.pincode),
            floor:    fill('floor',    m.floor),
            landmark: fill('landmark', m.landmark),
            email:    fill('email',    m.email),
            gstNumber:fill('gstNumber',m.gstNumber),
            alt:      fill('alt',      m.alt),
            dob:      fill('dob',      m.dob),
            anniversary: fill('anniversary', m.anniversary),
            // Repeat customer → set the purchase pattern from their order history
            // (authoritative: it reflects the real count, overriding any stale pick).
            purchasePattern: pattern ? [pattern] : curPat,
          };
        });
        const n = Number(m.orderCount)||1;
        const pat = n>=3 ? 'More than 3' : n===2 ? '3rd Time' : '2nd Time';
        showToast('Returning customer · '+n+' previous order'+(n>1?'s':'')+' · '+pat+' — details filled','ok');
      } else if (r && r.status==='none'){
        setCrmStatus('none');
      } else {
        setCrmStatus('error');
        lookedUpPhone.current = '';   // let the same number be retried
      }
    });
  }
  function onPhoneChange(v){
    setF('phone', v);
    const d = String(v||'').replace(/\D/g,'');
    if(d.length < 10){ setCrmMatch(null); setCrmStatus('idle'); lookedUpPhone.current=''; }
    if(lookupTimer.current) clearTimeout(lookupTimer.current);
    // Search as soon as a full 10-digit number is present (debounced).
    lookupTimer.current = setTimeout(()=>runCustomerLookup(v), 450);
  }

  const {itemsSubtotal, orderDiscPct, orderDiscAmt, taxable, cgst, sgst, total, earnest, balance} = orderTotals(o);
  // Guided-form: once the user has tried to save, the validation summary + step
  // progress stay live so they can see what's left and jump straight to it.
  const [triedSave,setTriedSave] = React.useState(false);
  const scrollToSec = sec => { try{ const el=document.getElementById('sec-'+sec); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }catch(e){} };

  // Manager / Admin see cost + margin; Sales does not.
  const priv        = hasManagerAccess(user);
  const totalCost   = (o.items||[]).reduce((s,it)=>s+((Number(it.cpl)||Number(it.mrp)||0)*(it.qty||0)),0);
  // Margin compares the pre-GST selling value (tax carved out) against pre-GST cost.
  const totalMargin = taxable - totalCost;

  // A sofa (incl. Upmods modular sofa) or a modular wardrobe (Kalista /
  // Kreation X2 / X3) in the cart makes its measurements mandatory.
  const hasSofa     = (o.items||[]).some(isSofaItem);
  const hasWardrobe = (o.items||[]).some(isWardrobeItem);
  // Number of modular-wardrobe line items — used to seed the "how many modular
  // furnitures" picker the first time the block is shown.
  const wardrobeItemCount = (o.items||[]).filter(isWardrobeItem).length;
  const AWARENESS  = ['Social Media','Whatsapp','Newspaper','Friends & Relatives','Website','Others'];
  const PATTERNS   = ['1st Time','2nd Time','3rd Time','More than 3'];
  const PURCHASING = ['New Home','Renovation','Rented Home','Other'];
  const LIFT_TYPES = ['Standard Lift','Goods Lift','Service Lift'];

  // A ground-floor delivery needs no staircase carry, so its measurements are
  // never required. Treat FLOOR values of 0 / G / GF / "Ground floor" /
  // "Groundfloor" (any spacing/casing) as ground floor.
  const isGroundFloor = (() => {
    const f = String(o.floor||'').toLowerCase().replace(/\s+/g,'');
    return f==='0' || f==='g' || f==='gf' || f==='groundfloor' || f==='ground';
  })();

  // Staircase measurements are only needed for a SOFA when there is NO lift AND
  // the delivery is above the ground floor.
  const needStaircase = hasSofa && o.liftAvailable==='No' && !isGroundFloor;

  // ── Multi-block measurement state ──────────────────────────────────────
  // Normalise older orders (single wardrobe scalars) into the wardrobes[] /
  // rooms[] / liftTypes[] arrays the UI now works with. Staircase stays a set of
  // order-level scalars (sofa-only, no-lift) — it is no longer per-furniture.
  React.useEffect(()=>{
    setOrder(prev=>{
      const patch={};
      if(!Array.isArray(prev.liftTypes)) patch.liftTypes = [];
      if(!Array.isArray(prev.rooms))     patch.rooms = [];
      if(!Array.isArray(prev.wardrobes)) {
        patch.wardrobes = (prev.wardrobeLength||prev.wardrobeWidth||prev.wardrobeHeight)
          ? [{name:'',length:prev.wardrobeLength||'',width:prev.wardrobeWidth||'',height:prev.wardrobeHeight||''}]
          : [];
      }
      return Object.keys(patch).length ? {...prev,...patch} : prev;
    });
  },[o.no]);

  // Pre-fill the Receipt No preview for a brand-new normal booking with the next
  // app-order serial (1, 2, 3 …), so it shows in the "Order No" box and on the PDF
  // straight away. The number is a PEEK at the backend's stored serial counter —
  // authoritative and independent of any sheet data, so no big/garbage value can
  // appear. It's provisional until save: the backend atomically allocates the real
  // serial when the order is saved. When offline we simply leave it blank (the box
  // shows "…") rather than guess — the correct number is stamped on sync. Manual
  // orders start blank (typed in from the paper order).
  React.useEffect(()=>{
    if(o.no || o.manualOrder) return;
    if(o.orderFormReceiptNo && String(o.orderFormReceiptNo).trim()) return;
    let cancelled=false;
    (async()=>{
      const n = await ctx.getNextReceipt();
      if(cancelled || n==null) return;   // offline / unreachable → leave blank, stamped on save
      setOrder(prev=> (prev.no || prev.manualOrder || (prev.orderFormReceiptNo && String(prev.orderFormReceiptNo).trim()))
        ? prev
        : {...prev, orderFormReceiptNo:String(n)});
    })();
    return ()=>{ cancelled=true; };
  },[o.no, o.manualOrder]);

  const liftTypes = Array.isArray(o.liftTypes) ? o.liftTypes : [];
  const wardrobes = Array.isArray(o.wardrobes) ? o.wardrobes : [];
  const rooms     = Array.isArray(o.rooms)     ? o.rooms     : [];

  function toggleLiftType(t){ setOrder(prev=>{ const cur=Array.isArray(prev.liftTypes)?prev.liftTypes:[]; return {...prev,liftTypes: cur.includes(t)?cur.filter(x=>x!==t):[...cur,t]}; }); }
  const BLANK_WARDROBE = ()=>({name:'',length:'',width:'',height:''});
  const BLANK_ROOM     = ()=>({name:'',width:'',height:'',depth:''});
  function setWardrobeCount(n){ setOrder(prev=>{ const cur=Array.isArray(prev.wardrobes)?prev.wardrobes.map(w=>({...w})):[]; const next=[]; for(let i=0;i<n;i++) next.push(cur[i]||BLANK_WARDROBE()); return {...prev,wardrobes:next}; }); }
  function setWardrobeField(idx,field,val){ setOrder(prev=>{ const arr=(Array.isArray(prev.wardrobes)?prev.wardrobes:[]).map(w=>({...w})); if(arr[idx]) arr[idx][field]=val; return {...prev,wardrobes:arr}; }); }
  function setRoomCount(n){ setOrder(prev=>{ const cur=Array.isArray(prev.rooms)?prev.rooms.map(r=>({...r})):[]; const next=[]; for(let i=0;i<n;i++) next.push(cur[i]||BLANK_ROOM()); return {...prev,rooms:next}; }); }
  function setRoomField(idx,field,val){ setOrder(prev=>{ const arr=(Array.isArray(prev.rooms)?prev.rooms:[]).map(r=>({...r})); if(arr[idx]) arr[idx][field]=val; return {...prev,rooms:arr}; }); }
  // Seed the modular-furniture and room blocks the first time they're shown when
  // a modular wardrobe is in the cart (sales can still change either count).
  React.useEffect(()=>{
    if(hasWardrobe && Array.isArray(o.wardrobes) && o.wardrobes.length===0) setWardrobeCount(Math.max(1,wardrobeItemCount));
    if(hasWardrobe && Array.isArray(o.rooms) && o.rooms.length===0) setRoomCount(1);
  },[hasWardrobe,wardrobeItemCount]);

  function removeItem(idx) { setOrder(prev=>({...prev,items:prev.items.filter((_,i)=>i!==idx)})); }
  function toggleScheme(idx,key) { setOrder(prev=>({...prev,items:prev.items.map((it,i)=>i===idx?{...it,[key]:!it[key]}:it)})); }
  function togglePattern(p) { setOrder(prev=>{ const cur=prev.purchasePattern||[]; return {...prev,purchasePattern: cur.includes(p)?cur.filter(x=>x!==p):[...cur,p]}; }); }
  function updateItemQty(idx,delta) {
    setOrder(prev=>({...prev,items:prev.items.map((it,i)=>{
      if(i!==idx) return it;
      const newQty = Math.max(1,it.qty+delta);
      const baseP = it.mrp||it.cpl||0;
      const up = it.unitPrice!==undefined ? it.unitPrice : Math.round(baseP*(1-(parseFloat(it.disc)||0)/100));
      return {...it,qty:newQty,unitPrice:up,total:newQty*up};
    })}));
  }

  // Every required-field / validity check, collected into one list (instead of
  // stopping at the first) so the guided form can show a full "what's still
  // needed" summary and light up the step progress bar. Each error is tagged with
  // its section id so tapping it (or the Save button) jumps straight there. The
  // rules mirror the original one-at-a-time guards exactly.
  function collectErrors() {
    const e = []; const add = (sec,msg) => e.push({sec,msg});
    if(!o.customer) add('customer','Customer name is required');
    if(!o.phone) add('customer','Phone number is required');
    else if(!isValidPhone(o.phone)) add('customer','Enter a valid 10-digit mobile number');
    if(o.alt && !isValidPhone(o.alt)) add('customer','Alt. phone is not a valid mobile number');
    if(!o.email) add('customer','E-mail is required');
    else if(!isValidEmail(o.email)) add('customer','Enter a valid email address');
    if(!o.gstNumber||!String(o.gstNumber).trim()) add('customer','Customer GST No. is required');
    if(!o.awareness) add('customer','Select the Lead Source');
    if(!o.purchasePattern||o.purchasePattern.length===0) add('customer','Select the purchase pattern');
    if(!o.purchasingFor) add('customer','Select what they are purchasing for');
    if(o.manualOrder && !o.date) add('customer','Set the Booking Date for the manual order');
    if(!o.delivery) add('address','Delivery address is required');
    if(!o.pincode||!String(o.pincode).trim()) add('address','Pincode is required');
    else if(!/^\d{6}$/.test(String(o.pincode).trim())) add('address','Enter a valid 6-digit pincode');
    if(!o.floor) add('address','Floor is required');
    if(!o.landmark) add('address','Nearest landmark is required');
    if(!o.liftAvailable) add('address','Select whether a lift is available');
    if(o.liftAvailable==='Yes' && (!Array.isArray(o.liftTypes)||o.liftTypes.length===0)) add('address','Select the lift type (Standard / Goods / Service)');
    const addrDiffer = (o.billing||'').trim() && (o.delivery||'').trim() && (o.billing||'').trim()!==(o.delivery||'').trim();
    if(addrDiffer && (!o.contactPersonName||!o.contactNumber)) add('address','Delivery Contact Person Name & Number are required (addresses differ)');
    if(o.contactNumber && !isValidPhone(o.contactNumber)) add('address','Contact number is not a valid mobile number');
    if(hasSofa && (!o.sofaWidth||!o.sofaHeight||!o.sofaDepth)) add('measure','Enter Sofa width, height & depth');
    if(hasSofa && (!o.entryDoorWidth||!o.entryDoorHeight)) add('measure','Enter Entry Door width & height');
    if(needStaircase && (!o.staircaseWidth||!o.landingLength||!o.landingWidth||!o.landingDepth)) add('measure','Enter Staircase width & the landing area length/width/depth');
    if(hasWardrobe){
      if(!wardrobes.length) add('measure','Add at least one modular furniture measurement');
      for(let i=0;i<wardrobes.length;i++){ const w=wardrobes[i];
        if(!w.length||!w.width||!w.height) add('measure',`Enter length, width & height for Modular Furniture ${i+1}`);
      }
      if(!rooms.length) add('rooms','Add at least one room measurement (mandatory for modular furniture)');
      for(let i=0;i<rooms.length;i++){ const r=rooms[i];
        if(!r.name||!(r.name||'').trim()) add('rooms',`Enter the room name for Room ${i+1}`);
        if(!r.width||!r.height||!r.depth) add('rooms',`Enter width, height & depth for Room ${i+1}`);
      }
    }
    if(!o.items||o.items.length===0) add('items','Add at least one item');
    // An existing order (already saved / loaded for edit) already carries its SI No,
    // Order No and Receipt No — never re-prompt for them on an edit, only require
    // them when creating a brand-new order.
    const isExistingOrder = !!(String(o.no||'').trim() || o.internalNo);
    if(!isExistingOrder && (!o.slNo||!String(o.slNo).trim())) add('internal','SI No is required');
    if(!isExistingOrder && o.manualOrder && (!o.orderFormReceiptNo||!String(o.orderFormReceiptNo).trim())) add('internal','Receipt No is required for a manual order');
    if(!o.paymentMode||!String(o.paymentMode).trim()) add('payment','Select the Payment Mode');
    if(!o.moneyReceipts||!o.moneyReceipts[0]||!String(o.moneyReceipts[0].no||'').trim()) add('payment','Money Receipt No is required');
    return e;
  }

  async function handleSave() {
    setTriedSave(true);
    const errs = collectErrors();
    if(errs.length){
      ctx.showToast(errs.length+' field'+(errs.length>1?'s':'')+' still need'+(errs.length>1?'':'s')+' attention','bad');
      scrollToSec(errs[0].sec);
      return;
    }
    // Lead Source is now the awareness dropdown — keep the OPS "Source" column in sync.
    // This is the finalise/submit path: mark the order SUBMITTED so it locks down
    // for the sales team (only WON / money receipts / delivery stay editable).
    // Whether this is a brand-new placement (vs. re-saving an already-submitted
    // order, e.g. an admin edit) decides if we fire the celebration below.
    const wasAlreadyPlaced = isOrderSubmitted(o);
    const saved = await doSaveOrder(withMeasurements({...o,orderStatus:'submitted',salesExec:o.salesExec||user?.name||'',source:o.awareness||o.source||'',followUp:o.followUp||followUpFromDelivery(o.plannedDly)}));
    if(saved) {
      setOrder(saved);
      // Celebrate a genuinely new order the moment it's placed.
      if(!wasAlreadyPlaced) { try { ctx.showCelebration({no:saved.no, customer:saved.customer, amt:orderTotals(saved).total}); } catch(e){} }
      nav('pdf');
    }
  }

  // Mirror the first modular-furniture block onto the legacy scalar wardrobe
  // fields so the existing WARDROBE sheet columns and any old readers stay
  // populated. Staircase is already order-level, so it needs no mirroring.
  function withMeasurements(ord){
    const ws = Array.isArray(ord.wardrobes)?ord.wardrobes:[];
    const w0 = ws[0]||{};
    return {...ord,
      wardrobeLength:w0.length||'', wardrobeWidth:w0.width||'', wardrobeHeight:w0.height||'',
    };
  }

  // Save whatever has been filled so far (no strict validation) so the order
  // lands in history and any teammate can reopen and continue it later.
  async function handleSaveDraft() {
    if(!o.customer) return ctx.showToast('Enter at least the customer name to save a draft','bad');
    if(!o.items||o.items.length===0) return ctx.showToast('Add at least one item to save a draft','bad');
    // Save Draft keeps the order editable by everyone — mark it a DRAFT (never
    // downgrade an already-submitted order: the backend guards against that too).
    const saved = await doSaveOrder(withMeasurements({...o,orderStatus:isOrderSubmitted(o)?'submitted':'draft',salesExec:o.salesExec||user?.name||'',source:o.awareness||o.source||'',followUp:o.followUp||followUpFromDelivery(o.plannedDly)}));
    if(saved) { setOrder(saved); ctx.showToast('Draft saved — you can reopen it from Orders','ok'); }
  }

  // Sales-team restricted edit: only WON, money receipts + dates, and delivery
  // status are editable. Everything else stays read-only (admins get the full form).
  async function handleRestrictedSave(){
    const saved = await doSaveOrder(withMeasurements({...o,salesExec:o.salesExec||user?.name||''}));
    if(saved){ setOrder(saved); ctx.showToast('Order updated ✓','ok'); nav('history'); }
  }
  const setMRestricted=(i,field,val)=>setOrder(prev=>{const arr=(prev.moneyReceipts||[{no:'',date:''},{no:'',date:''},{no:'',date:''}]).map(x=>({...x})); while(arr.length<3)arr.push({no:'',date:''}); arr[i]={...arr[i],[field]:val}; return {...prev,moneyReceipts:arr,receiptNo: field==='no'&&i===0?val:prev.receiptNo}; });
  if(restricted){
    return (
      <div className="screen">
        <div style={{display:'flex',alignItems:'center',gap:8,padding:'10px 14px',background:T.paper,borderBottom:`1px solid ${T.line}`,flexShrink:0}}>
          <button onClick={back} title="Back" style={{width:32,height:32,borderRadius:6,background:'#fff',border:`1px solid ${T.line}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>{Icon.back()}</button>
          <button onClick={()=>nav('home')} title="Home" style={{width:32,height:32,borderRadius:6,background:'#fff',border:`1px solid ${T.line}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>{Icon.home(T.ink2,18)}</button>
          <div>
            <div style={{fontSize:17,fontWeight:700,letterSpacing:-0.4}}>Update order</div>
            <div style={{fontSize:10,color:T.ink4,fontFamily:T.mono}}>{o.no}</div>
          </div>
        </div>
        <div className="scroll">
          {/* Read-only order summary */}
          <div style={{padding:'12px 14px',background:'#fff',borderBottom:`1px solid ${T.line}`}}>
            <div style={{fontSize:16,fontWeight:700}}>{o.customer||'—'}</div>
            <div style={{fontSize:11,color:T.ink4,fontFamily:T.mono,marginTop:2}}>{o.phone||''} · {o.date||''}</div>
            <div style={{fontSize:11,color:T.ink4,fontFamily:T.mono,marginTop:2}}>Order No (Sl / Receipt): {(o.slNo||o.internalNo||'—')} / {(o.orderFormReceiptNo||o.internalNo||'—')}</div>
          </div>
          <div style={{padding:'9px 14px',background:T.warnSoft,color:T.warn,fontSize:11,fontWeight:600,lineHeight:1.5}}>
            Sales access — you can update the <b>WON (Godrej SO No)</b>, <b>Money Receipt No &amp; date</b> and the <b>Delivery Status</b>. Other fields can be changed by an admin.
          </div>
          <SectionHead n="01" label="Godrej SO / WON"/>
          <Field label="WON (Godrej SO No)" value={o.won} onChange={v=>setF('won',v)} mono hint="Godrej SO / WON number — add or update it here"/>
          <SectionHead n="02" label="Money Receipt"/>
          {[0,1,2].map(i=>{ const mr=(o.moneyReceipts&&o.moneyReceipts[i])||{no:'',date:'',amt:''}; return (
            <div key={i} style={{display:'flex',borderBottom:`1px solid ${T.line}`,background:'#fff'}}>
              <div style={{flex:1,borderRight:`1px solid ${T.line}`}}>
                <Field label={`Money Receipt No ${i+1}`} value={mr.no} onChange={v=>setMRestricted(i,'no',v)} mono/>
              </div>
              <div style={{flex:1,borderRight:`1px solid ${T.line}`}}>
                <Field label={`Date ${i+1}`} value={mr.date} onChange={v=>setMRestricted(i,'date',v)} mono type="date"/>
              </div>
              <div style={{flex:1}}>
                <Field label={`Amount ${i+1}`} value={i===0?o.earnest:mr.amt} onChange={v=>i===0?setF('earnest',v):setMRestricted(i,'amt',v)} mono type="number" hint={i===0?'Advance at booking':'Later payment'}/>
              </div>
            </div>
          );})}
          {(()=>{ const {received,balance}=orderReceived(o); return (
            <div style={{display:'flex',justifyContent:'space-between',padding:'9px 14px',background:T.paper,borderBottom:`1px solid ${T.line}`,fontSize:12}}>
              <span style={{color:T.ink3,fontWeight:600}}>Received so far <b style={{fontFamily:T.mono,color:T.ink}}>₹{received.toLocaleString('en-IN')}</b></span>
              <span style={{color:balance>0?T.bad:T.ok,fontWeight:700}}>{balance>0?`Balance ₹${balance.toLocaleString('en-IN')}`:'Paid in full ✓'}</span>
            </div>
          );})()}
          <SectionHead n="03" label="Delivery"/>
          <div style={{borderBottom:`1px solid ${T.line}`,padding:'11px 14px',background:'#fff'}}>
            <div style={{fontSize:10,fontWeight:700,color:T.ink4,letterSpacing:0.8,textTransform:'uppercase',marginBottom:6}}>Delivery Status</div>
            <select value={o.deliveryStatus||'Pending'} onChange={e=>handleDeliveryChange(e.target.value)} style={{width:'100%',border:'none',outline:'none',fontSize:15,fontFamily:T.sans,color:T.ink,background:'transparent',padding:0,appearance:'none',WebkitAppearance:'none',cursor:'pointer'}}>
              {DELIVERY_STATUSES.map(s=><option key={s}>{s}</option>)}
            </select>
            <div style={{fontSize:11,color:T.ink4,marginTop:3}}>Order is Completed only when "Installation Done".</div>
            {/partial/i.test(o.deliveryStatus||'') && <PartialDeliverySummary order={o} onEdit={()=>setPartialPicker(true)}/>}
          </div>
          <div style={{height:20}}/>
        </div>
        <div style={{display:'flex',gap:8,padding:'10px 14px',background:'#fff',borderTop:`1px solid ${T.line}`,flexShrink:0}}>
          <Btn onClick={()=>{ setOrder(BLANK_ORDER()); nav('history'); }}>Cancel</Btn>
          <Btn primary full onClick={handleRestrictedSave}>Save Changes</Btn>
        </div>
        {partialPicker && <PartialDeliveryModal order={o} onCancel={()=>setPartialPicker(false)} onConfirm={confirmPartialDelivery}/>}
        {reschedulePicker && <RescheduleModal order={o} onCancel={()=>setReschedulePicker(false)} onConfirm={confirmReschedule}/>}
      </div>
    );
  }

  // Live validation state drives the step progress bar and the save summary.
  const liveErrors = collectErrors();
  const STEPS = [['customer','Customer'],['address','Address'],['measure','Measure'],['items','Items'],['payment','Payment']];
  const stepSecs = { customer:['customer'], address:['address'], measure:['measure','rooms'], items:['items'], payment:['payment','internal'] };
  const stepDone = k => !liveErrors.some(e => stepSecs[k].includes(e.sec));

  return (
    <div className="screen">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 14px',background:T.paper,borderBottom:`1px solid ${T.line}`,flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <button onClick={back} title="Back" style={{width:32,height:32,borderRadius:6,background:'#fff',border:`1px solid ${T.line}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>{Icon.back()}</button>
          <button onClick={()=>nav('home')} title="Home" style={{width:32,height:32,borderRadius:6,background:'#fff',border:`1px solid ${T.line}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>{Icon.home(T.ink2,18)}</button>
          <div>
            <div style={{fontSize:17,fontWeight:700,letterSpacing:-0.4}}>{o.no?(o.manualOrder?'Edit manual order':'Edit order'):(o.manualOrder?'New manual order':'New order')}</div>
            <div style={{fontSize:10,color:T.ink4,fontFamily:T.mono}}>{o.no?o.no:(o.manualOrder?'MANUAL · DRAFT':'DRAFT')}</div>
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>

            <div style={{borderBottom:`1px solid ${T.line}`,padding:'11px 14px',background:'#fff'}}>
              <div style={{fontSize:10,fontWeight:700,color:T.ink4,letterSpacing:0.8,textTransform:'uppercase',marginBottom:6}}>How many modular furnitures? <span style={{color:T.bad,marginLeft:3}}>*</span></div>
              <select value={wardrobes.length||1} onChange={e=>setWardrobeCount(Number(e.target.value))} style={{width:'100%',border:'none',outline:'none',fontSize:15,fontFamily:T.sans,color:T.ink,background:'transparent',padding:0,appearance:'none',WebkitAppearance:'none',cursor:'pointer'}}>

                  <MeasureField label="Wardrobe Width" value={w.width} onChange={v=>setWardrobeField(wi,'width',v)} unit={measUnit} required/>
                  <MeasureField label="Wardrobe Height" value={w.height} onChange={v=>setWardrobeField(wi,'height',v)} unit={measUnit} required/>

          <div style={{fontSize:10,fontWeight:700,color:T.ink4,letterSpacing:0.8,textTransform:'uppercase',marginBottom:6}}>How many rooms?{hasWardrobe&&<span style={{color:T.bad,marginLeft:3}}>*</span>}</div>
          <select value={rooms.length||(hasWardrobe?1:0)} onChange={e=>setRoomCount(Number(e.target.value))} style={{width:'100%',border:'none',outline:'none',fontSize:15,fontFamily:T.sans,color:T.ink,background:'transparent',padding:0,appearance:'none',WebkitAppearance:'none',cursor:'pointer'}}>
            {(hasWardrobe?[1,2,3,4,5,6,7,8]:[0,1,2,3,4,5,6,7,8]).map(n=><option key={n} value={n}>{n}</option>)}

        </div>
        {rooms.map((r,ri)=>(
          <div key={ri} style={{borderBottom:`1px solid ${T.line}`,background:T.paper2||'#fafafa'}}>
            <div style={{padding:'8px 14px',fontSize:11,fontWeight:700,color:T.ink2,letterSpacing:0.5,textTransform:'uppercase'}}>Room {ri+1}</div>
            <div style={{background:'#fff'}}>
              <Field label="Room Name" value={r.name} onChange={v=>setRoomField(ri,'name',v)} placeholder={`Room ${ri+1}`} required={hasWardrobe} hint="e.g. Master Bedroom, Kids Room"/>
              <MeasureField label="Room Width" value={r.width} onChange={v=>setRoomField(ri,'width',v)} unit={measUnit} required={hasWardrobe}/>
              <MeasureField label="Room Height" value={r.height} onChange={v=>setRoomField(ri,'height',v)} unit={measUnit} required={hasWardrobe}/>
              <MeasureField label="Room Depth" value={r.depth} onChange={v=>setRoomField(ri,'depth',v)} unit={measUnit} required={hasWardrobe}/>
            </div>
          </div>

          <>
            <div style={{padding:'8px 14px',background:T.warnSoft,borderBottom:`1px solid ${T.line}`,fontSize:11,color:T.warn,fontWeight:700}}>Sofa with no lift — staircase width & the landing area length/width/depth are mandatory (printed on the PDF)</div>
            <MeasureField label="Staircase Width" value={o.staircaseWidth} onChange={v=>setF('staircaseWidth',v)} unit={measUnit} required/>
            <MeasureField label="Landing Area Length" value={o.landingLength} onChange={v=>setF('landingLength',v)} unit={measUnit} required/>

        <SectionHead n="04" label={`Items · ${(o.items||[]).length}`} action="+ ADD ITEM" onAction={()=>nav('search')} id="sec-items"/>
        <div style={{background:'#fff'}}>
          {(o.items||[]).map((it,i)=>{
            const mrpVal   = it.mrp||it.cpl||0;                 // pre-GST list price (base)

            const curPrice = (it.unitPrice>0) ? it.unitPrice : (mrpVal>0 ? mrpVal*(1-discPct) : 0);
            // Every price shown includes 18% GST (the MRP). GST is baked in for
            // display only — never re-applied — so the line total is just MRP × qty.
            const mrpIncl  = Math.round(mrpVal*(1+GST_RATE));   // per-unit MRP (incl. GST)
            const gstUnit  = gstInclUnit(it);                   // per-unit MRP after discount
            const lineShown= gstInclLine(it);                   // line total (incl. GST)
            return (
            <div key={it.code+i} style={{padding:'11px 14px',borderBottom:`1px solid ${T.line}`,...(_isFourS(it.whTag)?{background:'#fff4d6',borderLeft:`4px solid ${T.warn}`}:{})}}>
              <div style={{display:'flex',gap:8,alignItems:'flex-start'}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:'flex',gap:6,alignItems:'center',marginBottom:3,flexWrap:'wrap'}}>
                    <span style={{fontFamily:T.mono,fontSize:10,color:T.ink4,fontWeight:600}}>{it.code}</span>
                    {it.inStock>0 && <StockChip branch={it.branch||'STOCK'} count={it.inStock} low={it.inStock<3}/>}
                    {(!it.inStock)&&<Pill tone="warn" size="sm">OOS</Pill>}
                    {it.discontinued&&<Pill tone="bad" size="sm">DISCONTINUED{it.discSince?' since '+it.discSince:''}</Pill>}
                  </div>
                  <div style={{fontSize:13,fontWeight:600,lineHeight:1.3}}>{it.name}</div>
                  {discPct>0&&gstUnit>0&&<div style={{fontSize:10,color:T.green,marginTop:2,fontWeight:700}}>You save ₹{Math.max(0,mrpIncl-gstUnit).toLocaleString('en-IN')} /unit <span style={{color:T.ink4,fontWeight:600}}>vs MRP (incl. GST)</span></div>}
                  {priv&&(()=>{const cplU=Number(it.cpl)||Number(it.mrp)||0;const sellEx=Math.round(curPrice);const m=sellEx-cplU;const mp=cplU>0?Math.round(m/cplU*100):0;return(
                    <div style={{fontSize:10,color:T.ink4,marginTop:2}}>CPL: ₹{cplU.toLocaleString('en-IN')} · Margin: <b style={{color:m>=0?T.green:T.bad}}>₹{m.toLocaleString('en-IN')}{cplU>0?` (${mp}%)`:''}</b> <span style={{opacity:.7}}>· pre-GST · mgr only</span></div>
                  );})()}
                  <div style={{display:'flex',gap:8,marginTop:6,alignItems:'center',flexWrap:'wrap'}}>
                    <span style={{fontSize:10,color:T.ink4,fontWeight:700}}>QTY</span>
                    <button onClick={()=>updateItemQty(i,-1)} style={{width:24,height:24,borderRadius:4,border:`1px solid ${T.line}`,background:'#fff',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,color:T.ink}}>−</button>
                    <span style={{fontFamily:T.mono,fontSize:14,fontWeight:700,minWidth:20,textAlign:'center'}}>{it.qty}</span>
                    <button onClick={()=>updateItemQty(i,1)} style={{width:24,height:24,borderRadius:4,border:`1px solid ${T.line}`,background:'#fff',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,color:T.ink}}>+</button>
                  </div>
                  {/* MRP, Discount % and Selling Price are all editable and kept in
                      sync both ways: change the discount and the price updates;
                      type the selling price and the discount % is calculated. All
                      prices are GST-inclusive; GST is never re-added on an edit. */}
                  <div style={{display:'flex',gap:8,marginTop:6,alignItems:'center',flexWrap:'wrap'}}>
                    <span style={{fontSize:10,color:T.ink4,fontWeight:700}}>MRP ₹</span>
                    <NumBox
                      value={mrpIncl}
                      onInput={t=>{
                        // Edited in GST-inclusive terms; store the pre-GST list price
                        // so 18% GST never gets re-added to what was typed. Discount %
                        // is held fixed, so the selling price follows the new MRP.
                        const vIncl=parseFloat(t)||0;
                        const base=vIncl/(1+GST_RATE);
                        const up=base*(1-discPct);
                        setOrder(prev=>({...prev,items:prev.items.map((x,j)=>j===i?{...x,mrp:base,unitPrice:up,total:up*x.qty}:x)}));
                      }}
                      style={{width:78,border:`1.5px solid ${T.green}`,borderRadius:4,padding:'3px 6px',fontFamily:T.mono,fontSize:13,fontWeight:700,textAlign:'right',color:T.ink}}
                    />
                    <span style={{fontSize:10,color:T.ink4,fontWeight:700}}>DISC %</span>

// Compact read-out of a partial delivery: delivered vs. pending items + an edit link.
function PartialDeliverySummary({order, onEdit}) {
  const items = order.items || [];
  const del = order.deliveredItems || [];
  const isDelivered = (it,i) => del.some(d => (d && typeof d==='object') ? (d.i===i || (d.code && d.code===it.code)) : (d===i));
  const pending = items.filter((it,i)=>!isDelivered(it,i));
  return (
    <div style={{marginTop:8,padding:'9px 11px',background:T.warnSoft,border:`1px solid #e6cc95`,borderRadius:6}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span style={{fontSize:11,fontWeight:700,color:T.warn}}>{items.length-pending.length} delivered · {pending.length} pending for delivery</span>
        <span onClick={onEdit} style={{fontSize:11,fontWeight:700,color:T.green,cursor:'pointer'}}>Edit items</span>
      </div>
      {pending.length>0 && <div style={{fontSize:10.5,color:T.ink3,marginTop:4,lineHeight:1.5}}>Pending: {pending.map(it=>it.name||it.code).filter(Boolean).slice(0,6).join(', ')}{pending.length>6?' …':''}</div>}
    </div>
  );
}

// The native PdfSaver Capacitor plugin, present only inside the installed app
// (registered by MainActivity). Returns null in a regular browser. This is the
// ONLY reliable way to produce/attach a real PDF file inside the Android
// WebView: jsPDF's doc.save() (a hidden <a download> blob) is silently dropped,
// and the WebView's navigator.share can't attach files — so both "download" and
// "share PDF" must go through this plugin when running in the app.
//
// IMPORTANT: a custom native plugin is obtained with Capacitor.registerPlugin();
// window.Capacitor.Plugins.PdfSaver is NOT auto-populated, so relying on it left
// the buttons silently falling back to the broken doc.save().
let _pdfSaverPlugin;
function nativePdfSaver() {
  try {
    const C = window.Capacitor;
    if (!C) return null;
    const isNative = C.isNativePlatform ? C.isNativePlatform() : !!C.isNative;
    if (!isNative) return null;
    if (_pdfSaverPlugin) return _pdfSaverPlugin;
    if (typeof C.registerPlugin === 'function') {
      _pdfSaverPlugin = C.registerPlugin('PdfSaver');
    } else if (C.Plugins && C.Plugins.PdfSaver) {
      _pdfSaverPlugin = C.Plugins.PdfSaver;
    }
    return _pdfSaverPlugin || null;
  } catch (e) { return null; }
}

// Base64 payload (no data: prefix) for a generated jsPDF document.
function pdfBase64(doc) {
  const uri = doc.output('datauristring');
  return uri.substring(uri.indexOf('base64,') + 7);
}

const _errMsg = (e) => (e && (e.message || e.errorMessage)) ? (e.message || e.errorMessage) : String(e);

// Save a freshly generated PDF for the user. In the installed app this hands the
// bytes to the native plugin, which writes the file to the phone's Downloads
// folder and opens it. In a regular browser it's the normal doc.save() download,
// so the website is unaffected.
function deliverPDF(doc, fname, showToast) {
  const P = nativePdfSaver();
  if (P && typeof P.save === 'function') {
    P.save({ data: pdfBase64(doc), filename: fname })
      .then(() => { if (showToast) showToast('Saved to Downloads', 'ok'); })
      .catch((e) => { if (showToast) showToast('Save failed: ' + _errMsg(e), 'bad'); });
    return;
  }
  // Reached here without the native plugin. If we appear to be inside the app,
  // the bridge wasn't reachable — surface it instead of silently no-opping
  // (a plain doc.save() download is dropped by the Android WebView).
  const C = window.Capacitor;
  const inApp = !!(C && (C.isNativePlatform ? C.isNativePlatform() : C.isNative));
  if (inApp && showToast) showToast('PDF bridge not found — please update the app', 'bad');
  try { doc.save(fname); }
  catch (e) { if (showToast) showToast('Could not save the PDF', 'bad'); }
}

// Share a generated PDF with a caption via the native share sheet (installed
// app). Returns true if the native share was launched, false if not native so
// the caller can run its browser fallback.
async function nativeSharePDF(doc, fname, text) {
  const P = nativePdfSaver();
  if (!P || typeof P.share !== 'function') return false;
  await P.share({ data: pdfBase64(doc), filename: fname, text: text || '' });
  return true;
}

// Share the order PDF through the device share sheet (WhatsApp, Gmail, Drive…)
// with the confirmation message as the caption — the salesperson taps once and
// the actual PDF is attached. Devices without file-share support (most desktops)
// fall back to downloading the PDF and opening a WhatsApp chat with the text, so
// the file can be attached manually. A dismissed share sheet is a no-op.
async function shareOrderPDF(o, copyType, showToast) {
  const safeNo = (o.no||'draft').replace('/','‑');
  const fname  = 'Order-'+safeNo+'-'+(copyType==='sales'?'Sales':'Customer')+'.pdf';
  const text   = orderWhatsAppMessage(o);
  let doc;
  try { doc = generatePDF(o, copyType); }
  catch(e) { if (showToast) showToast('Could not build the PDF','bad'); return; }
  // Installed app: attach the real PDF file through the native share sheet
  // (WhatsApp attaches the file, caption pre-filled). The WebView's
  // navigator.share can't attach files here, so this native path is required.
  try { if (await nativeSharePDF(doc, fname, text)) return; }
  catch(e) { if (showToast) showToast('Share failed: ' + _errMsg(e), 'bad'); return; }
  try {
    const file = new File([doc.output('blob')], fname, {type:'application/pdf'});
    if (navigator.canShare && navigator.canShare({files:[file]})) {
      await navigator.share({files:[file], text});
      return;
    }
  } catch(e) {
    if (e && e.name === 'AbortError') return;   // user closed the share sheet
    // any other error → fall through to the download + chat fallback
  }
  try { doc.save(fname); } catch(e) {}
  const phone = (o.phone||'').replace(/\D/g,'');
  window.open('https://wa.me/'+(phone?'91'+phone:'')+'?text='+encodeURIComponent(text), '_blank');
  if (showToast) showToast('PDF saved — attach it in the WhatsApp chat','ok');
}

// Message for the sales-team WhatsApp group when a freshly booked order still
// needs its Godrej SO (WON) number raised in Salesforce. Shared alongside the
// order-form PDF so the team can place the order and reply with the SO No, which
// is then added back on the order via "+ ADD SO".
function salesTeamOrderMessage(o) {
  const {total, earnest, balance} = orderTotals(o);

  try {

// ─── Service Requests (after-sales issue tracking) ───────────
// Raise / track a service request against an order — e.g. a product found damaged
// or defective at installation. A flagged order records the issue, when it was
// raised, who is handling it and, once fixed, when it was resolved.
function ServiceRequestModal({order, ctx, onClose}){
  const {doUpdateService} = ctx;
  const today = new Date().toISOString().slice(0,10);
  const [issue,setIssue]       = useState(order.serviceIssue||'');
  const [raised,setRaised]     = useState(order.serviceRaisedDate||today);
  const [assignee,setAssignee] = useState(order.serviceAssignee||'');
  const [status,setStatus]     = useState(order.serviceStatus||'Open');
  const [resolved,setResolved] = useState(order.serviceResolvedDate||'');
  const [busy,setBusy]         = useState(false);
  const flagged = !!order.serviceFlag;
  async function save(flagOn){
    if(flagOn && !issue.trim()){ ctx.showToast('Describe the issue first','bad'); return; }
    setBusy(true);
    const ok = await doUpdateService(order.no, order.internalNo, {
      serviceFlag: flagOn,
      serviceIssue: issue.trim(),
      serviceRaisedDate: raised,
      serviceAssignee: assignee.trim(),
      serviceResolvedDate: status==='Resolved' ? (resolved||today) : '',
      serviceStatus: flagOn ? status : '',
    });
    setBusy(false);
    if(ok) onClose();
  }
  return (
    <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.45)',zIndex:9999,display:'flex',alignItems:'flex-end',justifyContent:'center'}}>
      <div onClick={e=>e.stopPropagation()} style={{width:'100%',maxWidth:600,background:'#fff',borderRadius:'14px 14px 0 0',maxHeight:'92vh',overflowY:'auto'}}>
        <div style={{padding:'14px 16px',borderBottom:`1px solid ${T.line}`,display:'flex',justifyContent:'space-between',alignItems:'center',position:'sticky',top:0,background:'#fff',zIndex:1}}>
          <div>
            <div style={{fontSize:16,fontWeight:700}}>Service request</div>
            <div style={{fontSize:11,color:T.ink4,fontFamily:T.mono,marginTop:2}}>{order.no} · {order.customer}</div>
          </div>
          <span onClick={onClose} style={{cursor:'pointer'}}>{Icon.close(T.ink4)}</span>
        </div>
        <div>
          <Field label="Issue / complaint" value={issue} onChange={setIssue} multiline required hint="e.g. Wardrobe shutter found damaged at installation; customer raised a complaint"/>
          <Field label="Issue raised on" value={raised} onChange={setRaised} type="date" mono/>
          <Field label="Handled by" value={assignee} onChange={setAssignee} hint="Who is taking care of this issue"/>
          <div style={{borderBottom:`1px solid ${T.line}`,padding:'11px 14px',background:'#fff'}}>
            <div style={{fontSize:10,fontWeight:700,color:T.ink4,letterSpacing:0.8,textTransform:'uppercase',marginBottom:6}}>Status</div>
            <select value={status} onChange={e=>setStatus(e.target.value)} style={{width:'100%',border:'none',outline:'none',fontSize:15,fontFamily:T.sans,color:T.ink,background:'transparent',padding:0,appearance:'none',WebkitAppearance:'none',cursor:'pointer'}}>
              <option>Open</option><option>Resolved</option>
            </select>
          </div>
          {status==='Resolved' && <Field label="Resolved on" value={resolved} onChange={setResolved} type="date" mono/>}
        </div>
        <div style={{display:'flex',gap:8,padding:'12px 14px',borderTop:`1px solid ${T.line}`,position:'sticky',bottom:0,background:'#fff'}}>
          {flagged && <Btn onClick={()=>save(false)} disabled={busy}>Remove flag</Btn>}
          <Btn primary full onClick={()=>save(true)} disabled={busy}>{flagged?'Update request':'Raise request'}</Btn>
        </div>
      </div>
    </div>
  );
}
