  // changes, so it's served straight from cache; stock is refreshed via Sync Now;
  // orders refresh silently in the background on every open.
  const [items,         setItems]        = useState(() => { try { return JSON.parse(localStorage.getItem('4s_items')||'[]'); } catch { return []; } });
  const [priceItems,    setPriceItems]   = useState(() => { try { return JSON.parse(localStorage.getItem('4s_price_items_v9')||'[]'); } catch { return []; } });
  const [orders,        setOrders]       = useState(() => { try { return JSON.parse(localStorage.getItem('4s_orders')||'[]'); } catch { return []; } });
  const [syncedAt,      setSyncedAt]     = useState(null);
  const [priceSyncedAt, setPriceSyncedAt]= useState(() => localStorage.getItem('4s_price_items_v9_ts') ? new Date(Number(localStorage.getItem('4s_price_items_v9_ts'))).toISOString() : null);
  const [priceSyncError, setPriceSyncError] = useState(null);
  const [order,         setOrder]        = useState(BLANK_ORDER());
  const [selOrder,      setSelOrder]     = useState(null);
  const [toast,         setToast]        = useState(null);
  const [loading,       setLoading]      = useState(false);
  // MIS_Daily (Godrej committed-stock feed) — keyed by SO_NO / WON.
  const [mis,           setMis]          = useState(() => { try { return JSON.parse(localStorage.getItem('4s_mis')||'{}'); } catch { return {}; } });
  const [misSyncedAt,   setMisSyncedAt]  = useState(localStorage.getItem('4s_mis_ts') ? new Date(Number(localStorage.getItem('4s_mis_ts'))).toISOString() : null);
  const [misUpdateUrl,  setMisUpdateUrl] = useState(MIS_UPDATE_URL_DEFAULT);
  const [misLoading,    setMisLoading]   = useState(false);
  const [misDiag,       setMisDiag]      = useState(null);   // backend diagnostics (tab used, rows, etc.)
  // 4S Premier League — manual daily scores + config (monthly target, salesman of the month).
  const [league,        setLeague]       = useState(() => { try { return JSON.parse(localStorage.getItem('4s_league')||'{"scores":[],"monthlyTarget":0,"weeklyTarget":0,"salesmanOfMonth":""}'); } catch { return {scores:[],monthlyTarget:0,weeklyTarget:0,salesmanOfMonth:''}; } });
  const [leagueLoading, setLeagueLoading]= useState(false);

  const showToast = (msg,type='ok') => setToast({msg,type});
  // "New order placed" celebration overlay — set by doSaveOrder on a first-time
  // finalise, cleared when the user taps Done.
  const [celebration, setCelebration] = useState(null);
  const showCelebration = data => setCelebration(data||{});

  // ── Navigation with a real back-stack ─────────────────────────
  // nav(s)   → remember where we were, then go to screen s
  // back()   → return to the previous screen (also wired to the
  //            hardware / browser back button)
  const navStack = useRef([]);
  const nav = useCallback((s) => {
    setScreen(prev => {
      if (s !== prev) {
        navStack.current.push(prev);
        window.history.pushState({ screen: s }, '', '');
      }
      return s;
    });
  }, []);
  const back = useCallback(() => {
    // Route everything through the browser history so the on-screen and
    // hardware back buttons behave identically.
    window.history.back();
  }, []);
  const popScreen = useCallback(() => {
    setScreen(prev => {
      const st = navStack.current;
      let target = st.length ? st.pop() : 'home';
      // Never get stuck on auth screens after logging in
      if (!target || target === prev || target === 'loading') target = 'home';
      return target;
    });
  }, []);

  useEffect(() => {
    window.history.replaceState({ screen: 'home' }, '', '');
    const handler = () => popScreen();
    window.addEventListener('popstate', handler);
    return () => window.removeEventListener('popstate', handler);
  }, [popScreen]);

  // Restore session
  useEffect(() => {
    const saved = localStorage.getItem('4s_user');
    // The backend URL is always pre-configured in the background, so we never
    // route to a setup/URL screen — signed-in users go home, everyone else logs in.
    if (saved) {
      try { setUser(JSON.parse(saved)); setScreen('home'); }
      catch { setScreen('login'); }
    } else {
      setScreen('login');
    }
  }, []);

  // Load stock + price list on login. Cached data shows instantly for a snappy
  // UI, but we always pull FRESH stock + price data from the sheet on every
  // login so each session starts fully in sync (stock = current-date snapshot).
  useEffect(() => {
    if (!user) return;
    const cached = localStorage.getItem('4s_items');
    if (cached) try { setItems(JSON.parse(cached)); } catch {}
    const cachedPL = localStorage.getItem('4s_price_items_v9');
    let hadCachedPL = false;
    if (cachedPL) try { const p = JSON.parse(cachedPL); setPriceItems(p); hadCachedPL = p.length > 0; } catch {}
    syncStock({ silent: true });
    // The price list rarely changes, so serve it straight from the local cache and
    // only pull a fresh copy when the cache is stale (>6h). The app is usable
    // immediately on open without waiting on the network; the manual "Sync Now"
    // button always forces a fresh price-list + stock pull on demand.
    loadPriceListItems(false)
      .then(pi => {
        if (pi.length > 0) {
          setPriceItems(pi);
          const ts = localStorage.getItem('4s_price_items_v9_ts');
          if (ts) setPriceSyncedAt(new Date(Number(ts)).toISOString());
        }
      })
      // If we already have cached prices, stay silent — no scary toast on a
      // slow background refresh. Only surface an error when there's nothing to show.
      .catch(e => { if (!hadCachedPL) setPriceSyncError(e.message); });
    // Orders render instantly from cache (state is seeded from localStorage above);
    // refresh them silently in the background so the ledger is current on open.
    loadOrders({ silent: true });
    loadMis({ silent: true });
    loadLeague({ silent: true });
  }, [user]);

  // Re-sync shared data every time the app is reopened / brought to the
  // foreground. All devices read the same backend, so whatever price list,
  // stock, MIS or orders ANY user last synced shows up for everyone on open —
  // the manual Sync buttons stay available for an on-demand refresh.
  useEffect(() => {
    if (!user) return;
    let last = 0;
    const resync = () => {
      if (document.visibilityState && document.visibilityState !== 'visible') return;
      const now = Date.now();
      if (now - last < 15000) return;   // debounce rapid focus/visibility churn
      last = now;
      syncStock({ silent: true });
      loadMis({ silent: true });
      loadOrders();
      loadPriceListItems(false, true)   // skip local cache, use shared server cache
        .then(pi => {
          if (pi && pi.length) {
            setPriceItems(pi);
            const ts = localStorage.getItem('4s_price_items_v9_ts');
            if (ts) setPriceSyncedAt(new Date(Number(ts)).toISOString());
          }
        })
        .catch(() => {});
    };
    document.addEventListener('visibilitychange', resync);
    window.addEventListener('focus', resync);
    return () => {
      document.removeEventListener('visibilitychange', resync);
      window.removeEventListener('focus', resync);
    };
  }, [user]);

  // Restore an unsaved order draft once, right after login
  useEffect(() => {
    if (!user) return;
    try {
      const d = localStorage.getItem('4s_draft');
      if (d) { const o = JSON.parse(d); if (!o.no && ((o.items&&o.items.length) || o.customer)) setOrder(o); }
    } catch {}
  }, [user]);

  // Keep the working order backed up so a reload/crash never loses a booking
  useEffect(() => {
    if (!user) return;
    try {
      if (order.no) localStorage.removeItem('4s_draft');            // saved → no longer a draft
      else if ((order.items&&order.items.length) || order.customer) localStorage.setItem('4s_draft', JSON.stringify(order));
      else localStorage.removeItem('4s_draft');
    } catch {}
  }, [order, user]);

  // Flush offline-queued orders on login and whenever the network comes back
  useEffect(() => {
    if (!user) return;
    flushQueue();
    const onOnline = () => flushQueue();
    window.addEventListener('online', onOnline);
    return () => window.removeEventListener('online', onOnline);
  }, [user]);

  // Handle deep-link action from PWA shortcut (?action=...)
  useEffect(() => {
    const sp = new URLSearchParams(window.location.search);
    const action = sp.get('action');
    if (action === 'new-order' && user) { setOrder({...BLANK_ORDER(),salesExec:user?.name||''}); nav('order'); }
    if (action === 'history' && user) nav('history');
  }, [user]);

  async function syncStock(opts) {
    const silent = opts && opts.silent;
    // Only show the blocking spinner when there's no cached stock yet; a background
    // resync stays invisible so a slow cold-start never interrupts the user.
    const haveStock = (items && items.length > 0) || !!localStorage.getItem('4s_items');
    if (!silent || !haveStock) setLoading(true);
    try {
      // apiGet already retries with backoff, so a slow cold-start doesn't surface
      // as a timeout error.
      const res = await apiGet('stock', {}, 60000, 2);
      if (res.ok) {
        setItems(res.items);
        setSyncedAt(res.syncedAt || new Date().toISOString());
        localStorage.setItem('4s_items', JSON.stringify(res.items));
        if (!silent) showToast(res.items.length + ' items synced ✓');
      } else if (!silent) {
        showToast(res.error || 'Stock sync failed — check the Stock tab', 'bad');
      }
    } catch(e) {
      if (!silent) showToast('Stock sync failed: ' + e.message, 'bad');
    } finally {
      setLoading(false);
    }
  }

  async function syncPriceList() {
    localStorage.removeItem('4s_price_items_v9');
    localStorage.removeItem('4s_price_items_v9_ts');
    setPriceSyncError(null);
    setLoading(true);
    try {
      const pi = await loadPriceListItems(true);   // force fresh from the sheet
      setPriceItems(pi);
      setPriceSyncedAt(new Date().toISOString());
      localStorage.setItem('4s_price_items_v9_ts', String(Date.now()));
      showToast(pi.length + ' items loaded ✓', 'ok');
    } catch(e) {
      setPriceSyncError(e.message);
      showToast('Sync failed — see error below', 'bad');
    } finally {
      setLoading(false);
    }
  }

  async function loadOrders(opts) {
    const silent = opts && opts.silent;
    // If we already have orders (seeded from cache), refresh in the background:
    // don't show the blocking spinner and never surface a timeout/network error —
    // the cached ledger stays on screen. Only a first-ever load with nothing cached
    // shows the spinner and reports a hard failure.
    const haveCache = (orders && orders.length > 0) || !!localStorage.getItem('4s_orders');
    if (!haveCache) setLoading(true);
    try {
      const res = await apiGet('orders', { exec: user?.name || '' }, 30000, 2);
      if (res && res.ok) {
        setOrders(res.orders);
        localStorage.setItem('4s_orders', JSON.stringify(res.orders));
      } else if (!silent && !haveCache) {
        showToast((res && res.error) || 'Failed to load orders','bad');
      }
    } catch(e) {
      if (!haveCache) showToast('Could not reach the server — pull to refresh','warn');
      // else: keep showing the cached orders, silently
    } finally { if (!haveCache) setLoading(false); }
  }

  // Pull the MIS_Daily committed-stock feed (read from the OPS sheet by the backend).
  async function loadMis(opts) {
    const silent = opts && opts.silent;
    setMisLoading(true);
    try {
      const res = await apiGet('mis', {}, 30000);
      if (res && res.ok) {
        setMis(res.mis || {});
        localStorage.setItem('4s_mis', JSON.stringify(res.mis || {}));
        setMisDiag(res.diag || null);
        const now = Date.now();
        setMisSyncedAt(new Date(now).toISOString());
        localStorage.setItem('4s_mis_ts', String(now));
        if (res.misUpdateUrl) setMisUpdateUrl(res.misUpdateUrl);
        if (!silent) {
          const committed = res.diag ? res.diag.fullyCommittedSOs : null;
          showToast('MIS updated · ' + (res.count || 0) + ' SO' + ((res.count||0)===1?'':'s') + (committed!=null?(' · '+committed+' committed'):'') + ' ✓');
        }
        return res.mis || {};
      } else if (!silent) showToast((res && res.error) || 'MIS fetch failed', 'bad');
    } catch (e) { if (!silent) showToast(e.message, 'bad'); }
    finally { setMisLoading(false); }
    return null;
  }

  // ── 4S Premier League ──────────────────────────────────────────
  // Pull the manual daily scores + config. Everyone can read the board; only a
  // manager/admin can write. Cached locally so the scoreboard shows instantly.
  async function loadLeague(opts) {
    const silent = opts && opts.silent;
    if (!silent) setLeagueLoading(true);
    try {
      const res = await apiGet('leagueScores', {}, 30000, 2);
      if (res && res.ok) {
        const data = { scores: res.scores || [], monthlyTarget: Number(res.monthlyTarget)||0, weeklyTarget: Number(res.weeklyTarget)||0, salesmanOfMonth: res.salesmanOfMonth || '' };
        setLeague(data);
        localStorage.setItem('4s_league', JSON.stringify(data));
        return data;
      } else if (!silent) showToast((res && res.error) || 'Failed to load league scores','bad');
    } catch(e) { if (!silent) showToast('Could not reach the server','warn'); }
    finally { if (!silent) setLeagueLoading(false); }
    return null;
  }
  // Upsert one player's manual scores for one date (admin/manager only).
  async function doSaveLeagueScore(entry) {
    try {
      const res = await apiPost({ action:'saveLeagueScore', by:user?.username||user?.name||'', ...entry });
      if (res && res.ok) { await loadLeague({silent:true}); showToast('Score saved ✓'); return true; }
      showToast((res && res.error) || 'Save failed','bad'); return false;
    } catch(e) { showToast(e.message,'bad'); return false; }
  }
  // Update league config — monthly target and/or salesman of the month (admin/manager only).
  async function doSaveLeagueConfig(cfg) {
    try {
      const res = await apiPost({ action:'saveLeagueConfig', by:user?.username||user?.name||'', ...cfg });
      if (res && res.ok) { await loadLeague({silent:true}); showToast('Settings saved ✓'); return true; }
      showToast((res && res.error) || 'Save failed','bad'); return false;
    } catch(e) { showToast(e.message,'bad'); return false; }
  }

  // Ask the backend for the exact next app Receipt No (authoritative — it reads the
  // live sheet and skips manual orders). Returns a number, or null if unreachable.
  async function getNextReceipt() {
    try {
      const res = await apiGet('nextReceipt', {}, 12000);
      if (res && res.ok && Number(res.nextReceipt) > 0) return Number(res.nextReceipt);
    } catch(e) {}
    return null;
  }

  async function doLogin(username, password) {
    setLoading(true);
    try {
      const res = await apiGet('login', { username, password });
      if (res.ok) {
        setUser(res.user);
        localStorage.setItem('4s_user', JSON.stringify(res.user));
        showToast('Welcome, '+res.user.name+'!');
        nav('home');
      } else {
        showToast(res.error||'Login failed','bad');
      }
    } catch(e) { showToast(e.message,'bad'); }
    finally { setLoading(false); }
  }

  async function doSaveOrder(draft) {
    // Guarantee a stable idempotency key. New drafts already carry one (BLANK_ORDER),
    // this backfills any older draft/queued order so the server-side dedup still works.
    const clientId = draft.clientId || uid();
    draft = { ...draft, clientId };
    // Re-entrancy guard: if a Save for this exact order is already in flight, ignore
    // the duplicate click. The server clientId dedup is the ultimate backstop; this
    // just avoids firing the redundant request at all.
    if (_savingIds.has(clientId)) return null;
    _savingIds.add(clientId);
    setLoading(true);
    try {
      const res = await apiPost({ action:'saveOrder', order:{ ...draft, totalWithTax: orderTotals(draft).total, by: user?.code, byName: user?.name } });
      if (res.ok) {
        const saved = {...draft, no: res.orderNo, internalNo: res.internalNo, orderFormReceiptNo: res.orderFormReceiptNo || draft.orderFormReceiptNo};
        setOrder(saved);
        showToast('Order '+res.orderNo+' saved ✓');
        // Refresh the ledger so the next new booking picks up the latest Receipt No.
        try { loadOrders(); } catch {}
        return saved;
      } else {
        showToast(res.error||'Save failed','bad');
        return null;
      }
    } catch(e) {
      showToast('No internet — order saved on this phone, will sync automatically','warn');
      const q = JSON.parse(localStorage.getItem('4s_queue')||'[]');
      // Persist the clientId with the queued order so the offline re-send (flushQueue)
      // resolves to the same order server-side instead of creating a duplicate.
      q.push({...draft, _queuedAt: Date.now()});
      localStorage.setItem('4s_queue', JSON.stringify(q));
      return draft;
    } finally { setLoading(false); _savingIds.delete(clientId); }
  }

  // Re-send any orders that were saved while offline
  async function flushQueue() {
    let q;
    try { q = JSON.parse(localStorage.getItem('4s_queue')||'[]'); } catch { q = []; }
    if (!q.length) return;
    const remaining = [];
    for (const draft of q) {
      try {
        const res = await apiPost({ action:'saveOrder', order:{ ...draft, totalWithTax: orderTotals(draft).total, by: draft.by||user?.code, byName: draft.byName||user?.name } });
        if (!res || !res.ok) remaining.push(draft);
      } catch { remaining.push(draft); }
    }
    localStorage.setItem('4s_queue', JSON.stringify(remaining));
    const sent = q.length - remaining.length;
    if (sent > 0) { showToast(sent+' pending order'+(sent>1?'s':'')+' synced ✓'); try { loadOrders(); } catch {} }
  }

  async function doUpdateWON(orderNo, internalNo, won, itemIndexes) {
    setLoading(true);
    try {
      const res = await apiPost({ action:'updateWON', orderNo, internalNo, won, itemIndexes, updatedBy: user?.name });
      if (res.ok) { showToast('WON updated ✓'); loadOrders(); return true; }
      else { showToast(res.error||'Update failed','bad'); return false; }
    } catch(e) { showToast(e.message,'bad'); return false; }
    finally { setLoading(false); }
  }

  async function doUpdateDelivery(orderNo, internalNo, deliveryStatus, deliveredItems, plannedDly) {
    setLoading(true);
    try {
      const res = await apiPost({ action:'updateDelivery', orderNo, internalNo, deliveryStatus, deliveredItems, plannedDly, updatedBy: user?.name });
      if (res.ok) { showToast('Delivery status updated ✓'); loadOrders(); return true; }
      else { showToast(res.error||'Update failed','bad'); return false; }
    } catch(e) { showToast(e.message,'bad'); return false; }
    finally { setLoading(false); }
  }

  // Raise / update / clear an after-sales service request on an order. `svc` carries
  // { serviceFlag, serviceIssue, serviceRaisedDate, serviceAssignee,
  //   serviceResolvedDate, serviceStatus }. Persisted on every CRM row of the order.
  async function doUpdateService(orderNo, internalNo, svc) {
    setLoading(true);
    try {
      const res = await apiPost({ action:'updateService', orderNo, internalNo, ...svc, updatedBy: user?.name });
      if (res.ok) { showToast(svc.serviceFlag ? 'Service request saved ✓' : 'Service request cleared ✓'); loadOrders(); return true; }
      else { showToast(res.error||'Update failed','bad'); return false; }
    } catch(e) { showToast(e.message,'bad'); return false; }
    finally { setLoading(false); }
  }

  // Look up a returning customer by mobile number across every CRM order sheet.
  // Returns a status the UI can show: {status:'found', data} with the profile,
  // {status:'none'} when the number is new, or {status:'error'} on a network/API
  // failure (so the app can say "couldn't check" and offer a retry).
  async function doLookupCustomer(phone) {
    try {
      const res = await apiGet('lookupCustomer', { phone: String(phone||'') }, 30000, 2);
      if (res && res.ok && res.found) return { status:'found', data: res };
      if (res && res.ok)              return { status:'none' };
      return { status:'error', error: (res && res.error) || 'Lookup failed' };
    } catch(e) { return { status:'error', error: e.message }; }
  }

  // Admin-only: permanently delete an order (all its rows) from the CRM sheet.
  // The backend re-checks that the requesting user is an admin before deleting.
  async function doDeleteOrder(orderNo, internalNo) {
    if (!hasManagerAccess(user) || normRole(user?.role) !== 'admin') {
      showToast('Only an admin can delete orders','bad'); return false;
    }
    setLoading(true);
    try {
      const res = await apiPost({ action:'deleteOrder', orderNo, internalNo, by: user?.code, updatedBy: user?.name });
      if (res.ok) { showToast('Order '+(orderNo||'')+' deleted ✓'); loadOrders(); return true; }
      else { showToast(res.error||'Delete failed','bad'); return false; }
    } catch(e) { showToast(e.message,'bad'); return false; }
    finally { setLoading(false); }
  }

  function doSignOut() {
    localStorage.removeItem('4s_user');
    setUser(null);
    setOrder(BLANK_ORDER());
    setOrders([]);
    nav('login');
  }

  // ── Notification feed (MIS committed + delivery deadlines) ────────────────
  const notifications = React.useMemo(() => buildNotifications(orders, mis), [orders, mis]);
  const [seenNotifs, setSeenNotifs] = useState(() => { try { return JSON.parse(localStorage.getItem('4s_notif_seen')||'[]'); } catch { return []; } });
  const unreadCount = notifications.filter(n => !seenNotifs.includes(n.id)).length;
  const markNotifsSeen = useCallback(() => {
    const ids = buildNotifications(orders, mis).map(n => n.id);
    setSeenNotifs(ids);
    localStorage.setItem('4s_notif_seen', JSON.stringify(ids));
  }, [orders, mis]);

  // Ring the bell when the unread count goes up (a genuinely new alert). The
  // initial value is skipped so it doesn't chime just for pre-existing alerts.
  const prevUnreadRef = useRef(null);
  useEffect(() => {
    if (prevUnreadRef.current !== null && unreadCount > prevUnreadRef.current) playBell();
    prevUnreadRef.current = unreadCount;
  }, [unreadCount]);

  // ── Deep-link from a tapped OS notification ───────────────────────────────
  // Tapping a notification should reopen the app AND jump to the order it's
  // about (or the Notifications list). The target reaches us three ways:
  //   1. service-worker `notificationclick` → postMessage to this page
  //   2. cold start: a new window opened with `#notif=<orderNo>` in the URL
  //   3. in-page `new Notification` onclick (Android app / no service worker)
  // Orders may still be loading when the tap arrives, so we hold the target in
  // state and let a resolver effect apply it once the user + orders are ready.
  const [notifTarget, setNotifTarget] = useState(null); // { orderNo } | null
  const ordersRef = useRef(orders);
  useEffect(() => { ordersRef.current = orders; }, [orders]);

  useEffect(() => {
    if (notifTarget == null) return;
    if (!user) return;                       // wait until signed in
    const orderNo = notifTarget.orderNo;
    const list = ordersRef.current || [];
    if (orderNo && !list.length) { nav('notifs'); return; }  // orders still loading — show the list meanwhile
    setNotifTarget(null);
    const o = orderNo ? list.find(x => String(x.no) === String(orderNo)) : null;
    if (o) { setOrder({ ...BLANK_ORDER(), ...normalizeLoadedOrder(o) }); nav('order'); }
    else nav('notifs');
  }, [notifTarget, user, orders, nav, setOrder]);

  // (1) messages from the service worker's notificationclick handler
  useEffect(() => {
    if (!('serviceWorker' in navigator)) return;
    const onMsg = e => {
      const d = e.data || {};
      if (d.type === '4s-notif-click') { try { window.focus(); } catch (e) {} setNotifTarget({ orderNo: d.orderNo || '' }); }
    };
    navigator.serviceWorker.addEventListener('message', onMsg);
    return () => navigator.serviceWorker.removeEventListener('message', onMsg);
  }, []);

  // (2) cold start via a `#notif=<orderNo>` hash
  useEffect(() => {
    try {
      const m = /[#&?]notif=([^&]*)/.exec(window.location.hash || '');
      if (m) {
        history.replaceState(history.state, '', window.location.pathname + window.location.search);
        const orderNo = decodeURIComponent(m[1] || '');
        setTimeout(() => setNotifTarget({ orderNo }), 0);   // after session-restore sets the screen
      }
    } catch (e) {}
  }, []);

  // Fire a native (OS) notification once per new event, so the sales team is
  // alerted even when the app is only in the background. Guarded by permission.
  const pushedRef = useRef(null);
  useEffect(() => {
    if (pushedRef.current === null) {
      try { pushedRef.current = new Set(JSON.parse(localStorage.getItem('4s_notif_pushed')||'[]')); }
      catch { pushedRef.current = new Set(); }
    }
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const fresh = notifications.filter(n => !pushedRef.current.has(n.id));
    if (!fresh.length) return;
    fresh.slice(0, 5).forEach(n => {
      // Carry the target order so a tap can deep-link straight to it.
      const payload = { orderNo: n.orderNo != null ? String(n.orderNo) : '', notifId: n.id };
      try {
        // Use the service worker only when one actually controls this page
        // (its notificationclick handler does the routing). Otherwise fall back
        // to an in-page Notification whose onclick routes directly — this is the
        // path the native Android app takes (it registers no service worker).
        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
          navigator.serviceWorker.ready.then(reg => reg.showNotification('4S Orders · ' + n.title, { body: n.body, icon: '/4s-orders/icon.svg', badge: '/4s-orders/icon.svg', tag: n.id, vibrate: [150,80,150], data: payload })).catch(()=>{});
        } else {
          const notif = new Notification('4S Orders · ' + n.title, { body: n.body, icon: '/4s-orders/icon.svg', tag: n.id, data: payload });
          notif.onclick = function () { try { window.focus(); } catch (e) {} setNotifTarget({ orderNo: payload.orderNo }); this.close(); };
        }
      } catch (e) {}
      pushedRef.current.add(n.id);
    });

// ─── Reports / Sales summary ─────────────────────────────────
// Booked orders grouped by day and by month, from the already-loaded orders.
// Order date is "dd.mm.yy"; drafts are excluded from the counts.
const _MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function _fmtAmt(n){ n = n||0; return n>99999 ? ('₹'+(n/100000).toFixed(2)+'L') : ('₹'+n.toLocaleString('en-IN')); }
// "dd.mm.yy" → sortable/comparable ISO "20yy-mm-dd" (matches <input type=date> values).
function _toISO(dmy){ const p = String(dmy||'').split('.'); return p.length===3 ? ('20'+p[2]+'-'+p[1]+'-'+p[0]) : ''; }
// Sales figures are reported EX-GST. Every stored order amount (o.amt) is the
// GST-inclusive bill (18% baked into each MRP), so the tax is carved back out
// here — the sales summary shows the pre-GST sale value, never the taxed total.
function _exGst(n){ return Math.round((Number(n)||0)/(1+GST_RATE)); }
// Channel split for the sales summary. Every order line carries a delivery
// warehouse (it.whTag): items delivered from KB (ZBF11T), 34S (ZBF34S) or with
// no tag at all belong to the FRANCHISE channel; only items explicitly tagged
// "4S" belong to the 4Sinteriors channel. An order can mix both, so the order's
// pre-GST value is apportioned by each line's total between the two channels.
function _isFourS(whTag){ return String(whTag||'').trim().toUpperCase() === '4S'; }
function _channelSplit(o){
  const total = _exGst(o && o.amt);            // whole order, pre-GST
  const items = (o && o.items) || [];
  let fourSLine = 0, sumLine = 0;
  items.forEach(it => {
    const t = Number(it && it.total) || 0;
    sumLine += t;
    if (_isFourS(it && it.whTag)) fourSLine += t;
  });
  // No line data (or no priced lines) → treat the whole order as Franchise,
  // matching the "not marked anything → Franchise" rule.
  if (sumLine <= 0) return { franchise: total, foursint: 0 };
  const foursint = Math.round(total * fourSLine / sumLine);
  return { franchise: total - foursint, foursint };
}

// ═══════════════════════════════════════════════════════════
// 4S PREMIER LEAGUE — live team scoreboard
// ═══════════════════════════════════════════════════════════
// Two in-house teams (Strikers vs Titans). The "hard" numbers — orders booked
// (excl. B2B) and net-basic order value (excl. the 4S sales channel) — are read
// live from the order ledger and attributed to a player by matching salesExec.
// The "soft" daily criteria (reviews, happy calling, tele-calling conversions,
// follow-up / timing / dress-code penalties) are entered by a manager/admin and
// stored per (date, player) in the backend. The winner is decided weekly (the
// league week runs Mon → Sun; Sunday is decision day).
const LEAGUE_TEAMS = [
  { id:'strikers', name:'4S Strikers', emoji:'🏏', accent:'#1560d0', deep:'#0b2a6b',
    grad:'linear-gradient(160deg,#1c6fe0 0%,#0b2a6b 100%)', tagline:'Strike to Win · Play as One',
    players:[ {name:'PRITISH',captain:true,match:'pritish'}, {name:'ARCHITA',match:'archita'}, {name:'BISWAJIT',match:'biswajit'} ] },
  { id:'titans', name:'4S Titans', emoji:'🛡️', accent:'#d21f2b', deep:'#7a1420',
    grad:'linear-gradient(160deg,#e23140 0%,#7a1420 100%)', tagline:'United We Play, Together We Win',
    players:[ {name:'SWATI',captain:true,match:'swati'}, {name:'ADITYA',match:'aditya'}, {name:'SAROJ',match:'saroj'} ] },
];
// Point weights straight off the league rulebook.
const LEAGUE_PTS = { salesConv:1, review:1, happyCalling:1, teleConv:4, teleConvReview:6, followupMissed:-1, timingPenalty:-1, dressCode:-1 };
const LEAGUE_MANUAL_FIELDS = [
  { key:'reviews',        label:'Reviews',            pts:'+1',  tone:'good' },
  { key:'happyCalling',   label:'Happy calling',      pts:'+1',  tone:'good' },
  { key:'teleConv',       label:'Tele conv.',         pts:'+4',  tone:'good' },
  { key:'teleConvReview', label:'Tele conv.+review',  pts:'+6',  tone:'good' },
  { key:'followupMissed', label:'Missed follow-ups',  pts:'−1',  tone:'bad' },
  { key:'timingPenalty',  label:'Timing',             pts:'−1',  tone:'bad' },
  { key:'dressCode',      label:'Dress code',         pts:'−1',  tone:'bad' },
];
const _pad2 = n => String(n).padStart(2,'0');
function _isoOf(d){ return d.getFullYear()+'-'+_pad2(d.getMonth()+1)+'-'+_pad2(d.getDate()); }
function _todayISO(){ return _isoOf(new Date()); }
// The league week: Monday → Sunday, `offset` weeks from the current one (0 = this week).
function leagueWeek(offset){
  const now = new Date(); now.setHours(0,0,0,0);
  const sinceMon = (now.getDay()+6)%7;             // 0=Sun..6=Sat → days since Monday
  const start = new Date(now); start.setDate(now.getDate()-sinceMon+offset*7);
  const end   = new Date(start); end.setDate(start.getDate()+6);
  const fmt = d => d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
  return { start, end, startISO:_isoOf(start), endISO:_isoOf(end), label:fmt(start)+' – '+fmt(end), month:start.getMonth(), year:start.getFullYear() };
}
function _daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
// Live orders → per-player order count and net-basic value. B2B orders are
// excluded ENTIRELY (neither counted nor valued); the 4S sales channel is also
// stripped out of the value so only the net-basic franchise sale counts.
function leagueAuto(orders, matchKey, startISO, endISO){
  let orderCount=0, basic=0;
  (orders||[]).forEach(o=>{
    if(!o || o.status==='draft') return;
    if(String(o.orderType||'').toUpperCase()==='B2B') return;         // B2B excluded from count AND value
    const iso=_toISO(o.date); if(!iso) return;
    if(startISO && iso<startISO) return;
    if(endISO   && iso>endISO)   return;
    if(!String(o.salesExec||'').toLowerCase().includes(matchKey)) return;
    orderCount++;                                                     // orders booked (excl. B2B)
    basic += _channelSplit(o).franchise;                             // net basic (excl. 4S channel)
  });
  return { orderCount, basic };
}
// Manual scores for one player, summed across the period.
function leagueManualSum(scores, playerName, startISO, endISO){
  const acc={reviews:0,happyCalling:0,followupMissed:0,timingPenalty:0,dressCode:0,teleConv:0,teleConvReview:0};
  (scores||[]).forEach(s=>{
    if(String(s.player||'').trim().toLowerCase()!==playerName.toLowerCase()) return;
    const d=String(s.date||'').slice(0,10);
    if(startISO && d<startISO) return;
    if(endISO   && d>endISO)   return;
    Object.keys(acc).forEach(k=>acc[k]+=Number(s[k])||0);
  });
  return acc;
}
// Full computed standings for a week.
function computeLeague(orders, league, wk){
  const monthlyTarget = Number(league&&league.monthlyTarget)||0;
  const weeklyTarget  = Number(league&&league.weeklyTarget)||0;   // whole-showroom weekly target (admin-set)
  const scores = (league&&league.scores)||[];
  // Each team's weekly target. An admin-set weekly target (which fluctuates with
  // the previous week's performance) wins; otherwise fall back to the monthly
  // target ÷ 2 pro-rated to 7 days. Either way it's the showroom figure split
  // equally between the two teams.
  const dim = _daysInMonth(wk.year, wk.month);
  const weeklyTeamTarget = weeklyTarget>0 ? Math.round(weeklyTarget/2)
    : (monthlyTarget>0 ? Math.round((monthlyTarget/2)*7/dim) : 0);
  const teams = LEAGUE_TEAMS.map(team=>{
    const players = team.players.map(pl=>{
      const auto = leagueAuto(orders, pl.match, wk.startISO, wk.endISO);
      const man  = leagueManualSum(scores, pl.name, wk.startISO, wk.endISO);
      const pts = auto.orderCount*LEAGUE_PTS.salesConv
        + man.reviews*LEAGUE_PTS.review
        + man.happyCalling*LEAGUE_PTS.happyCalling
        + man.teleConv*LEAGUE_PTS.teleConv
        + man.teleConvReview*LEAGUE_PTS.teleConvReview
        + man.followupMissed*LEAGUE_PTS.followupMissed
        + man.timingPenalty*LEAGUE_PTS.timingPenalty
        + man.dressCode*LEAGUE_PTS.dressCode;
      return { ...pl, auto, man, pts };
    });
    const teamBasic  = players.reduce((s,p)=>s+p.auto.basic,0);
    const teamOrders = players.reduce((s,p)=>s+p.auto.orderCount,0);
    const salesPct   = weeklyTeamTarget>0 ? Math.round(teamBasic/weeklyTeamTarget*100) : 0;
    const playerPts  = players.reduce((s,p)=>s+p.pts,0);
    const total      = playerPts + salesPct;                 // sales-value % is a team-level score
    return { ...team, players, teamBasic, teamOrders, salesPct, playerPts, weeklyTeamTarget, total };
  });
  // Awards (individual, this week).
  const everyPlayer = [];
  teams.forEach(t=>t.players.forEach(p=>everyPlayer.push({ ...p, team:t })));
  const orangeCap = everyPlayer.slice().sort((a,b)=>b.auto.basic-a.auto.basic)[0];
  const purpleCap = everyPlayer.slice().sort((a,b)=>b.auto.orderCount-a.auto.orderCount)[0];
  const leader = teams[0].total===teams[1].total ? null : (teams[0].total>teams[1].total?teams[0]:teams[1]);
  return { teams, weeklyTeamTarget, orangeCap:(orangeCap&&orangeCap.auto.basic>0)?orangeCap:null, purpleCap:(purpleCap&&purpleCap.auto.orderCount>0)?purpleCap:null, leader };
}

  const wk = leagueWeek(weekOff);
  const decided = wk.endISO < _todayISO();        // week is over → result locked
  const std = computeLeague(orders, league, wk);
  const [a,b] = std.teams;

  const [weeklyTarget,setWeeklyTarget]   = useState(String((league&&league.weeklyTarget)||''));

  useEffect(()=>{ setMonthlyTarget(String((league&&league.monthlyTarget)||'')); setWeeklyTarget(String((league&&league.weeklyTarget)||'')); setSom((league&&league.salesmanOfMonth)||''); },[league&&league.monthlyTarget,league&&league.weeklyTarget,league&&league.salesmanOfMonth]);
  // Existing manual entry for a given (date, player), so the inputs pre-fill.
  function entryFor(date,player){
    return ((league&&league.scores)||[]).find(s=>String(s.date||'').slice(0,10)===date && String(s.player||'').trim().toLowerCase()===player.toLowerCase()) || {};

    // Re-seed the draft inputs whenever the edit date (or loaded scores) change.
    const seed={};

      LEAGUE_MANUAL_FIELDS.forEach(f=>row[f.key]=String(Number(e[f.key])||0));
      seed[p.name]=row;
    }));
    setDraftRows(seed);
  },[editDate,league&&league.scores]);
  const [savingPlayer,setSavingPlayer]=useState('');

    const row=draftRows[pl.name]||{};
    const payload={ date:editDate, player:pl.name, team:team.name, notes:'' };
    LEAGUE_MANUAL_FIELDS.forEach(f=>payload[f.key]=Number(row[f.key])||0);

    setSavingPlayer('');
  }
  function setDraft(player,key,val){ setDraftRows(p=>({...p,[player]:{...(p[player]||{}),[key]:val}})); }
  // Counter step: +1 / −1 a manual criterion, clamped at 0 (never negative counts).
  function setDraftDelta(player,key,delta){ setDraftRows(p=>{ const cur=Number((p[player]||{})[key])||0; const next=Math.max(0,cur+delta); return {...p,[player]:{...(p[player]||{}),[key]:String(next)}}; }); }
  // Live points from the current (unsaved) draft, so the admin sees the tally build.
  function draftManualPts(player){ const dr=draftRows[player]||{}; return (Number(dr.reviews)||0)*LEAGUE_PTS.review + (Number(dr.happyCalling)||0)*LEAGUE_PTS.happyCalling + (Number(dr.teleConv)||0)*LEAGUE_PTS.teleConv + (Number(dr.teleConvReview)||0)*LEAGUE_PTS.teleConvReview + (Number(dr.followupMissed)||0)*LEAGUE_PTS.followupMissed + (Number(dr.timingPenalty)||0)*LEAGUE_PTS.timingPenalty + (Number(dr.dressCode)||0)*LEAGUE_PTS.dressCode; }

function ReportsScreen({ctx}) {
  const {orders,nav} = ctx;
  const [from,setFrom]     = useState('');
  const [to,setTo]         = useState('');
  const [preset,setPreset] = useState('all');
  // Collapsible breakdown sections — all collapsed by default (show counts only).
  const [open,setOpen] = useState({});
  const toggle = id => setOpen(p=>({...p,[id]:!p[id]}));

  const _pad = n => String(n).padStart(2,'0');
  const _iso = d => d.getFullYear()+'-'+_pad(d.getMonth()+1)+'-'+_pad(d.getDate());

  // Today's Sale — always computed over ALL orders (independent of the date-range
  // filter above) so the highlighted box reflects the current day only.
  const _todayISO = _iso(new Date());
  const todays    = (orders||[]).filter(o => o && o.status !== 'draft' && _toISO(o.date) === _todayISO);
  const todayCount = todays.length;
  const todayAmt   = todays.reduce((s,o)=>s+_exGst(o.amt),0);
  // Today's Sale, split the same way as the range totals: Franchise (KB / 34S /
  // untagged) vs 4Sinteriors (items tagged "4S").
  let todayFranchiseAmt = 0, todayFoursAmt = 0;
  todays.forEach(o => { const sp = _channelSplit(o); todayFranchiseAmt += sp.franchise; todayFoursAmt += sp.foursint; });
  function applyPreset(id){
    const now = new Date(), y = now.getFullYear(), m = now.getMonth();
    setPreset(id);
    if (id==='all')       { setFrom(''); setTo(''); }
    else if (id==='month'){ setFrom(_iso(new Date(y,m,1)));  setTo(_iso(now)); }
    else if (id==='year') { setFrom(_iso(new Date(y,0,1)));  setTo(_iso(now)); }
  }

  const booked = (orders||[]).filter(o => o && o.status !== 'draft').filter(o => {
    const iso = _toISO(o.date);
    if (!iso) return !from && !to;                 // undated: only when no range set
    if (from && iso < from) return false;
    if (to   && iso > to)   return false;
    return true;
  });
  const totalCount = booked.length;
  const totalAmt   = booked.reduce((s,o)=>s+_exGst(o.amt),0);

  // Franchise (KB / 34S / untagged) vs 4Sinteriors (items tagged "4S") split.
  let franchiseAmt = 0, franchiseCount = 0, foursAmt = 0, foursCount = 0;
  booked.forEach(o => {
    const sp = _channelSplit(o);
    franchiseAmt += sp.franchise; foursAmt += sp.foursint;
    if (sp.franchise > 0) franchiseCount++;
    if (sp.foursint  > 0) foursCount++;
  });

  const monthMap = {}, dayMap = {}, salesMap = {}, branchMap = {};
  booked.forEach(o => {
    const p = String(o.date||'').split('.');       // [dd, mm, yy]
    if (p.length === 3) {
      const mk = p[2] + '.' + p[1];                // yy.mm — sorts chronologically
      if (!monthMap[mk]) monthMap[mk] = { count:0, amt:0, label:(_MONTHS[(parseInt(p[1],10)||1)-1]||p[1])+' 20'+p[2] };
      monthMap[mk].count++; monthMap[mk].amt += _exGst(o.amt);
      const dk = p[2] + '.' + p[1] + '.' + p[0];
      if (!dayMap[dk]) dayMap[dk] = { count:0, amt:0, label:o.date };
      dayMap[dk].count++; dayMap[dk].amt += _exGst(o.amt);
    }
    const sp = (o.salesExec||'').trim() || '(unassigned)';
    if (!salesMap[sp]) salesMap[sp] = { count:0, amt:0, label:sp };
    salesMap[sp].count++; salesMap[sp].amt += _exGst(o.amt);
    const br = (o.branch||'').trim();              // only present if the sheet carries it
    if (br) { if (!branchMap[br]) branchMap[br] = { count:0, amt:0, label:br }; branchMap[br].count++; branchMap[br].amt += _exGst(o.amt); }
  });
  const byAmt  = (a,b)=> b[1].amt - a[1].amt;
  const months = Object.entries(monthMap).sort((a,b)=>b[0].localeCompare(a[0]));
  const days   = Object.entries(dayMap).sort((a,b)=>b[0].localeCompare(a[0])).slice(0, 60);
  const sales  = Object.entries(salesMap).sort(byAmt);
  const branches = Object.entries(branchMap).sort(byAmt);

  const Row = ({label, sub, count, amt}) => (
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 14px',borderBottom:`1px solid ${T.line}`}}>
      <div><div style={{fontSize:13,fontWeight:700,color:T.ink}}>{label}</div>{sub?<div style={{fontSize:10,color:T.ink4,fontFamily:T.mono,marginTop:1}}>{sub}</div>:null}</div>
      <div style={{textAlign:'right'}}>
        <div style={{fontSize:14,fontFamily:T.mono,fontWeight:700,color:T.ink}}>{_fmtAmt(amt)}</div>
        <div style={{fontSize:10,color:T.ink4,marginTop:1}}>{count} order{count===1?'':'s'}</div>
      </div>
    </div>
  );
  // Collapsible breakdown section — the header is clickable and shows the group
  // count; the rows stay hidden until it is expanded.
  const Section = ({id, title, rows, empty}) => {
    const isOpen = !!open[id];
    return (
      <>

            <div style={{fontSize:20,fontWeight:700,letterSpacing:-0.4}}>Orders &amp; amount</div>
            <div style={{fontSize:10,color:T.ink4,marginTop:1}}>All amounts shown are pre-GST (excl. 18% GST)</div>

        </div>
        {/* Date-range filter */}
        <div style={{display:'flex',gap:6,padding:'2px 14px 8px',overflowX:'auto'}}>

        {preset==='custom' && (

            <input type="date" value={to} onChange={e=>{setTo(e.target.value);}} style={{flex:1,border:`1px solid ${T.line}`,borderRadius:6,padding:'8px 10px',fontFamily:T.mono,fontSize:12,color:T.ink,background:'#fff'}}/>
          </div>

          <div style={{background:'#fff',border:`1px solid ${T.line}`,borderRadius:8,padding:'12px 14px'}}>
            <div style={{fontSize:9,color:T.ink4,fontWeight:700,letterSpacing:.8}}>TOTAL ORDERS</div>
            <div style={{fontSize:26,fontWeight:800,letterSpacing:-1,color:T.ink,lineHeight:1.1,marginTop:4}}>{totalCount}</div>
          </div>
          <div style={{background:'#fff',border:`1px solid ${T.line}`,borderRadius:8,padding:'12px 14px'}}>
            <div style={{fontSize:9,color:T.ink4,fontWeight:700,letterSpacing:.8}}>TOTAL AMOUNT · EX-GST</div>
            <div style={{fontSize:26,fontWeight:800,letterSpacing:-1,color:T.green,lineHeight:1.1,marginTop:4}}>{_fmtAmt(totalAmt)}</div>

        </div>
        {/* Channel split — Franchise (KB / 34S / untagged) vs 4Sinteriors (4S) */}

// ─── Collectibles / Outstanding payments ─────────────────────
// Every booked order that still has a balance due, newest-largest first, with the
// running total to collect. Uses orderReceived() so part-payments recorded on
// receipts 2 & 3 shrink the balance. Tap a row to open the order and record a
// payment; the WhatsApp icon sends the customer a balance reminder.
function CollectiblesScreen({ctx}) {
  const {orders,nav,loadOrders,loading,setOrder} = ctx;
  const [salesFilter,setSalesFilter] = useState('');
  useEffect(()=>{ loadOrders(); },[]);

  const due = (orders||[])
    .filter(o=>o && o.status!=='draft')
    .map(o=>({o, ...orderReceived(o)}))
    .filter(x=>x.balance>2);
  const salespeople = [...new Set(due.map(x=>(x.o.salesExec||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const shown = due
    .filter(x=>!salesFilter || (x.o.salesExec||'').trim().toLowerCase()===salesFilter.toLowerCase())
    .sort((a,b)=>b.balance-a.balance);
  const totalOutstanding = shown.reduce((s,x)=>s+x.balance,0);

  const openOrder = o => { setOrder({...BLANK_ORDER(),...normalizeLoadedOrder(o)}); nav('order'); };
  function remind(o, balance){
    const msg = `Dear ${o.customer||'Customer'},\n\nGentle reminder from 4S Interiors about your order *#${o.no||'—'}*.\n\n*Outstanding balance:* ₹${balance.toLocaleString('en-IN')}\n\nKindly arrange the payment at your convenience. For any help call 0674-2744906.\n\nThank you,\n4S Interiors, Patia, Bhubaneswar\n_Authorised Dealer — Godrej Interio_`;
    const phone = (o.phone||'').replace(/\D/g,'');
    window.open('https://wa.me/'+(phone?'91'+phone:'')+'?text='+encodeURIComponent(msg),'_blank');
  }

  return (
    <div className="screen">
      <div style={{flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:8,padding:'12px 14px 8px'}}>
          <button onClick={()=>nav('home')} title="Home" style={{width:32,height:32,borderRadius:6,background:'#fff',border:`1px solid ${T.line}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>{Icon.back()}</button>
          <div style={{flex:1}}>
            <div style={{fontSize:11,color:T.ink4,fontFamily:T.mono,letterSpacing:1}}>COLLECTIBLES</div>
            <div style={{fontSize:20,fontWeight:700,letterSpacing:-0.4}}>Outstanding payments</div>
          </div>
          <button onClick={()=>loadOrders()} title="Refresh" style={{width:32,height:32,borderRadius:6,background:'#fff',border:`1px solid ${T.line}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>{Icon.refresh(T.ink2,15)}</button>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1.3fr 1fr',gap:8,padding:'2px 14px 10px'}}>
          <div style={{background:'#fff',border:`1px solid ${T.line}`,borderRadius:8,padding:'12px 14px'}}>
            <div style={{fontSize:9,color:T.ink4,fontWeight:700,letterSpacing:.8}}>TOTAL TO COLLECT</div>
            <div style={{fontSize:24,fontWeight:800,letterSpacing:-1,color:totalOutstanding>0?T.bad:T.ok,lineHeight:1.1,marginTop:4}}>₹{Math.round(totalOutstanding).toLocaleString('en-IN')}</div>
          </div>
          <div style={{background:'#fff',border:`1px solid ${T.line}`,borderRadius:8,padding:'12px 14px'}}>
            <div style={{fontSize:9,color:T.ink4,fontWeight:700,letterSpacing:.8}}>ORDERS</div>
            <div style={{fontSize:24,fontWeight:800,letterSpacing:-1,color:T.ink,lineHeight:1.1,marginTop:4}}>{shown.length}</div>
          </div>
        </div>
        {salespeople.length>0 && (
          <div style={{padding:'0 14px 8px',display:'flex',gap:6,overflowX:'auto',alignItems:'center'}}>
            <span style={{fontSize:11,color:T.ink4,fontWeight:700,flexShrink:0}}>SALES</span>
            <span onClick={()=>setSalesFilter('')} style={{padding:'5px 10px',borderRadius:99,background:!salesFilter?T.green:'#fff',color:!salesFilter?'#fff':T.ink2,border:`1px solid ${!salesFilter?T.green:T.line}`,fontSize:12,fontWeight:600,cursor:'pointer',flexShrink:0}}>All</span>
            {salespeople.map(sp=>(
              <span key={sp} onClick={()=>setSalesFilter(sp)} style={{padding:'5px 10px',borderRadius:99,background:salesFilter===sp?T.green:'#fff',color:salesFilter===sp?'#fff':T.ink2,border:`1px solid ${salesFilter===sp?T.green:T.line}`,fontSize:12,fontWeight:600,cursor:'pointer',flexShrink:0,whiteSpace:'nowrap'}}>{sp}</span>
            ))}
          </div>
        )}
      </div>
      <div className="scroll">
        {loading && orders.length===0 && [0,1,2,3].map(i=><SkeletonOrderRow key={i}/>)}
        {shown.map(({o,total,received,balance})=>(
          <div key={o.no} style={{background:'#fff',borderTop:`1px solid ${T.line}`,borderBottom:`1px solid ${T.line}`,padding:'12px 18px',display:'grid',gridTemplateColumns:'1fr auto',gap:10,cursor:'pointer'}} onClick={()=>openOrder(o)}>
            <div style={{minWidth:0}}>
              <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:3}}>
                <span style={{fontFamily:T.mono,fontSize:11,color:T.ink2,fontWeight:600}}>{o.no}</span>
                {o.won?<Pill tone="ok" mono size="sm">{o.won}</Pill>:null}
              </div>
              <div style={{fontSize:14,fontWeight:700,color:T.ink,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{o.customer}</div>
              <div style={{fontSize:11,color:T.ink4,fontFamily:T.mono,marginTop:2}}>{o.salesExec}{o.plannedDly?' · dly '+prettyDate(o.plannedDly):''}</div>
              <div style={{fontSize:11,color:T.ink3,marginTop:3,fontFamily:T.mono}}>Bill ₹{Math.round(total).toLocaleString('en-IN')} · Paid ₹{Math.round(received).toLocaleString('en-IN')}</div>
            </div>
            <div style={{textAlign:'right',display:'flex',flexDirection:'column',alignItems:'flex-end',gap:6}}>
              <div>
                <div style={{fontSize:9,color:T.ink4,fontWeight:700,letterSpacing:.6}}>BALANCE</div>
                <div style={{fontSize:17,fontFamily:T.mono,fontWeight:800,color:T.bad,letterSpacing:-0.4}}>₹{Math.round(balance).toLocaleString('en-IN')}</div>
              </div>
              <span title="Send balance reminder on WhatsApp" onClick={e=>{e.stopPropagation();remind(o,Math.round(balance));}} style={{width:32,height:28,borderRadius:5,background:'#25d36622',display:'inline-flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>{Icon.whatsapp('#25d366',14)}</span>
            </div>
          </div>
        ))}
        {!loading && shown.length===0 && (
          <div style={{padding:'48px 24px',textAlign:'center'}}>
            <div style={{width:52,height:52,borderRadius:14,background:T.greenSoft,display:'inline-flex',alignItems:'center',justifyContent:'center',marginBottom:12}}><span style={{fontWeight:800,fontSize:22,color:T.green}}>₹</span></div>
            <div style={{fontSize:14,fontWeight:700,color:T.ink2,marginBottom:4}}>All clear</div>
            <div style={{fontSize:12,color:T.ink4,lineHeight:1.5}}>{salesFilter?'No balance due for this salesperson.':'No outstanding balances right now.'}</div>
          </div>
        )}
        <div style={{height:24}}/>
      </div>
      <BottomNav screen="home" nav={nav}/>
    </div>
  );
}

// ─── Home ───────────────────────────────────────────────────
function HomeScreen({ctx}) {
  const {user,orders,syncedAt,priceItems,priceSyncError,nav,loadOrders,syncPriceList,loading,unreadCount,loadMis} = ctx;
  const isAdmin = normRole(user?.role) === 'admin';

  const pendingWON  = orders.filter(o=>!o.won&&o.status!=='draft').length;
  const mtd         = orders.reduce((s,o)=>s+o.amt,0);
  useEffect(()=>{ loadOrders(); loadMis({silent:true}); requestNotifPermission(); },[]);
  return (
    <div className="screen">
      <div style={{flexShrink:0}}>
        <StockRibbon syncedAt={syncedAt}/>
        <div style={{padding:'14px 18px 6px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>

            <div style={{fontSize:11,color:T.ink4,fontFamily:T.mono,letterSpacing:1}}>{istToday({weekday:'short',day:'2-digit',month:'short'}).toUpperCase()}</div>
            <div style={{fontSize:22,fontWeight:700,letterSpacing:-0.5,marginTop:2,display:'flex',alignItems:'center',gap:8}}>Hi, {user?.name||'there'}
              {hasManagerAccess(user)&&<span style={{fontSize:9,fontWeight:800,letterSpacing:.6,color:'#fff',background:T.ink,padding:'2px 7px',borderRadius:99,textTransform:'uppercase'}}>{normRole(user?.role)}</span>}
            </div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div onClick={()=>nav('notifs')} style={{position:'relative',width:42,height:42,borderRadius:6,background:'#fff',border:`1px solid ${T.line}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>
              {Icon.bell(T.ink2,20)}
              {unreadCount>0 && <span style={{position:'absolute',top:-5,right:-5,minWidth:18,height:18,padding:'0 4px',borderRadius:99,background:T.bad,color:'#fff',fontSize:10,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:T.mono}}>{unreadCount>99?'99+':unreadCount}</span>}
            </div>
            <div style={{width:42,height:42,borderRadius:6,background:T.green,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:T.mono,fontSize:16,fontWeight:700}}>{(user?.name||'?').slice(0,2).toUpperCase()}</div>
          </div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1.2fr 1fr 1fr',gap:8,padding:'8px 18px 14px'}}>
          {[{label:'TODAY',val:String(todayOrders.length),sub:'orders',tone:'green'},{label:'PEND WON',val:String(pendingWON),sub:'awaiting',tone:'warn'},{label:'M.T.D.',val:'₹'+(mtd>99999?(mtd/100000).toFixed(1)+'L':mtd.toLocaleString('en-IN')),sub:'booked',tone:'ink'}].map(s=>(
            <div key={s.label} style={{background:'#fff',border:`1px solid ${T.line}`,borderRadius:6,padding:'10px 11px',position:'relative',overflow:'hidden'}}>
              <div style={{fontSize:9,color:T.ink4,fontWeight:700,letterSpacing:.8}}>{s.label}</div>
              <div style={{fontSize:24,fontWeight:700,letterSpacing:-1,color:T.ink,lineHeight:1.1,marginTop:4}}>{s.val}</div>
              <div style={{fontSize:11,color:T.ink3}}>{s.sub}</div>
              <div style={{position:'absolute',left:0,top:0,bottom:0,width:3,background:s.tone==='green'?T.green:s.tone==='warn'?T.warn:T.ink}}/>
            </div>
          ))}
        </div>
        {/* Resume an unsaved order draft (autosaved locally, restored after login). */}
        {(()=>{ let draft=null; try{ const d=JSON.parse(localStorage.getItem('4s_draft')||'null'); if(d && !d.no && ((d.items&&d.items.length)||d.customer)) draft=d; }catch(e){} if(!draft) return null; return (
          <div style={{margin:'0 18px 12px',padding:'11px 14px',background:T.warnSoft,border:'1px solid #e6cc95',borderRadius:8,display:'flex',alignItems:'center',gap:10}}>

              <div style={{fontSize:12,fontWeight:800,color:T.warn}}>Unsaved order in progress</div>
              <div style={{fontSize:11,color:T.ink3,marginTop:1,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{draft.customer||'Draft'} · {(draft.items||[]).length} item{(draft.items||[]).length===1?'':'s'}</div>
            </div>
            <button onClick={()=>{ try{ctx.setOrder({...BLANK_ORDER(),...draft});}catch(e){} nav('order'); }} style={{flexShrink:0,height:32,padding:'0 14px',borderRadius:6,background:T.green,border:'none',color:'#fff',fontSize:12,fontWeight:700,cursor:'pointer'}}>Resume</button>
            <button onClick={()=>{ if(!window.confirm('Discard the unsaved draft?'))return; try{localStorage.removeItem('4s_draft');}catch(e){} ctx.setOrder(BLANK_ORDER()); }} title="Discard draft" style={{flexShrink:0,width:32,height:32,borderRadius:6,background:'#fff',border:`1px solid ${T.line}`,display:'inline-flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>{Icon.trash(T.ink4,14)}</button>
          </div>
        ); })()}
        <div style={{padding:'0 18px 12px'}}>

            <div><div style={{fontSize:11,fontWeight:600,opacity:.7,letterSpacing:.5,textTransform:'uppercase'}}>MANUAL</div><div style={{fontSize:18,fontWeight:700,letterSpacing:-0.4,marginTop:2}}>Manual Order</div></div>
            <div style={{width:40,height:40,borderRadius:99,background:'#fff',display:'flex',alignItems:'center',justifyContent:'center'}}>{Icon.plus(T.ink)}</div>
          </button>
        </div>

        {/* Price list status banner */}

// ─── Stock Search ────────────────────────────────────────────
// Browse Items room ordering. Groups the list so it reads Living Room → Bedroom
// → Dining → Wardrobe & Storage → everything else, using the price-list CATEGORY
// (it.cat) first, then the matched Product Catalog room, then the description —
// so it still works for SKUs that never matched the catalog. Precedence is
// deliberate: dining and storage are checked before bedroom so a "Dining Room"
// or "Home Storage" item is never pulled into bedroom, and storage is its own
// group even when the feed files a wardrobe under bedroom furniture.
function roomRank(it, catEntry) {
  // Authoritative path: the backend ships the row's own CATEGORY column as
  // it.room ("Living Room Furniture", "Bedroom Furniture", …). Rank from that
  // alone so a stray word in the product name ("…Storage Ottoman") can't drag a
  // living-room item into the storage group.
  const rm = (it.room || '').toLowerCase();
  if (rm) {
    if (/dining/.test(rm)) return 2;
    if (/storage|wardrobe|kreation|almirah|cabinet/.test(rm)) return 3;
    if (/bed|mattress/.test(rm)) return 1;
    if (/living|sofa|recliner|lounger|occasional|lounge/.test(rm)) return 0;
    return 4;
  }
  // Fallback for items without a room label (raw Godrej tabs): infer from all
  // available fields, most-specific first.
  const s = ((it.cat||'') + ' ' + (it.item||'') + ' ' + (it.sheet||'') + ' ' +
             (catEntry && catEntry.mainCat || '') + ' ' + (it.name||''))
            .toLowerCase().replace(/[^a-z0-9]+/g, ' ');   // underscores → spaces so \b works
  if (/\bdining\b|dintbl|din tbl/.test(s)) return 2;
  if (/wardrobe|almirah|\bstorage\b|kreation|sideboard|chest of|shoe\s?rack|book\s?shelf|\bcabinet\b/.test(s)) return 3;
  if (/bedroom|\bbeds?\b|mattress|dresser|bedside|night\s?stand/.test(s)) return 1;
  if (/living room|\bsofa\b|recliner|lounger|coffee\s?table|\bottoman\b|settee|occasional/.test(s)) return 0;
  return 4;
}

// ─── Manual item entry ───────────────────────────────────────────
// For items that aren't in the price list: the salesperson types the item code,
// description and price by hand and the item is added to the order like any
// other. The price entered is the customer-facing MRP (GST-inclusive) — the same
// terms as the MRP / SELL boxes on the order form — so the rest of the flow
// (order form, PDF, GST breakup, saving) treats it identically to a catalog item.
function ManualItemSheet({onClose, onAdd, initialName}) {
  const [code,setCode] = React.useState('');
  const [name,setName] = React.useState(initialName||'');
  const [price,setPrice] = React.useState('');
  const [tried,setTried] = React.useState(false);
  const codeOk  = code.trim().length>0;
  const nameOk  = name.trim().length>0;
  const priceNum= parseFloat(price);
  const priceOk = isFinite(priceNum) && priceNum>0;
  const valid   = codeOk && nameOk && priceOk;
  function submit(){
    setTried(true);
    if(!valid) return;
    onAdd({code:code.trim(), name:name.trim(), price:priceNum});
  }
  return (
    <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(10,15,13,.45)',zIndex:9997,display:'flex',alignItems:'flex-end',justifyContent:'center'}}>

            <Field label="Item Code" value={code} onChange={setCode} mono required placeholder="e.g. CUSTOM-001" error={tried&&!codeOk?'Enter the item code':''}/>
            <Field label="Item Description" value={name} onChange={setName} multiline required placeholder="Full product description" error={tried&&!nameOk?'Enter a description':''}/>
            <Field label="Price ₹ (incl. 18% GST)" value={price} onChange={v=>setPrice(v.replace(/[^\d.]/g,''))} mono required type="tel" placeholder="Customer price incl. GST" hint="The customer-facing MRP. Add a discount later on the order form if needed." error={tried&&!priceOk?'Enter a valid price':''}/>
          </div>
