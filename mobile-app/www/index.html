            {resolved.length>0 && <div style={{padding:'12px 18px 4px',fontSize:11,fontWeight:700,color:T.green,letterSpacing:1}}>RESOLVED · {resolved.length}</div>}
            {resolved.map(o=>card(o,'resolved'))}
            {flagged.length===0 && <div style={{padding:'34px 18px',textAlign:'center',color:T.ink4}}><div style={{fontSize:34,marginBottom:8}}>✓</div><div style={{fontSize:14,fontWeight:600}}>No service requests</div><div style={{fontSize:12,marginTop:4}}>Search above to flag an order that needs service.</div></div>}
          </>
        )}
        <div style={{height:24}}/>
      </div>
      {sel && <ServiceRequestModal order={sel} ctx={ctx} onClose={()=>setSel(null)}/>}
    </div>
  );
}

// ─── Order History ───────────────────────────────────────────
function HistoryScreen({ctx}) {
  const {orders,mis,nav,loadOrders,loadMis,doUpdateDelivery,doDeleteOrder,user,misLoading,loading} = ctx;
  const isAdmin = normRole(user?.role) === 'admin';
  // Default view: Pending orders of ALL salespersons.
  const [tab,setTab] = useState('pending');
  const [wonOrder,setWonOrder] = useState(null);
  const [query,setQuery] = useState('');
  const [salesFilter,setSalesFilter] = useState('');
  const [partialOrder,setPartialOrder] = useState(null);   // order awaiting the partial-delivery picker
  const [rescheduleOrder,setRescheduleOrder] = useState(null); // order awaiting the reschedule date picker
  const [serviceOrder,setServiceOrder] = useState(null);   // order whose service request is being raised/edited
  const [statusView,setStatusView] = useState(null);       // null=ledger · 'menu'=category grid · <catId>=that category's orders
  const [statusSales,setStatusSales] = useState('');       // salesperson filter inside a status category ('' = all)
  const [reportView,setReportView] = useState(false);      // false=ledger · true=sales-team follow-up report
  const [reportSales,setReportSales] = useState('');       // salesperson filter on the report ('' = whole team)
  const [dateView,setDateView] = useState(false);          // false=ledger · true=by-date drill-down
  const [watchView,setWatchView] = useState(false);        // false=ledger · true=Delivery Watch (approaching/overdue)
  const [dateFrom,setDateFrom] = useState('');             // ISO yyyy-mm-dd range start for the by-date view
  const [dateTo,setDateTo]     = useState('');             // ISO yyyy-mm-dd range end for the by-date view
  useEffect(()=>{ loadOrders(); loadMis({silent:true}); },[]);
  // Delivery-status category helpers. "rescheduled for delivery" also contains
  // "scheduled", so anchor both with ^ to keep the two buckets separate.
  const st = o => (o.deliveryStatus||'').toLowerCase();
  const isCompleted = o => o.status==='completed' || /installation done/i.test(o.deliveryStatus||'');
  // An order still awaiting its WON / SO number (a "Pending Won"). Such an order
  // is bucketed under Pending Won ONLY — it is excluded from the plain Pending
  // bucket below so a single order is never counted in both.
  const isPendWon = o => !o.won && o.status!=='draft';
  // The order-status categories (shared by the Order Status drill-down grid and the
  // ledger tab strip). Each has an accent colour for its count box.
  const CATS = [
    {id:'pending',    label:'Pending',      tone:T.warn,  filter:o=>!isCompleted(o) && !isPendWon(o) && (!st(o) || /^pending/.test(st(o)))},
    {id:'pendwon',    label:'Pending Won',  tone:T.warn,  filter:o=>isPendWon(o)},
    {id:'scheduled',  label:'Scheduled',    tone:T.ink,   filter:o=>/^scheduled/.test(st(o))},
    {id:'rescheduled',label:'Rescheduled',  tone:T.green, filter:o=>/^rescheduled/.test(st(o))},
    {id:'delivered',  label:'Delivered',    tone:T.ok,    filter:o=>/^delivered/.test(st(o))},
    {id:'partial',    label:'Partial',      tone:T.warn,  filter:o=>/partial/.test(st(o))},
    {id:'completed',  label:'Completed',    tone:T.ok,    filter:o=>isCompleted(o)},
  ];
  const tabs = [...CATS.map(({id,label,filter})=>({id,label,filter})), {id:'all',label:'All',filter:()=>true}];
  const active = tabs.find(t=>t.id===tab)||tabs[0];

  // Distinct salespersons for the filter dropdown
  const salespeople = [...new Set(orders.map(o=>(o.salesExec||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const q = query.trim().toLowerCase();
  const matchesQuery = o => !q || String(o.no||'').toLowerCase().includes(q) || String(o.won||'').toLowerCase().includes(q);
  const matchesSales = o => !salesFilter || (o.salesExec||'').trim().toLowerCase()===salesFilter.toLowerCase();
  const shown = orders.filter(active.filter).filter(matchesQuery).filter(matchesSales);

  // ── Delivery Watch data ────────────────────────────────────────────────────
  // Orders whose delivery is due tomorrow, due today, or already overdue AND that
  // still need action (not Scheduled / Delivered / Installation Done). Sorted
  // most-overdue first. Salesperson + search filters from the ledger still apply.
  const watchAll = orders
    .map(o => ({ o, w: deliveryWatchInfo(o, mis) }))
    .filter(x => x.w)
    .sort((a,b) => a.w.dd - b.w.dd);            // most negative (most overdue) first
  const watchShown = watchAll.filter(x => matchesQuery(x.o)).filter(x => matchesSales(x.o));
  const watchCount       = watchAll.length;
  const overdueCount     = watchAll.filter(x => x.w.bucket === 'overdue').length;
  const approachingCount = watchAll.filter(x => x.w.bucket === 'approaching').length;

  async function changeDelivery(o, val){
    if(!val || val===(o.deliveryStatus||'Pending')) return;
    // An order can't be Delivered / Installation Done until it is fully paid
    // (order amount == earnest + money-receipt amounts).
    if((/^delivered/i.test(val) || /installation done/i.test(val)) && !canMarkDelivered(o)){
      const bal = Math.round(orderReceived(o).balance);
      ctx.showToast('Can’t mark "'+val+'" — ₹'+bal.toLocaleString('en-IN')+' still due. Collect full payment first.','bad');
      return;
    }
    // Partial Delivery needs the item picker to record which items were delivered.
    if(/partial/i.test(val)){ setPartialOrder(o); return; }
    // Rescheduled for Delivery needs a new date.
    if(/rescheduled/i.test(val)){ setRescheduleOrder(o); return; }
    await doUpdateDelivery(o.no, o.internalNo, val);
  }
  async function confirmPartial(deliveredItems){
    const o = partialOrder; setPartialOrder(null);
    if(o) await doUpdateDelivery(o.no, o.internalNo, 'Partial Delivery', deliveredItems);
  }
  async function confirmReschedule(newDate){
    const o = rescheduleOrder; setRescheduleOrder(null);
    if(o && newDate) await doUpdateDelivery(o.no, o.internalNo, 'Rescheduled for Delivery', null, newDate);
  }

  if(wonOrder) return <WONUpdateScreen ctx={ctx} orderOverride={wonOrder} onClose={()=>setWonOrder(null)}/>;

  const openOrder = o => { ctx.setOrder({...BLANK_ORDER(),...normalizeLoadedOrder(o)}); nav('order'); };

  async function deleteOrder(o) {
    if (!isAdmin) return;
    if (!window.confirm('Permanently delete order '+(o.no||'')+' for '+(o.customer||'this customer')+'? This removes it from the CRM sheet and cannot be undone.')) return;
    await doDeleteOrder(o.no, o.internalNo);
  }

  // A single order row — reused by the ledger list and the Order-Status category
  // list. Shows the delivery date and the outstanding balance (or "Fully Paid").
  const orderCard = o => {
    const bal = Math.round(orderReceived(o).balance);
    // Colour the card's left edge by delivery urgency (green/orange/red) so the
    // list reads at a glance; a purple edge wins while a service request is open.
    const urg = deliveryUrgency(o, mis);
    const svc = serviceUrgency(o);
    const edge = (svc && svc.key==='open') ? svc.color : urg.color;
    return (
          <div key={o.no} style={{background:'#fff',borderTop:`1px solid ${T.line}`,borderBottom:`1px solid ${T.line}`,borderLeft:`4px solid ${edge}`,padding:'12px 18px 12px 14px',display:'grid',gridTemplateColumns:'1fr auto',gap:10,cursor:'pointer'}} onClick={()=>openOrder(o)}>
            <div style={{minWidth:0}}>
              <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:3,flexWrap:'wrap'}}>
                <span style={{fontFamily:T.mono,fontSize:11,color:T.ink2,fontWeight:600}}>{o.no}</span>
                {o.won?<Pill tone="ok" mono size="sm">{o.won}</Pill>:null}
                <span onClick={e=>{e.stopPropagation();setWonOrder(o);}} style={{display:'inline-flex',alignItems:'center',height:16,padding:'0 6px',borderRadius:4,background:T.warnSoft,color:T.warn,border:'1px solid #e6cc95',fontSize:10,fontWeight:700,cursor:'pointer'}}>{o.won?'+ SO':'+ ADD SO'}</span>
              </div>
              <div style={{fontSize:14,fontWeight:700,color:T.ink}}>{o.customer}</div>
              <div style={{fontSize:11,color:T.ink4,fontFamily:T.mono,marginTop:2}}>{o.salesExec}</div>
              {(() => {
                const dlIso = (o.plannedDly&&o.plannedDly.length>=8?o.plannedDly:'')||(misForOrder(mis,o)?.deliveryDate)||'';
                return dlIso ? <div style={{fontSize:11,color:T.ink3,marginTop:2}}>Delivery: <span style={{fontFamily:T.mono,fontWeight:600,color:T.ink2}}>{prettyDate(dlIso)}</span></div> : null;
              })()}
              <div style={{fontSize:11,marginTop:2}}>Balance: <span style={{fontFamily:T.mono,fontWeight:700,color:bal>0?T.bad:T.ok}}>{bal>0?'₹'+bal.toLocaleString('en-IN'):'Fully Paid'}</span></div>
              {(() => {
                const m = misForOrder(mis, o);
                const partialPending = /partial/i.test(o.deliveryStatus||'') ? Math.max(0,(o.items||[]).length-(o.deliveryStatus?(o.deliveredItems||[]).length:0)) : 0;
                return (
                  <div style={{display:'flex',gap:5,marginTop:4,flexWrap:'wrap'}}>
                    {(urg.key==='done'||urg.key==='delivered'||urg.key==='scheduled') && <Pill tone={urg.key==='done'?'ok':'warn'} size="sm">{urg.label}</Pill>}
                    {o.serviceFlag && <Pill tone={/resolved/i.test(o.serviceStatus||'')?'ok':'purple'} size="sm">⚠ SERVICE {/resolved/i.test(o.serviceStatus||'')?'RESOLVED':'OPEN'}</Pill>}
                    {m && m.committed && !isCompleted(o) && <Pill tone="green" size="sm">MIS ✓ committed {m.totalQty}/{m.totalQty}</Pill>}
                    {m && !m.committed && m.anyCommitted && !isCompleted(o) && <Pill tone="neutral" size="sm">MIS {m.committedQty}/{m.totalQty} committing</Pill>}
                    {partialPending>0 && <Pill tone="warn" size="sm">{partialPending} pending for delivery</Pill>}
                    {(o.plannedDly||(m&&m.deliveryDate)) && !isDeliveryDone(o) && (()=>{ const dl=(o.plannedDly&&o.plannedDly.length>=8?o.plannedDly:'')||(m&&m.deliveryDate)||''; const dd=daysFromToday(dl); if(dd==null) return null; if(dd<0) return <Pill tone="bad" size="sm">overdue {Math.abs(dd)}d</Pill>; if(dd<=DELIVERY_SOON_DAYS) return <Pill tone="warn" size="sm">{dd===0?'due today':'in '+dd+'d'}</Pill>; return null; })()}
                  </div>
                );
              })()}
            </div>
            <div style={{textAlign:'right'}}>
              <div style={{fontSize:16,fontFamily:T.mono,fontWeight:700,color:T.ink,letterSpacing:-0.4}}>₹{(o.amt||0).toLocaleString('en-IN')}</div>
              <div style={{display:'flex',gap:6,marginTop:6,justifyContent:'flex-end',alignItems:'center'}}>
                <select value={o.deliveryStatus||'Pending'} onClick={e=>e.stopPropagation()} onChange={e=>{e.stopPropagation();changeDelivery(o,e.target.value);}}
                  style={{padding:'4px 6px',borderRadius:4,border:`1px solid ${T.line}`,background:'#fff',color:T.ink2,fontSize:11,fontWeight:600,cursor:'pointer',WebkitAppearance:'none',appearance:'none',maxWidth:130}}>
                  {DELIVERY_STATUSES.map(s=><option key={s} value={s}>{s}</option>)}
                </select>
                <span title="Edit order" onClick={e=>{e.stopPropagation();openOrder(o);}} style={{width:32,height:28,borderRadius:5,background:T.greenSoft,display:'inline-flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>{Icon.edit(T.green,14)}</span>
                <span title="Order PDF" onClick={e=>{e.stopPropagation();ctx.setOrder({...BLANK_ORDER(),...normalizeLoadedOrder(o)});nav('pdf');}} style={{width:32,height:28,borderRadius:5,background:T.paper2,display:'inline-flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>{Icon.doc(T.ink3,14)}</span>
                <span title={o.serviceFlag?'Service request':'Flag a service request'} onClick={e=>{e.stopPropagation();setServiceOrder(o);}} style={{width:32,height:28,borderRadius:5,background:o.serviceFlag?(/resolved/i.test(o.serviceStatus||'')?T.greenSoft:(T.badSoft||'#fdecec')):T.paper2,display:'inline-flex',alignItems:'center',justifyContent:'center',cursor:'pointer',fontSize:14,fontWeight:700,color:o.serviceFlag?(/resolved/i.test(o.serviceStatus||'')?T.green:T.bad):T.ink3}}>⚠</span>
                <span title="Share PDF on WhatsApp" onClick={e=>{e.stopPropagation();shareOrderPDF(o,'customer',ctx.showToast);}} style={{width:32,height:28,borderRadius:5,background:'#25d36622',display:'inline-flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>{Icon.whatsapp('#25d366',14)}</span>
                {isPendWon(o)&&<span title="Send to sales team on WhatsApp — request they place the order in Salesforce and share the SO No" onClick={e=>{e.stopPropagation();shareOrderToSalesTeam(o,ctx.showToast);}} style={{display:'inline-flex',alignItems:'center',gap:4,height:28,padding:'0 8px',borderRadius:5,background:'#0b7dc422',color:'#0b6ba8',border:'1px solid #9fd0ea',fontSize:10,fontWeight:800,letterSpacing:0.3,cursor:'pointer'}}>{Icon.whatsapp('#0b6ba8',13)}SO</span>}
                {isAdmin&&<span title="Delete order (admin)" onClick={e=>{e.stopPropagation();deleteOrder(o);}} style={{width:32,height:28,borderRadius:5,background:T.badSoft||'#fdecec',display:'inline-flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>{Icon.trash(T.bad,14)}</span>}
              </div>
            </div>
          </div>
    );
  };

  // ── Order Status drill-down ────────────────────────────────────────────────
  // The category grid shows only the count per status; tapping a category opens
  // its order list. Reached from the "Order Status" box on the ledger.
  if (statusView === 'menu') {
    return (
      <div className="screen">
        <div style={{flexShrink:0}}>
          <div style={{display:'flex',alignItems:'center',gap:8,padding:'12px 14px 8px'}}>
            <button onClick={()=>setStatusView(null)} title="Back" style={{width:32,height:32,borderRadius:6,background:'#fff',border:`1px solid ${T.line}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>{Icon.back()}</button>
            <div style={{flex:1}}>
              <div style={{fontSize:11,color:T.ink4,fontFamily:T.mono,letterSpacing:1}}>ORDERS · BY STATUS</div>
              <div style={{fontSize:20,fontWeight:700,letterSpacing:-0.4}}>Order Status</div>
            </div>
          </div>
        </div>
        <div className="scroll" style={{padding:'6px 14px 20px'}}>
          <div style={{fontSize:12,color:T.ink4,padding:'6px 4px 12px'}}>Tap a status to see the orders in it.</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            {CATS.map(c=>{
              const n = orders.filter(c.filter).length;
              return (
                <div key={c.id} onClick={()=>{setStatusSales('');setStatusView(c.id);}} style={{background:'#fff',border:`1px solid ${T.line}`,borderLeft:`4px solid ${c.tone}`,borderRadius:10,padding:'14px 16px',cursor:'pointer',display:'flex',flexDirection:'column',gap:4}}>
                  <div style={{fontSize:30,fontWeight:800,letterSpacing:-1,color:c.tone,lineHeight:1}}>{n}</div>
                  <div style={{fontSize:13,fontWeight:700,color:T.ink}}>{c.label}</div>
                  <div style={{fontSize:10,color:T.ink4}}>{n===1?'1 order':n+' orders'}</div>
                </div>
              );
            })}
          </div>
        </div>
        <BottomNav screen="history" nav={nav}/>
      </div>
    );
  }
  if (statusView && statusView !== 'menu') {
    const cat = CATS.find(c=>c.id===statusView) || CATS[0];
    const catOrders = orders.filter(cat.filter);
    // Per-salesperson breakdown within this status. Tapping a name narrows the
    // list to just that person's orders in the status, so the team can be
    // followed up individually.
    const statusSalesCounts = {};
    catOrders.forEach(o=>{ const n=(o.salesExec||'').trim()||'—'; statusSalesCounts[n]=(statusSalesCounts[n]||0)+1; });
    const statusSalesNames = Object.keys(statusSalesCounts).sort((a,b)=>a.localeCompare(b));
    const catShown = statusSales ? catOrders.filter(o=>(((o.salesExec||'').trim())||'—')===statusSales) : catOrders;
    const salesChip = sel => ({padding:'6px 10px',borderRadius:999,border:`1px solid ${sel?cat.tone:T.line}`,background:sel?cat.tone:'#fff',color:sel?'#fff':T.ink2,fontSize:12,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap',flexShrink:0});
    return (
      <div className="screen">
        <div style={{flexShrink:0}}>
          <div style={{display:'flex',alignItems:'center',gap:8,padding:'12px 14px 10px'}}>
            <button onClick={()=>{setStatusSales('');setStatusView('menu');}} title="Back to statuses" style={{width:32,height:32,borderRadius:6,background:'#fff',border:`1px solid ${T.line}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>{Icon.back()}</button>
            <div style={{flex:1}}>
              <div style={{fontSize:11,color:T.ink4,fontFamily:T.mono,letterSpacing:1}}>ORDER STATUS</div>
              <div style={{fontSize:20,fontWeight:700,letterSpacing:-0.4}}>{cat.label} · {statusSales?catShown.length+' / '+catOrders.length:catOrders.length}</div>
            </div>
          </div>
          {/* Salesperson filter — order count per person in this status; tap to drill in */}
          {statusSalesNames.length>0 && (
            <div style={{display:'flex',gap:6,padding:'0 14px 10px',overflowX:'auto',WebkitOverflowScrolling:'touch'}}>
              <div onClick={()=>setStatusSales('')} style={salesChip(!statusSales)}>All · {catOrders.length}</div>
              {statusSalesNames.map(n=>(
                <div key={n} onClick={()=>setStatusSales(n===statusSales?'':n)} style={salesChip(statusSales===n)}>{n} · {statusSalesCounts[n]}</div>
              ))}
            </div>
          )}
        </div>
        <div className="scroll">
          {catShown.map(orderCard)}
          {catShown.length===0 && (
            <div style={{padding:'48px 24px',textAlign:'center'}}>
              <div style={{width:52,height:52,borderRadius:14,background:T.paper2,display:'inline-flex',alignItems:'center',justifyContent:'center',marginBottom:12}}>{Icon.doc(T.ink4,24)}</div>
              <div style={{fontSize:14,fontWeight:700,color:T.ink2,marginBottom:4}}>No orders in {cat.label}{statusSales?' for '+statusSales:''}</div>
              <div style={{fontSize:12,color:T.ink4,lineHeight:1.5}}>Orders with this status will appear here.</div>
            </div>
          )}
          <div style={{height:24}}/>
        </div>
        {partialOrder && <PartialDeliveryModal order={partialOrder} onCancel={()=>setPartialOrder(null)} onConfirm={confirmPartial}/>}
        {rescheduleOrder && <RescheduleModal order={rescheduleOrder} onCancel={()=>setRescheduleOrder(null)} onConfirm={confirmReschedule}/>}
        {serviceOrder && <ServiceRequestModal order={serviceOrder} ctx={ctx} onClose={()=>setServiceOrder(null)}/>}
        <BottomNav screen="history" nav={nav}/>
      </div>
    );
  }

  // ── Delivery Watch drill-down ──────────────────────────────────────────────
  // Action board for deliveries due tomorrow, due today or overdue that still
  // need work. Colour-coded by urgency, split into Overdue / Due-soon groups,
  // with count tiles up top. Salesperson + search filters from the ledger apply.
  if (watchView) {
    const wOver = watchShown.filter(x => x.w.bucket === 'overdue');
    const wApp  = watchShown.filter(x => x.w.bucket === 'approaching');
    const svcOpenShown = orders.filter(matchesQuery).filter(matchesSales)
      .filter(o => o.serviceFlag && !/resolved/i.test(o.serviceStatus||'')).length;
    // Watched orders by their current (action-needed) delivery status.
    const wByStatus = {};
    watchShown.forEach(x => { const s = x.o.deliveryStatus || 'Pending'; wByStatus[s] = (wByStatus[s]||0) + 1; });
    const tile = (label, n, color, soft, line) => (
      <div style={{flex:'1 1 96px',background:soft,border:`1px solid ${line}`,borderLeft:`4px solid ${color}`,borderRadius:10,padding:'10px 12px'}}>
        <div style={{fontSize:26,fontWeight:800,color,lineHeight:1}}>{n}</div>
        <div style={{fontSize:11,color:T.ink3,fontWeight:600,marginTop:3}}>{label}</div>
      </div>
    );
    return (
      <div className="screen">
        <div style={{flexShrink:0}}>
          <div style={{display:'flex',alignItems:'center',gap:8,padding:'12px 14px 6px'}}>
            <button onClick={()=>setWatchView(false)} title="Back" style={{width:32,height:32,borderRadius:6,background:'#fff',border:`1px solid ${T.line}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>{Icon.back()}</button>
            <div style={{flex:1}}>
              <div style={{fontSize:11,color:T.ink4,fontFamily:T.mono,letterSpacing:1}}>ORDERS · DELIVERY WATCH</div>
              <div style={{fontSize:20,fontWeight:700,letterSpacing:-0.4}}>Delivery Watch</div>
            </div>
            <Btn size="sm" icon={Icon.refresh(T.ink2,14)} onClick={()=>{loadOrders();loadMis({});}} disabled={misLoading}>Refresh</Btn>
          </div>
          <div style={{fontSize:12,color:T.ink4,padding:'0 18px 8px'}}>Deliveries due tomorrow, due today or overdue — and still needing action (not yet Scheduled, Delivered or Installed).</div>
          {/* Urgency count summary */}
          <div style={{display:'flex',gap:8,padding:'0 18px 8px',flexWrap:'wrap'}}>
            {tile('Overdue', wOver.length, T.bad, T.badSoft, T.badLine)}
            {tile('Due today / tomorrow', wApp.length, T.warn, T.warnSoft, T.warnLine)}
            {tile('Service open', svcOpenShown, T.purple, T.purpleSoft, T.purpleLine)}
          </div>
          {/* Per-status action counts — how many watched orders sit in each status */}
          {watchShown.length>0 && (
            <div style={{padding:'0 18px 10px',display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}}>
              <span style={{fontSize:11,color:T.ink4,fontWeight:700}}>ACTION</span>
              {Object.keys(wByStatus).map(s => <Pill key={s} tone="neutral" size="sm">{s} · {wByStatus[s]}</Pill>)}
            </div>
          )}
        </div>
        <div className="scroll">
          {wOver.length>0 && <div style={{padding:'10px 18px 4px',fontSize:11,fontWeight:700,color:T.bad,letterSpacing:1}}>⚠ OVERDUE · {wOver.length}</div>}
          {wOver.map(x => orderCard(x.o))}
          {wApp.length>0 && <div style={{padding:'14px 18px 4px',fontSize:11,fontWeight:700,color:T.warn,letterSpacing:1}}>⏰ DUE TODAY / TOMORROW · {wApp.length}</div>}
          {wApp.map(x => orderCard(x.o))}
          {watchShown.length===0 && (
            <div style={{padding:'48px 24px',textAlign:'center'}}>
              <div style={{width:52,height:52,borderRadius:14,background:T.okSoft,display:'inline-flex',alignItems:'center',justifyContent:'center',marginBottom:12,fontSize:26,color:T.ok}}>✓</div>
              <div style={{fontSize:14,fontWeight:700,color:T.ink2,marginBottom:4}}>All caught up</div>
              <div style={{fontSize:12,color:T.ink4,lineHeight:1.5}}>{(query||salesFilter)?'No watched deliveries match the current search / salesperson filter.':'No deliveries are overdue or due in the next day.'}</div>
            </div>
          )}
          <div style={{height:24}}/>
        </div>
        {partialOrder && <PartialDeliveryModal order={partialOrder} onCancel={()=>setPartialOrder(null)} onConfirm={confirmPartial}/>}
        {rescheduleOrder && <RescheduleModal order={rescheduleOrder} onCancel={()=>setRescheduleOrder(null)} onConfirm={confirmReschedule}/>}
        {serviceOrder && <ServiceRequestModal order={serviceOrder} ctx={ctx} onClose={()=>setServiceOrder(null)}/>}
        <BottomNav screen="history" nav={nav}/>
      </div>
    );
  }

  // ── Sales Team Report drill-down ───────────────────────────────────────────
  // A follow-up report: per salesperson, how many orders sit in Pending, Pending
  // Won, Scheduled and Delivered, with per-order details (order no, customer, MIS
  // committed status, delivery date, payment). Can be sent to the sales-team
  // WhatsApp group as a plain-text message (the group is chosen inside WhatsApp).
  if (reportView) {
    const REPORT_CATS = ['pending','pendwon','scheduled','delivered'].map(id=>CATS.find(c=>c.id===id));
    const money = n => '₹'+Math.round(n||0).toLocaleString('en-IN');
    const dlOf  = o => { const iso=(o.plannedDly&&o.plannedDly.length>=8?o.plannedDly:'')||(misForOrder(mis,o)?.deliveryDate)||''; return iso?prettyDate(iso):'TBD'; };
    const misOf = o => { const m=misForOrder(mis,o); if(!m) return 'not in MIS'; if(m.committed) return 'committed'; if(m.anyCommitted) return 'committing '+m.committedQty+'/'+m.totalQty; return 'pending'; };
    const payOf = o => { const {balance}=orderReceived(o); return balance>0?'Bal '+money(balance):'Fully Paid'; };
    // Orders for one salesperson in one category.
    const bucket = (name,c) => orders.filter(c.filter).filter(o=>((o.salesExec||'').trim()||'—')===name);
    // Total pending order value for a salesperson — the GST-excluded value of every
    // Pending + Pending Won order, summed, but counting ONLY items NOT delivered
    // from the 4S warehouse. Items tagged "4S" (the 4Sinteriors channel) are left
    // out entirely; KB / 34S / untagged lines remain. _channelSplit apportions each
    // order's pre-GST value (_exGst(o.amt)) by line share and returns exactly that
    // non-4S ("franchise") portion, so the 18% GST is already carved out and the
    // figure reconciles with the Reports screen's channel split.
    const PEND_VALUE_CATS = REPORT_CATS.filter(c=>c.id==='pending'||c.id==='pendwon');
    const pendValueOf = name => PEND_VALUE_CATS.reduce((s,c)=>s + bucket(name,c).reduce((t,o)=>t + _channelSplit(o).franchise, 0), 0);
    // How many Pending + Pending Won orders make up that value — the count shown
    // alongside it in the value summary, so it always matches the value's basis.
    const pendCountOf = name => PEND_VALUE_CATS.reduce((s,c)=>s + bucket(name,c).length, 0);
    // Every salesperson with at least one order in a reported status.
    const reportPeople = [...new Set([].concat(...REPORT_CATS.map(c=>orders.filter(c.filter).map(o=>(o.salesExec||'').trim()||'—'))))].sort((a,b)=>a.localeCompare(b));
    const scope = reportSales ? [reportSales] : reportPeople;
    const nothing = scope.every(name=>REPORT_CATS.every(c=>!bucket(name,c).length));
    // MIS status is only meaningful for Pending / Scheduled orders; Delivered and
    // Pending Won orders omit it (both on screen and in the report image).
    const showMis = c => c.id==='pending' || c.id==='scheduled';
    const misPro = o => { const m=misForOrder(mis,o); if(!m) return 'Not in MIS'; if(m.committed) return 'Committed'; if(m.anyCommitted) return 'Committing '+m.committedQty+'/'+m.totalQty; return 'Pending'; };
    // ── Report as an aligned, bordered monospace table (WhatsApp text) ────────
    // The salesperson didn't want a PDF or image — just clean text they can drop
    // straight into the sales-team WhatsApp group. WhatsApp renders anything
    // wrapped in a ``` fence in a fixed-width font, so box-drawing borders and
    // space-padded rows line up into a real bordered table. Boxes are kept narrow
    // (inner width 27 → 31 chars wide) so they don't wrap on a phone. The bold
    // title and per-salesperson headers sit OUTSIDE the fence because *bold* is
    // not interpreted inside a ``` block. Plain text is Unicode, so amounts use
    // the real ₹ glyph (unlike the old jsPDF path, which was Latin-1 only).
    const IW = 27;                                  // inner width of each box row
    const clip = (s,n) => { s=String(s==null?'':s); return s.length>n ? s.slice(0,n-1)+'…' : s; };
    const bTop = '┌'+'─'.repeat(IW+2)+'┐';
    const bSep = '├'+'─'.repeat(IW+2)+'┤';
    const bBot = '└'+'─'.repeat(IW+2)+'┘';
    const bRow = s => { s=clip(s,IW); return '│ '+s+' '.repeat(IW-s.length)+' │'; };
    const inr  = n => '₹'+Math.round(n||0).toLocaleString('en-IN');
    const payText = o => { const {balance}=orderReceived(o); return balance>0 ? inr(balance)+' due' : 'Fully paid'; };
    // One bordered box for a salesperson, sectioned by category (Pending / Pending
    // Won / Scheduled / Delivered). MIS status is only shown where it's meaningful
    // (Pending / Scheduled), matching the on-screen report.
    const boxFor = name => {
      const rows = REPORT_CATS.map(c=>({c,os:bucket(name,c)})).filter(x=>x.os.length);
      const L = [bTop];
      rows.forEach(({c,os},ci)=>{
        L.push(bRow(c.label.toUpperCase()+' ('+os.length+')'));
        os.forEach((o,oi)=>{
          L.push(bRow('#'+(o.no||'—')+'  '+(o.customer||'—')));
          L.push(bRow(dlOf(o)+' · '+payText(o)));
          if(showMis(c)) L.push(bRow('MIS: '+misPro(o)));
          if(oi < os.length-1) L.push(bRow(''));
        });
        if(ci < rows.length-1) L.push(bSep);
      });
      L.push(bBot);
      return L.join('\n');
    };
    // The full WhatsApp message: bold title + one titled, fenced box per salesperson.
    const buildReportText = () => {
      let n=0; scope.forEach(nm=>REPORT_CATS.forEach(c=>{ n+=bucket(nm,c).length; }));
      const head = '*4S Interiors — Sales Follow-up*\n_As on '+prettyDate(new Date().toISOString().slice(0,10))+' · '+(reportSales||'All salespeople')+'_\n'+n+' open order'+(n===1?'':'s');
      const blocks = scope.map(name=>{
        const tot = REPORT_CATS.reduce((s,c)=>s+bucket(name,c).length,0);
        if(!tot) return '';
        const pv = pendValueOf(name);
        const pvLine = pv>0 ? '\n_Pending value (excl. GST): '+inr(pv)+'_' : '';
        return '*'+name.toUpperCase()+' · '+tot+' order'+(tot===1?'':'s')+'*'+pvLine+'\n```\n'+boxFor(name)+'\n```';
      }).filter(Boolean);
      return head+'\n\n'+blocks.join('\n\n');
    };
    // Copy to clipboard as a manual fallback (paste into any chat). Async Clipboard
    // API where available, execCommand('copy') via a temp textarea otherwise.
    const legacyCopy = txt => {
      try{
        const ta=document.createElement('textarea'); ta.value=txt;
        ta.style.position='fixed'; ta.style.opacity='0'; ta.style.top='0'; document.body.appendChild(ta);
        ta.focus(); ta.select();
        const done=document.execCommand('copy'); document.body.removeChild(ta); return done;
      }catch(e){ return false; }
    };
    // Open the share sheet with the report as PLAIN TEXT — text-only Web Share
    // works in the installed WebView where file share and blob downloads do not,
    // so this reliably reaches WhatsApp (the group is chosen inside WhatsApp).
    // Falls back to a wa.me deep link if the share sheet isn't available.
    const openWhatsAppText = msg => { try{ window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank'); }catch(e){} };
    const shareReportText = () => {
      if(nothing){ ctx.showToast&&ctx.showToast('No open orders to report','ok'); return; }
      const msg = buildReportText();
      try{
        if(navigator.share){
          navigator.share({text:msg}).catch(err=>{ if(!(err&&err.name==='AbortError')) openWhatsAppText(msg); });
          return;
        }
      }catch(e){}
      openWhatsAppText(msg);
    };
    const copyReportText = () => {
      if(nothing){ ctx.showToast&&ctx.showToast('No open orders to report','ok'); return; }
      const msg = buildReportText();
      const ok  = () => ctx.showToast&&ctx.showToast('Report copied — paste into WhatsApp','ok');
      const bad = () => ctx.showToast&&ctx.showToast('Could not copy the report','bad');
      try{
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(msg).then(ok, ()=>{ legacyCopy(msg)?ok():bad(); });
          return;
        }
      }catch(e){}
      legacyCopy(msg)?ok():bad();
    };
    // ── Pending value summary (by salesperson) ────────────────────────────────
    // A compact roll-up — for each salesperson in scope, their Pending + Pending
    // Won order count and pending value (excl. GST), grouped by name, with a TOTAL
    // across everyone. This is a standalone message the owner can send on its own,
    // separate from the detailed per-order follow-up above. Same narrow fenced box
    // so it lines up on a phone; name+(count) is left-aligned, the value right.
    const pendPeople = scope.filter(name=>pendCountOf(name)>0);
    const noPend = !pendPeople.length;
    const sumRow = (label,n,v) => {
      const right = inr(v);
      const left  = clip(label+' ('+n+')', IW-right.length-1);
      return '│ '+left+' '.repeat(Math.max(1,IW-left.length-right.length))+right+' │';
    };
    const buildPendSummaryText = () => {
      const rows = pendPeople.map(name=>({name,n:pendCountOf(name),v:pendValueOf(name)}));
      const totN = rows.reduce((s,r)=>s+r.n,0);
      const totV = rows.reduce((s,r)=>s+r.v,0);
      const head = '*4S Interiors — Pending Order Value*\n_As on '+prettyDate(new Date().toISOString().slice(0,10))+' · excl. GST · '+(reportSales||'All salespeople')+'_';
      const L = [bTop];
      rows.forEach(r=>L.push(sumRow(r.name,r.n,r.v)));
      L.push(bSep);
      L.push(sumRow('TOTAL',totN,totV));
      L.push(bBot);
      return head+'\n```\n'+L.join('\n')+'\n```';
    };
    const sharePendSummary = () => {
      if(noPend){ ctx.showToast&&ctx.showToast('No pending order value to send','ok'); return; }
      const msg = buildPendSummaryText();
      try{
        if(navigator.share){
          navigator.share({text:msg}).catch(err=>{ if(!(err&&err.name==='AbortError')) openWhatsAppText(msg); });
          return;
        }
      }catch(e){}
      openWhatsAppText(msg);
    };
    const copyPendSummary = () => {
      if(noPend){ ctx.showToast&&ctx.showToast('No pending order value to send','ok'); return; }
      const msg = buildPendSummaryText();
      const ok  = () => ctx.showToast&&ctx.showToast('Summary copied — paste into WhatsApp','ok');
      const bad = () => ctx.showToast&&ctx.showToast('Could not copy the summary','bad');
      try{
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(msg).then(ok, ()=>{ legacyCopy(msg)?ok():bad(); });
          return;
        }
      }catch(e){}
      legacyCopy(msg)?ok():bad();
    };
    const chip = sel => ({padding:'6px 10px',borderRadius:999,border:`1px solid ${sel?T.ink:T.line}`,background:sel?T.ink:'#fff',color:sel?'#fff':T.ink2,fontSize:12,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap',flexShrink:0});
    return (
      <div className="screen">
        <div style={{flexShrink:0}}>
          <div style={{display:'flex',alignItems:'center',gap:8,padding:'12px 14px 8px'}}>
            <button onClick={()=>{setReportSales('');setReportView(false);}} title="Back" style={{width:32,height:32,borderRadius:6,background:'#fff',border:`1px solid ${T.line}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>{Icon.back()}</button>
            <div style={{flex:1}}>
              <div style={{fontSize:11,color:T.ink4,fontFamily:T.mono,letterSpacing:1}}>ORDERS · SALES TEAM REPORT</div>
              <div style={{fontSize:20,fontWeight:700,letterSpacing:-0.4}}>Sales Team Report</div>
            </div>
          </div>
          <div style={{fontSize:12,color:T.ink4,padding:'0 18px 8px'}}>Open orders per salesperson across Pending, Pending Won, Scheduled &amp; Delivered — sent as a clean, bordered text table you can drop straight into the sales-team WhatsApp group.</div>
          {/* Whom to include — the whole team, or a single salesperson */}
          {reportPeople.length>0 && (
            <div style={{display:'flex',gap:6,padding:'0 14px 8px',overflowX:'auto',WebkitOverflowScrolling:'touch'}}>
              <div onClick={()=>setReportSales('')} style={chip(!reportSales)}>All</div>
              {reportPeople.map(n=>(<div key={n} onClick={()=>setReportSales(n===reportSales?'':n)} style={chip(reportSales===n)}>{n}</div>))}
            </div>
          )}
          {/* Full per-order follow-up report */}
          <div style={{display:'flex',gap:8,padding:'0 14px 6px'}}>
            <button onClick={shareReportText} style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',gap:8,padding:'11px 14px',borderRadius:10,border:'none',background:'#25d366',color:'#fff',fontSize:14,fontWeight:700,cursor:'pointer'}}>{Icon.whatsapp('#fff',16)} Send full report</button>
            <button onClick={copyReportText} style={{padding:'11px 14px',borderRadius:10,border:`1px solid ${T.line}`,background:'#fff',color:T.ink2,fontSize:14,fontWeight:700,cursor:'pointer'}}>Copy</button>
          </div>
          {/* Pending value summary — value + order count per salesperson, with a total */}
          <div style={{display:'flex',gap:8,padding:'0 14px 10px'}}>
            <button onClick={sharePendSummary} disabled={noPend} style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',gap:8,padding:'11px 14px',borderRadius:10,border:`1px solid ${noPend?T.line:'#25d366'}`,background:'#fff',color:noPend?T.ink4:'#128c3e',fontSize:14,fontWeight:700,cursor:noPend?'default':'pointer'}}>{Icon.whatsapp(noPend?T.ink4:'#128c3e',16)} Send value summary</button>
            <button onClick={copyPendSummary} disabled={noPend} style={{padding:'11px 14px',borderRadius:10,border:`1px solid ${T.line}`,background:'#fff',color:noPend?T.ink4:T.ink2,fontSize:14,fontWeight:700,cursor:noPend?'default':'pointer'}}>Copy</button>
          </div>
        </div>
        <div className="scroll" style={{padding:'4px 14px 24px'}}>
          {scope.map(name=>{
            const rows = REPORT_CATS.map(c=>({c,os:bucket(name,c)})).filter(x=>x.os.length);
            if(!rows.length) return null;
            const tot = rows.reduce((s,x)=>s+x.os.length,0);
            return (
              <div key={name} style={{background:'#fff',border:`1px solid ${T.line}`,borderRadius:12,padding:'12px 14px',marginTop:10}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:pendValueOf(name)>0?4:8}}>
                  <div style={{fontSize:15,fontWeight:800,color:T.ink}}>{name}</div>
                  <div style={{fontSize:11,color:T.ink4,fontFamily:T.mono,fontWeight:700}}>{tot} order{tot===1?'':'s'}</div>
                </div>
                {pendValueOf(name)>0 && (
                  <div style={{fontSize:11,color:T.ink3,marginBottom:8}}>
                    Pending order value <span style={{color:T.ink4}}>(excl. GST)</span>: <span style={{fontFamily:T.mono,fontWeight:800,color:T.ink}}>{money(pendValueOf(name))}</span>
                  </div>
                )}
                {rows.map(({c,os})=>(
                  <div key={c.id} style={{marginBottom:8}}>
                    <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
                      <span style={{width:8,height:8,borderRadius:2,background:c.tone}}/>
                      <span style={{fontSize:12,fontWeight:700,color:T.ink2}}>{c.label}</span>
                      <span style={{fontSize:11,color:T.ink4}}>· {os.length}</span>
                    </div>
                    {os.map(o=>(
                      <div key={o.no} onClick={()=>openOrder(o)} style={{padding:'6px 8px',borderLeft:`3px solid ${c.tone}`,background:T.paper2,borderRadius:6,marginBottom:4,cursor:'pointer'}}>
                        <div style={{fontSize:12,fontWeight:700,color:T.ink}}><span style={{fontFamily:T.mono}}>#{o.no||'—'}</span> · {o.customer||'—'}</div>
                        <div style={{fontSize:11,color:T.ink3,marginTop:2}}>{showMis(c)?`MIS: ${misOf(o)} · `:''}Dly: {dlOf(o)} · {payOf(o)}</div>
                      </div>
                    ))}
                  </div>
                ))}
              </div>
            );
          })}
          {nothing && (
            <div style={{padding:'48px 24px',textAlign:'center'}}>
              <div style={{width:52,height:52,borderRadius:14,background:T.okSoft,display:'inline-flex',alignItems:'center',justifyContent:'center',marginBottom:12,fontSize:26,color:T.ok}}>✓</div>
              <div style={{fontSize:14,fontWeight:700,color:T.ink2,marginBottom:4}}>Nothing to follow up</div>
              <div style={{fontSize:12,color:T.ink4,lineHeight:1.5}}>No open orders in Pending, Pending Won, Scheduled or Delivered{reportSales?' for '+reportSales:''}.</div>
            </div>
          )}
        </div>
        {serviceOrder && <ServiceRequestModal order={serviceOrder} ctx={ctx} onClose={()=>setServiceOrder(null)}/>}
        <BottomNav screen="history" nav={nav}/>
      </div>
    );
  }

  // ── Orders by Date drill-down ──────────────────────────────────────────────
  // Groups orders by their booking date (Today, Yesterday, then each earlier day)
  // and offers a from–to range filter. Reached from the "Orders by Date" box on
  // the ledger. Salesperson + search filters from the ledger still apply here.
  if (dateView) {
    // Relative heading for a booking date's ISO (yyyy-mm-dd).
    const dateBucketLabel = iso => {
      const dd = daysFromToday(iso);
      if (dd === 0)  return 'Today';
      if (dd === -1) return 'Yesterday';
      return prettyDate(iso);
    };
    const dated = orders.filter(o=>o.status!=='draft').filter(matchesQuery).filter(matchesSales);
    const groupsMap = {};
    let rangeCount = 0, rangeAmt = 0, undated = 0;
    dated.forEach(o=>{
      const iso = _toISO(o.date);
      if(!iso){ undated++; return; }
      if(dateFrom && iso < dateFrom) return;
      if(dateTo   && iso > dateTo)   return;
      (groupsMap[iso]=groupsMap[iso]||[]).push(o);
      rangeCount++; rangeAmt += (o.amt||0);
    });
    const groups = Object.keys(groupsMap).sort((a,b)=> a<b?1:-1).map(iso=>({iso,orders:groupsMap[iso]}));
    const inp = {padding:'8px 10px',borderRadius:8,border:`1px solid ${T.line}`,background:'#fff',color:T.ink,fontSize:13,fontFamily:T.mono,width:'100%',WebkitAppearance:'none',appearance:'none'};
    const lbl = {fontSize:10,color:T.ink4,fontWeight:700,letterSpacing:.5,marginBottom:4};
    return (
      <div className="screen">
        <div style={{flexShrink:0}}>
          <div style={{display:'flex',alignItems:'center',gap:8,padding:'12px 14px 8px'}}>
            <button onClick={()=>setDateView(false)} title="Back" style={{width:32,height:32,borderRadius:6,background:'#fff',border:`1px solid ${T.line}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>{Icon.back()}</button>
            <div style={{flex:1}}>
              <div style={{fontSize:11,color:T.ink4,fontFamily:T.mono,letterSpacing:1}}>ORDERS · BY DATE</div>
              <div style={{fontSize:20,fontWeight:700,letterSpacing:-0.4}}>Orders by Date</div>
            </div>
          </div>
          {/* From–to date-range filter */}
          <div style={{padding:'2px 14px 8px'}}>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr auto',gap:8,alignItems:'end'}}>
              <div><div style={lbl}>FROM</div><input type="date" value={dateFrom} max={dateTo||undefined} onChange={e=>setDateFrom(e.target.value)} style={inp}/></div>
              <div><div style={lbl}>TO</div><input type="date" value={dateTo} min={dateFrom||undefined} onChange={e=>setDateTo(e.target.value)} style={inp}/></div>
              <button onClick={()=>{setDateFrom('');setDateTo('');}} disabled={!dateFrom&&!dateTo} style={{padding:'8px 12px',borderRadius:8,border:`1px solid ${T.line}`,background:(!dateFrom&&!dateTo)?T.paper2:'#fff',color:(!dateFrom&&!dateTo)?T.ink4:T.ink2,fontSize:12,fontWeight:600,cursor:(!dateFrom&&!dateTo)?'default':'pointer'}}>Clear</button>
            </div>
            <div style={{fontSize:11,color:T.ink4,marginTop:8}}>
              <span style={{fontWeight:700,color:T.ink2}}>{rangeCount}</span> {rangeCount===1?'order':'orders'}
              {(dateFrom||dateTo) && ' in range'} · <span style={{fontFamily:T.mono,fontWeight:700,color:T.ink2}}>₹{Math.round(rangeAmt).toLocaleString('en-IN')}</span>
            </div>
          </div>
        </div>
        <div className="scroll">
          {groups.map(g=>(
            <div key={g.iso}>
              <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between',gap:8,padding:'12px 18px 6px',background:T.paper2,borderBottom:`1px solid ${T.line}`}}>
                <span style={{fontSize:13,fontWeight:700,color:T.ink}}>{dateBucketLabel(g.iso)}</span>
                <span style={{fontSize:11,color:T.ink4,fontFamily:T.mono}}>{g.orders.length} {g.orders.length===1?'order':'orders'} · ₹{Math.round(g.orders.reduce((s,o)=>s+(o.amt||0),0)).toLocaleString('en-IN')}</span>
              </div>
              {g.orders.map(orderCard)}
            </div>
          ))}
          {groups.length===0 && (
            <div style={{padding:'48px 24px',textAlign:'center'}}>
              <div style={{width:52,height:52,borderRadius:14,background:T.paper2,display:'inline-flex',alignItems:'center',justifyContent:'center',marginBottom:12}}>{Icon.doc(T.ink4,24)}</div>
              <div style={{fontSize:14,fontWeight:700,color:T.ink2,marginBottom:4}}>No orders {(dateFrom||dateTo)?'in this date range':'to show'}</div>
              <div style={{fontSize:12,color:T.ink4,lineHeight:1.5}}>{(dateFrom||dateTo)?'Try widening or clearing the date range.':'Orders you book will appear here, grouped by day.'}</div>
            </div>
          )}
          {undated>0 && <div style={{padding:'10px 18px 0',fontSize:11,color:T.ink4}}>{undated} order{undated===1?'':'s'} without a booking date {(dateFrom||dateTo)?'excluded from the range':'not shown'}.</div>}
          <div style={{height:24}}/>
        </div>
        {partialOrder && <PartialDeliveryModal order={partialOrder} onCancel={()=>setPartialOrder(null)} onConfirm={confirmPartial}/>}
        {rescheduleOrder && <RescheduleModal order={rescheduleOrder} onCancel={()=>setRescheduleOrder(null)} onConfirm={confirmReschedule}/>}
        {serviceOrder && <ServiceRequestModal order={serviceOrder} ctx={ctx} onClose={()=>setServiceOrder(null)}/>}
        <BottomNav screen="history" nav={nav}/>
      </div>
    );
  }

  return (
    <div className="screen">
      <div style={{flexShrink:0}}>
        <div style={{padding:'14px 18px 8px',display:'flex',justifyContent:'space-between',alignItems:'flex-end'}}>
          <div><div style={{fontSize:11,color:T.ink4,fontFamily:T.mono,letterSpacing:1}}>LEDGER · {orders.length} ORDERS</div><div style={{fontSize:22,fontWeight:700,letterSpacing:-0.5,marginTop:2}}>Orders</div></div>
          <Btn size="sm" icon={Icon.refresh(T.ink2,14)} onClick={()=>{loadOrders();loadMis({});}} disabled={misLoading}>Refresh</Btn>
        </div>

// ─── WON Update ──────────────────────────────────────────────
function WONUpdateScreen({ctx,orderOverride,onClose}) {
  const o = orderOverride || ctx.order;
  const {nav,doUpdateWON} = ctx;
  const [won,setWon] = useState('');
  const items = o.items || [];
  // Pre-select the items that don't yet carry a SO/WON.
  const [sel,setSel] = useState(()=>items.map(it=>!String(it.won||'').trim()));
  const toggle = i => setSel(prev=>prev.map((v,j)=>j===i?!v:v));
  const anySel = sel.some(Boolean);

  async function submit() {
    if(!won||won.length<6) return ctx.showToast('Enter a valid SO / WON number','bad');
    if(items.length && !anySel) return ctx.showToast('Select at least one item for this SO No','bad');
    const wonFmt = won.toUpperCase().startsWith('WON')?won.toUpperCase():'WON'+won.toUpperCase();
    // When every item is selected (or the order has no reconstructed items) send
    // no index list → apply to the whole order.
    const idxs = items.length && !sel.every(Boolean) ? sel.map((v,i)=>v?i:-1).filter(i=>i>=0) : null;
    const ok = await doUpdateWON(o.no, o.internalNo, wonFmt, idxs);
    if(ok) { if(onClose) onClose(); else nav('history'); }
  }
  return (
    <div className="screen">
      <div style={{display:'flex',alignItems:'center',gap:8,padding:'10px 14px 14px',flexShrink:0}}>
        <button onClick={()=>onClose?onClose():nav('history')} title="Back" style={{width:32,height:32,borderRadius:6,background:'#fff',border:`1px solid ${T.line}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>{Icon.back()}</button>
        <button onClick={()=>{ if(onClose) onClose(); nav('home'); }} title="Home" style={{width:32,height:32,borderRadius:6,background:'#fff',border:`1px solid ${T.line}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>{Icon.home(T.ink2,18)}</button>
        <div style={{fontSize:18,fontWeight:700,letterSpacing:-0.4}}>Update SO No / WON</div>
      </div>
      <div className="scroll" style={{padding:'0 18px'}}>
        <div style={{background:'#fff',border:`1px solid ${T.line}`,borderRadius:8,padding:14,marginBottom:14}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:4}}>
            <span style={{fontFamily:T.mono,fontSize:11,color:T.ink2,fontWeight:600}}>{o.no}</span>
            {o.won?<Pill tone="ok" mono size="sm">{o.won}</Pill>:<Pill tone="warn" size="sm">PENDING SO</Pill>}
          </div>
          <div style={{fontSize:16,fontWeight:700}}>{o.customer}</div>
          <div style={{fontSize:11,color:T.ink4,marginTop:2,fontFamily:T.mono}}>{o.date} · ₹{(o.amt||0).toLocaleString('en-IN')}</div>
        </div>
        <div style={{fontSize:10,color:T.ink4,fontWeight:700,letterSpacing:1,marginBottom:8}}>GODREJ SO / WON NUMBER</div>
        <div style={{background:'#fff',border:`2px solid ${T.green}`,borderRadius:8,padding:'14px 16px',marginBottom:14}}>
          <input value={won} onChange={e=>setWon(e.target.value)} placeholder="WON036031" autoCapitalize="characters" style={{width:'100%',border:'none',outline:'none',fontFamily:T.mono,fontSize:24,fontWeight:700,letterSpacing:1.5,color:T.ink,background:'transparent'}}/>
          <div style={{fontSize:11,color:T.ink4,marginTop:4}}>From Godrej confirmation email</div>
        </div>
        {items.length>0&&(
          <>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:8}}>
              <span style={{fontSize:10,color:T.ink4,fontWeight:700,letterSpacing:1}}>APPLY TO ITEMS</span>
              <span onClick={()=>setSel(items.map(()=>!sel.every(Boolean)))} style={{fontSize:11,color:T.green,fontWeight:700,cursor:'pointer'}}>{sel.every(Boolean)?'Clear all':'Select all'}</span>
            </div>
            <div style={{background:'#fff',border:`1px solid ${T.line}`,borderRadius:8,overflow:'hidden',marginBottom:16}}>
              {items.map((it,i)=>(
                <label key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderBottom:i<items.length-1?`1px solid ${T.line}`:'none',cursor:'pointer'}}>
                  <input type="checkbox" checked={!!sel[i]} onChange={()=>toggle(i)} style={{width:16,height:16,accentColor:T.green,cursor:'pointer'}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:600,color:T.ink}}>{it.name||it.code||('Item '+(i+1))}</div>
                    <div style={{fontSize:10,color:T.ink4,fontFamily:T.mono,marginTop:1}}>{it.code} · ×{it.qty}{it.won?' · SO '+it.won:''}</div>
                  </div>
                  {it.won?<Pill tone="ok" mono size="sm">{it.won}</Pill>:null}
                </label>
              ))}
            </div>
          </>
        )}
        <div style={{padding:12,background:T.greenSoft,border:`1px solid ${T.greenLine}`,borderRadius:6,display:'flex',gap:10,marginBottom:20}}>
          {Icon.bolt(T.green,14)}
          <div style={{fontSize:11.5,color:T.ink2,lineHeight:1.5}}><b style={{color:T.green}}>Multiple SO numbers:</b> select only the items this SO No covers. Run this again with another SO No for the remaining items.</div>
        </div>
        <Btn primary full size="lg" onClick={submit}>Update SO No</Btn>
        <div style={{height:20}}/>
      </div>
    </div>
  );
}

// Ask the OS for permission to show background notifications (delivery deadlines,
// MIS commitments). Safe to call repeatedly — resolves immediately if already set.
function requestNotifPermission() {
  if (!('Notification' in window)) return Promise.resolve('unsupported');
  if (Notification.permission !== 'default') return Promise.resolve(Notification.permission);
  return Notification.requestPermission().catch(() => 'denied');
}

async function ssCopy(text, label, showToast) {
  const val = String(text || '').trim();
  if (!val) { showToast && showToast('Nothing to copy', 'warn'); return; }
  try {
    await navigator.clipboard.writeText(val);
    showToast && showToast((label || 'Copied') + ' copied ✓');
  } catch (e) {
    try {
      const ta = document.createElement('textarea');
      ta.value = val; ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy'); ta.remove();
      showToast && showToast((label || 'Copied') + ' copied ✓');
    } catch (_) { showToast && showToast('Could not copy — long-press to select', 'bad'); }
  }
}

function PartialDeliveryModal({order, onCancel, onConfirm}) {
  const items = order.items || [];
  const already = order.deliveredItems || [];
  // Pre-tick items previously marked delivered (match by index, else by code).
  const [sel, setSel] = useState(() => items.map((it,i) =>
    already.some(d => (d && typeof d==='object') ? (d.i===i || (d.code && d.code===it.code)) : (d===i))
  ));
  const toggle = i => setSel(prev => prev.map((v,j)=>j===i?!v:v));
  const anySel = sel.some(Boolean);
  const delivered = sel.filter(Boolean).length;

  function confirm() {
    const deliveredItems = items.map((it,i)=>({ i, code: it.code||'', name: it.name||it.code||('Item '+(i+1)) })).filter((_,i)=>sel[i]);
    onConfirm(deliveredItems);
  }
  return (
    <div style={{position:'fixed',inset:0,zIndex:9995,background:'rgba(10,15,13,.45)',display:'flex',alignItems:'flex-end',justifyContent:'center'}} onClick={onCancel}>
      <div onClick={e=>e.stopPropagation()} style={{width:'100%',maxWidth:430,background:T.paper,borderTopLeftRadius:16,borderTopRightRadius:16,maxHeight:'85vh',display:'flex',flexDirection:'column',animation:'slideUp .2s ease'}}>
        <div style={{padding:'14px 18px 10px',borderBottom:`1px solid ${T.line}`}}>
          <div style={{fontSize:17,fontWeight:700,letterSpacing:-0.3}}>Partial Delivery</div>
          <div style={{fontSize:11.5,color:T.ink4,marginTop:2}}>Tick the items that have been delivered. The rest stay <b>Pending for Delivery</b>.</div>
        </div>
        <div style={{overflowY:'auto',flex:1,padding:'6px 0'}}>
          {items.length===0 && <div style={{padding:24,textAlign:'center',fontSize:13,color:T.ink4}}>This order has no line items to pick from.</div>}
          {items.map((it,i)=>(
            <label key={i} style={{display:'flex',alignItems:'center',gap:12,padding:'11px 18px',background:'#fff',borderBottom:`1px solid ${T.line}`,cursor:'pointer'}}>
              <input type="checkbox" checked={!!sel[i]} onChange={()=>toggle(i)} style={{width:18,height:18,accentColor:T.green,cursor:'pointer'}}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:600,color:T.ink}}>{it.name||it.code||('Item '+(i+1))}</div>
                <div style={{fontSize:10,color:T.ink4,fontFamily:T.mono,marginTop:1}}>{it.code} · ×{it.qty}</div>
              </div>
              <Pill tone={sel[i]?'ok':'warn'} size="sm">{sel[i]?'Delivered':'Pending'}</Pill>
            </label>
          ))}
        </div>
        <div style={{padding:'10px 16px',borderTop:`1px solid ${T.line}`,background:'#fff'}}>
          <div style={{fontSize:11,color:T.ink3,textAlign:'center',marginBottom:8}}>{delivered} delivered · {items.length-delivered} pending for delivery</div>
          <div style={{display:'flex',gap:8}}>
            <Btn onClick={onCancel}>Cancel</Btn>
            <Btn primary full onClick={confirm} disabled={!anySel}>Save Partial Delivery</Btn>
          </div>
        </div>
      </div>
    </div>
  );
}

function SettingsScreen({ctx}) {
  const {user,syncedAt,priceSyncedAt,priceSyncError,priceItems,nav,syncStock,syncPriceList,doSignOut,showToast,loading} = ctx;
  const [apiUrl,setApiUrl]         = useState(localStorage.getItem('4s_api_url')||'');
  const [pingResult,setPingResult] = useState(null);
  const [pinging,setPinging]       = useState(false);
  const [debugResult,setDebugResult] = useState(null);
  const [debugging,setDebugging]   = useState(false);
  const isAdmin = normRole(user?.role) === 'admin';
  // App-order serial counter (admin control)
  const [serial,setSerial]         = useState(null);   // {lastIssued,nextWillBe}
  const [serialInput,setSerialInput] = useState('');
  const [serialSaving,setSerialSaving] = useState(false);
  // Audit log (admin) — who created / edited / deleted / updated which order.
  const [audit,setAudit]           = useState(null);   // null = not loaded; [] = loaded empty
  const [auditLoading,setAuditLoading] = useState(false);
  async function loadAudit() {
    if (!isAdmin) return;
    setAuditLoading(true);
    try {
      const res = await apiGet('auditLog', {limit:100, by:user?.code}, 15000);
      if (res && res.ok) setAudit(res.entries||[]);
      else showToast(res?.error||'Could not load the audit log','bad');
    } catch(e) { showToast(e.message,'bad'); }
    finally { setAuditLoading(false); }
  }

  async function loadSerial() {
    if (!isAdmin) return;
    try {
      const res = await apiGet('getAppSerial', {}, 12000);
      if (res && res.ok) { setSerial(res); setSerialInput(String(res.nextWillBe)); }
    } catch(e) {}
  }
  useEffect(() => { loadSerial(); }, []);

  async function saveSerial() {
    const next = parseInt(String(serialInput).replace(/[^\d]/g,''), 10);
    if (!isFinite(next) || next < 1) { showToast('Enter the next order number (1 or more)','warn'); return; }
    if (serial && next === serial.nextWillBe) { showToast('Already set to '+next); return; }
    if (!window.confirm('Set the NEXT app order number to '+next+'?\n\nExisting orders keep their numbers; this only affects new orders from now on.')) return;
    setSerialSaving(true);
    try {
      const res = await apiPost({ action:'setAppSerial', next, by: user?.code, updatedBy: user?.name });
      if (res && res.ok) { setSerial(res); setSerialInput(String(res.nextWillBe)); showToast('Next order number set to '+res.nextWillBe+' ✓'); }
      else showToast(res?.error || 'Could not update the counter','bad');
    } catch(e) { showToast(e.message,'bad'); }
    finally { setSerialSaving(false); }
  }

  async function runDebug() {
    setDebugging(true); setDebugResult(null);
    try {
      const res = await apiGet('debugPriceList', {}, 20000);
      setDebugResult(res);
    } catch(e) {
      setDebugResult({ ok:false, error: e.message });
    } finally { setDebugging(false); }
  }

  function saveUrl() {
    const trimmed = apiUrl.trim();
    localStorage.setItem('4s_api_url', trimmed);
    setPingResult(null);
    showToast('URL saved ✓ — tap "Test connection" to verify');
  }

  async function testConnection() {
    const url = ((apiUrl||'').trim() || localStorage.getItem('4s_api_url') || '').trim();
    if (!url) { showToast('No backend URL configured', 'warn'); return; }
    setPinging(true); setPingResult(null);
    const out = { url };
    // Which service worker is actually controlling this page (tells us if a stale
    // worker is still installed after a deploy).
    try {
      const c = navigator.serviceWorker && navigator.serviceWorker.controller;
      out.sw = c ? c.scriptURL : 'none (no controlling worker)';
    } catch(e) { out.sw = 'unknown'; }
    // 1) READ transport — JSONP GET (the path that already works for you).
    try {
      const g = await apiGet('ping', {}, 20000, 1);
      out.read = (g && g.ok) ? 'OK ✓' : ('server replied: ' + ((g && g.error) || 'unknown error'));
      out.readOk = !!(g && g.ok);
    } catch(e) { out.read = 'FAILED — ' + e.message; out.readOk = false; }
    // 2) WRITE transport — a RAW fetch POST, bypassing the app's retry/offline
    //    guards so we see the true HTTP result. Uses a no-op action the backend
    //    doesn't recognise, so it writes NOTHING (doPost just replies
    //    { ok:false, error:'Unknown action…' }). If we get ANY JSON reply back,
    //    the write transport works and the outage is elsewhere; if this throws,
    //    the POST itself can't reach the server (network / CORS / redirect).
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 30000);
      const r = await fetch(url, {
        method: 'POST',
        body: JSON.stringify({ action: '__diag_ping' }),
        headers: { 'Content-Type': 'text/plain' },
        redirect: 'follow',
        signal: ctrl.signal,
      });
      clearTimeout(t);
      let txt = '';
      try { txt = await r.text(); } catch(e) { txt = '(could not read body)'; }
      out.write = 'reached server — HTTP ' + r.status + ' [' + r.type + '] · ' + String(txt).slice(0, 200);
      out.writeOk = true;
    } catch(e) {
      out.write = 'FAILED — ' + (e && e.name ? e.name + ': ' : '') + (e && e.message ? e.message : String(e));
      out.writeOk = false;
    }
    setPingResult(out);
    setPinging(false);

<!-- ═══════════════════════════════════════════════════════════
     SERVICE WORKER REGISTRATION
     Must run after the page loads (not inside Babel script tag)
     ════════════════════════════════════════════════════════ -->
<script>
// NATIVE APK BUILD: The Capacitor shell serves these bundled assets locally,
// so the app already works fully offline without a service worker. We do NOT
// register the PWA service worker here (its cache paths target the GitHub Pages
// deployment, not this local origin). Defensively unregister any stale worker.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations()
    .then(regs => regs.forEach(r => r.unregister()))
    .catch(() => {});
}

// PWA install prompt (Android Chrome "Add to Home Screen" banner)
let deferredInstallPrompt = null;
const banner = document.getElementById('install-banner');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  // Show our banner after 3 s so it doesn't interrupt the first load
  setTimeout(() => { if (banner) banner.classList.add('visible'); }, 3000);
});

if (banner) {
  banner.addEventListener('click', async () => {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    const { outcome } = await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    banner.classList.remove('visible');
    console.log('Install outcome:', outcome);
  });
}

window.addEventListener('appinstalled', () => {
  banner.classList.remove('visible');
  console.log('PWA installed successfully');
});
</script>
